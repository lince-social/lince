name: Android smoke from existing APK

on:
  workflow_dispatch:
    inputs:
      apk_run:
        description: Same-repository workflow run containing the x86_64 smoketest APK
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APK_RUN: ${{ inputs.apk_run }}
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: '1.96.0'
      RUSTFLAGS: '-D warnings'
    steps:
      - name: Validate APK run
        run: '[[ "$APK_RUN" =~ ^[0-9]+$ ]]'
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lince-android-x86_64-smoketest
          run-id: ${{ inputs.apk_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: target/smoke-apk
      - name: Verify APK checksum and record provenance
        run: |
          cd target/smoke-apk
          sha256sum app-debug.apk | diff -u app-debug.apk.sha256 -
          apk_sha=$(sha256sum app-debug.apk)
          mkdir -p ../android-smoke
          jq -n --arg source "$GITHUB_SHA" --arg apk_run "$APK_RUN" --arg apk_sha256 "${apk_sha%% *}" '{adapter_source: $source, apk_run: $apk_run, apk_sha256: $apk_sha256}' > ../android-smoke/provenance.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android tools
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-smoke-host
          cache-on-failure: true
      - name: Prepare host smoke adapter
        run: cargo run --locked -p xtask -- android-smoke --help
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise existing APK on 16 KB Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: cargo run --locked -p xtask -- android-smoke --device emulator-5554 --pagesize 16384 --apk target/smoke-apk/app-debug.apk --output target/android-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence
          path: target/android-smoke
          if-no-files-found: warn
