name: Linux Lince and Park

on:
  # schedule:
  #   - cron: '17 6 * * *'
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/**'
      - 'institute/scripts/**'
      - 'institute/packaging/**'
  workflow_dispatch:
    inputs:
      rust_version:
        description: Automatic Rust update candidate; checks on main only
        type: string
        default: ''
      build_release:
        description: Build the optimized Linux binary instead of checks only
        type: boolean
        default: true
      publish_release:
        description: Publish the built release on main or a version tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lince-build-release-deploy-${{ github.event_name == 'schedule' && 'rust-update' || inputs.rust_version && format('rust-validation-{0}', inputs.rust_version) || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  LINCE_CI_LINKER: mold
  LINCE_BUILD_ENVIRONMENT: "1"

jobs:
  rust-update:
    if: github.event_name == 'schedule'
    name: Update stable Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Discover latest stable Rust
        id: stable
        run: |
          latest=$(python3 -B institute/scripts/update-rust-toolchain.py --latest)
          current=$(bash institute/scripts/rust-channel.sh)
          if [[ "$current" == "version=$latest" ]]; then
            echo 'update=false' >> "$GITHUB_OUTPUT"
          else
            echo 'update=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: cachix/install-nix-action@v31.11.3
        if: steps.stable.outputs.update == 'true'
      - name: Validate and apply shared Rust update
        if: steps.stable.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash institute/scripts/ci-update-rust.sh
  checks:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && !inputs.build_release)
    name: Linux compile checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select Rust update candidate for checks
        if: github.event_name == 'workflow_dispatch' && inputs.rust_version != ''
        env:
          RUST_CANDIDATE: ${{ inputs.rust_version }}
          BUILD_RELEASE: ${{ inputs.build_release }}
        run: |
          [[ "$BUILD_RELEASE" == false ]]
          python3 -B institute/scripts/update-rust-toolchain.py --candidate "$RUST_CANDIDATE"
      - name: Read pinned Rust version
        id: toolchain
        run: bash institute/scripts/rust-channel.sh >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - name: Prepare Linux compiler and libraries
        run: bash institute/scripts/ci-linux-setup.sh
      - uses: ./.github/actions/rust-artifacts
        id: cache
        with:
          scope: linux-checks
      - name: Check Lince, Park and development tools
        run: |
          cargo check --locked -p lince -p xtask -p lince-park-clients --features lince/instinct,lince/park --timings
          cargo check --locked -p lince --no-default-features --features instinct --timings
      - name: Save compiled inputs
        if: ${{ !cancelled() && steps.cache.outputs.hit != 'true' && steps.cache.outputs.key != '' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ steps.cache.outputs.paths }}
          key: ${{ steps.cache.outputs.key }}
      - name: Upload compilation timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-check-timings
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7
  binary:
    if: github.event_name != 'schedule' && github.event_name != 'pull_request' && github.ref != 'refs/heads/dev' && (github.event_name != 'workflow_dispatch' || inputs.build_release)
    name: Linux release
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BUILD_TARGET: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Restrict compiler candidates to checks
        if: github.event_name == 'workflow_dispatch' && inputs.rust_version != ''
        run: exit 1

      - name: Read pinned Rust version
        id: toolchain
        shell: bash
        run: bash institute/scripts/rust-channel.sh >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        id: rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          targets: ${{ env.BUILD_TARGET }}

      - name: Prepare Linux compiler and libraries
        run: bash institute/scripts/ci-linux-setup.sh
      - uses: ./.github/actions/rust-artifacts
        id: cache
        with:
          scope: linux-release
          target: ${{ env.BUILD_TARGET }}

      - name: Build native Lince
        timeout-minutes: 105
        env:
          LINCE_REVISION: ${{ github.sha }}
          BUILD_TARGET: ${{ env.BUILD_TARGET }}
        run: |
          mkdir -p target
          cargo xtask park release --target "$BUILD_TARGET" > target/release-build-info.json
          if [[ "$BUILD_TARGET" == *-linux-gnu ]]; then
            bash institute/packaging/linux/check-build-info.sh target/release-build-info.json
          fi
        shell: bash

      - name: Package Linux binary
        run: |
          mkdir -p binary-artifacts
          bash institute/packaging/linux/package.sh "target/$BUILD_TARGET/release/lince" "binary-artifacts/lince-$BUILD_TARGET.tar.gz"

      - name: Verify performance report accounting
        run: python3 -B -m unittest discover -s institute/scripts/park -p 'test_*.py'

      - name: Compile matching performance validation artifacts
        env:
          LINCE_REVISION: ${{ github.sha }}
        run: |
          cargo check --locked --target "$BUILD_TARGET" -p lince-park --features session,server-tests --tests
          cargo test --locked --profile release --target "$BUILD_TARGET" -p lince-interface -p lince-park --features lince-interface/native-presentation,lince-park/session,lince-park/server-tests --lib --no-run --message-format=json > target/park-validation-tests.jsonl
          python3 -B institute/scripts/park/performance.py package \
            --cargo-messages target/park-validation-tests.jsonl \
            --application "target/$BUILD_TARGET/release/lince" \
            --revision "$GITHUB_SHA" --profile release --target "$BUILD_TARGET" \
            --toolchain "$(rustc --version)" --output target/park-validation-bundle

      - name: Run first interface gate and observer checks
        run: |
          RUST_MIN_STACK=33554432 target/park-validation-bundle/bin/interface-tests native::laboratory::interface::fast_interface_rules --exact --nocapture --test-threads=1
          RUST_MIN_STACK=33554432 target/park-validation-bundle/bin/interface-tests host::performance::accounting::tests --nocapture --test-threads=1
          RUST_MIN_STACK=33554432 target/park-validation-bundle/bin/park-tests presentation::system_metrics::tests --nocapture --test-threads=1

      - name: Archive precompiled performance validation bundle
        env:
          VALIDATION_BUNDLE: target/park-validation-bundle.tar.gz
        run: tar -I 'gzip -1' -cf "$VALIDATION_BUNDLE" -C target park-validation-bundle

      - name: Publish precompiled performance validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: park-validation-${{ env.BUILD_TARGET }}-${{ github.sha }}
          path: target/park-validation-bundle.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: lince-binary-artifacts-${{ env.BUILD_TARGET }}
          path: binary-artifacts/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Save compiled inputs
        if: ${{ !cancelled() && steps.cache.outputs.hit != 'true' && steps.cache.outputs.key != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.cache.outputs.paths }}
          key: ${{ steps.cache.outputs.key }}

      - name: Upload build timings
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: build-timings-linux-${{ env.BUILD_TARGET }}
          path: |
            target/cargo-timings/*.html
            target/${{ env.BUILD_TARGET }}/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  publish-rolling:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || (inputs.build_release && inputs.publish_release)) }}
    needs: [binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ROLLING_TAG: rolling-${{ github.run_number }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lince-binary-artifacts-*
          path: release-artifacts
          merge-multiple: true

      - name: Write update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          CHANNEL="rolling"
          {
            printf '{\n'
            printf '  "version": "%s",\n' "$VERSION"
            printf '  "revision": "%s",\n' "$GITHUB_SHA"
            printf '  "channel": "%s",\n' "$CHANNEL"
            printf '  "assets": [\n'
            first=1
            for asset_path in release-artifacts/*; do
              [ -f "$asset_path" ] || continue
              case "$asset_path" in
                *.sha256|*.target|*.sig|*/lince-update.json) continue ;;
              esac
              asset="$(basename "$asset_path")"
              sum="$(awk '{print $1}' "${asset_path}.sha256")"
              target=""
              [ -f "${asset_path}.target" ] && target="$(tr -d '\r\n' < "${asset_path}.target")"
              if [ "$first" -eq 0 ]; then printf ',\n'; fi
              first=0
              printf '    {"name":"%s","url":"https://github.com/%s/releases/download/%s/%s","sha256":"%s","target":"%s","kind":"desktop"}' \
                "$asset" "$GITHUB_REPOSITORY" "$ROLLING_TAG" "$asset" "$sum" "$target"
            done
            printf '\n  ]\n'
            printf '}\n'
          } > release-artifacts/lince-update.json

      - name: Sign update manifest
        env:
          SIGNING_KEY: ${{ secrets.LINCE_UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "LINCE_UPDATE_SIGNING_KEY is not set; refusing to publish an unsigned manifest" >&2
            exit 1
          fi
          key_hex="$(printf '%s' "$SIGNING_KEY" | tr -d '[:space:]')"
          { printf '302e020100300506032b657004220420'; printf '%s' "$key_hex"; } \
            | xxd -r -p > signing-key.der
          openssl pkeyutl -sign -inkey signing-key.der -keyform DER -rawin \
            -in release-artifacts/lince-update.json \
            | xxd -p | tr -d '\n' > release-artifacts/lince-update.json.sig
          rm -f signing-key.der

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$ROLLING_TAG"

          if ! gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "Latest $TAG" \
              --notes "Latest native Lince release from the main branch."
          fi

          gh release upload "$TAG" release-artifacts/* --clobber --repo "$GH_REPO"

  publish-main:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || (inputs.build_release && inputs.publish_release)) }}
    needs: [binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lince-binary-artifacts-*
          path: release-artifacts
          merge-multiple: true

      - name: Package prebuilt Nix flake
        shell: bash
        run: |
          bash institute/packaging/linux/package-flake.sh

      - name: Publish main binaries for NixOS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(release-artifacts/lince-*.tar.gz release-artifacts/lince-*.zip)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No binary archives found" >&2
            exit 1
          fi
          assets=()
          for archive in "${archives[@]}"; do
            if [ "$archive" = release-artifacts/lince-flake.tar.gz ]; then continue; fi
            assets+=("$archive")
            for sidecar in "$archive.sha256" "$archive.target"; do
              if [ -f "$sidecar" ]; then assets+=("$sidecar"); fi
            done
          done
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No native binary archives found" >&2
            exit 1
          fi
          if ! gh release view main-binary --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create main-binary \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "Lince main binaries" \
              --prerelease \
              --notes "Native binaries and a prebuilt Nix flake from the latest successful main build."
          fi
          gh release upload main-binary "${assets[@]}" --clobber --repo "$GH_REPO"
          gh release upload main-binary \
            release-artifacts/lince-flake.tar.gz \
            release-artifacts/lince-flake.tar.gz.sha256 \
            --clobber --repo "$GH_REPO"

  publish-tag:
    if: ${{ startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || (inputs.build_release && inputs.publish_release)) }}
    needs: [binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        run: git cliff --latest -o RELEASE_NOTES.md

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lince-binary-artifacts-*
          path: release-artifacts
          merge-multiple: true

      - name: Write update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CHANNEL="${GITHUB_REF_NAME}"
          {
            printf '{\n'
            printf '  "version": "%s",\n' "$VERSION"
            printf '  "revision": "%s",\n' "$GITHUB_SHA"
            printf '  "channel": "%s",\n' "$CHANNEL"
            printf '  "assets": [\n'
            first=1
            for asset_path in release-artifacts/*; do
              [ -f "$asset_path" ] || continue
              case "$asset_path" in
                *.sha256|*.target|*.sig|*/lince-update.json) continue ;;
              esac
              asset="$(basename "$asset_path")"
              sum="$(awk '{print $1}' "${asset_path}.sha256")"
              target=""
              [ -f "${asset_path}.target" ] && target="$(tr -d '\r\n' < "${asset_path}.target")"
              if [ "$first" -eq 0 ]; then printf ',\n'; fi
              first=0
              printf '    {"name":"%s","url":"https://github.com/%s/releases/download/%s/%s","sha256":"%s","target":"%s","kind":"desktop"}' \
                "$asset" "$GITHUB_REPOSITORY" "$CHANNEL" "$asset" "$sum" "$target"
            done
            printf '\n  ]\n'
            printf '}\n'
          } > release-artifacts/lince-update.json

      - name: Sign update manifest
        env:
          SIGNING_KEY: ${{ secrets.LINCE_UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "LINCE_UPDATE_SIGNING_KEY is not set; refusing to publish an unsigned manifest" >&2
            exit 1
          fi
          key_hex="$(printf '%s' "$SIGNING_KEY" | tr -d '[:space:]')"
          { printf '302e020100300506032b657004220420'; printf '%s' "$key_hex"; } \
            | xxd -r -p > signing-key.der
          openssl pkeyutl -sign -inkey signing-key.der -keyform DER -rawin \
            -in release-artifacts/lince-update.json \
            | xxd -p | tr -d '\n' > release-artifacts/lince-update.json.sig
          rm -f signing-key.der

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: release-artifacts/*

  deploy-nixos:
    needs: [binary, publish-main, publish-rolling]
    if: ${{ always() && needs.binary.result == 'success' && ((github.ref == 'refs/heads/main' && needs.publish-main.result == 'success') || github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Rebuild NixOS server and restart Lince
        uses: appleboy/ssh-action@v1.2.0
        env:
          LINCE_REVISION: ${{ github.sha }}
          LINCE_BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: LINCE_REVISION,LINCE_BRANCH
          command_timeout: 25m
          script: |
            bash <<'BASH'
            set -euo pipefail
            if [ ! -d /sys/firmware/efi ] || [ "$(findmnt -no FSTYPE /)" != ext4 ] \
              || [ "$(findmnt -no FSTYPE /boot)" != vfat ] \
              || [ "$(readlink -f /dev/disk/by-label/nixos)" != "$(readlink -f "$(findmnt -no SOURCE /)")" ] \
              || [ "$(readlink -f /dev/disk/by-label/ESP)" != "$(readlink -f "$(findmnt -no SOURCE /boot)")" ]; then
              echo "Server boot mode or disk mounts do not match institute/server/configuration.nix" >&2
              exit 1
            fi
            if ! sudo test -s /var/lib/lince/initial-admin-password; then
              echo "Missing /var/lib/lince/initial-admin-password" >&2
              exit 1
            fi
            if [ "$LINCE_BRANCH" = main ]; then
              deploy_dir=$(mktemp -d)
              trap 'rm -rf "$deploy_dir"' EXIT
              curl -fL https://github.com/lince-social/lince/releases/download/main-binary/lince-flake.tar.gz \
                -o "$deploy_dir/lince-flake.tar.gz"
              tar -xzf "$deploy_dir/lince-flake.tar.gz" -C "$deploy_dir"
              if ! grep -Fq "\"revision\": \"$LINCE_REVISION\"" "$deploy_dir/lince/binary.json"; then
                echo "Published binary does not match this commit" >&2
                exit 1
              fi
              flake_ref="$deploy_dir/lince#institute-organ"
            else
              flake_ref="github:lince-social/lince/$LINCE_REVISION#institute-organ"
            fi
            sudo nixos-rebuild switch --flake "$flake_ref" --refresh
            sudo systemctl restart lince.service
            sudo systemctl status lince.service --no-pager -l
            BASH
