name: lince-build-release-deploy

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      validation_candidate:
        description: Build the Park acceptance candidate without rerunning the broad CI suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lince-build-release-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTUP_TOOLCHAIN: 1.96.0
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  park-checks:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.validation_candidate }}
    uses: ./.github/workflows/park.yml
  binary:
    needs: [park-checks]
    if: ${{ always() && !cancelled() && github.ref != 'refs/heads/dev' && (needs.park-checks.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.validation_candidate && needs.park-checks.result == 'skipped')) }}
    name: binary (${{ matrix.variant }}, ${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        target: [x86_64-unknown-linux-gnu]
        variant: [native]
        include:
          - os: ubuntu-24.04
            extension: ""

    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Rust version
        id: toolchain
        shell: bash
        run: bash institute/scripts/rust-channel.sh >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        id: rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mold \
            pigz \
            pkg-config \
            meson \
            ninja-build \
            curl \
            libfontconfig-dev \
            clang \
            libclang-dev \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libpulse-dev \
            libspeechd-dev \
            libva-dev \
            libssl-dev \
            libsqlite3-dev \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libegl1-mesa-dev libgbm-dev libdrm-dev libudev-dev libinput-dev libseat-dev
          curl --fail --location --retry 3 --output /tmp/libdisplay-info-0.4.0.tar.xz \
            https://gitlab.freedesktop.org/emersion/libdisplay-info/-/releases/0.4.0/downloads/libdisplay-info-0.4.0.tar.xz
          printf '%s\n' '43b180baa143e2035654759d84e2b2f5ee77d5fe817c423838c7fe59c0d68459  /tmp/libdisplay-info-0.4.0.tar.xz' | sha256sum --check
          tar -xf /tmp/libdisplay-info-0.4.0.tar.xz -C /tmp
          meson setup /tmp/libdisplay-info-build /tmp/libdisplay-info-0.4.0 --prefix=/usr/local --buildtype=release
          sudo meson install -C /tmp/libdisplay-info-build
          sudo ldconfig
          pkg-config --atleast-version=0.4.0 libdisplay-info
          printf '%s\n' 'RUSTFLAGS=-D warnings -C link-arg=-fuse-ld=mold' >> "$GITHUB_ENV"

      - name: Restore compiled crates
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/${{ matrix.target }}/release
          key: binary-v2-${{ matrix.os }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-${{ matrix.variant }}-${{ hashFiles('.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            binary-v2-${{ matrix.os }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-${{ matrix.variant }}-${{ hashFiles('.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-
            binary-v2-${{ matrix.os }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-${{ matrix.variant }}-${{ hashFiles('.cargo/config.toml') }}-
            binary-v2-${{ matrix.os }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-${{ matrix.variant }}-
            binary-v2-${{ matrix.os }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-

      - name: Build native Lince
        if: matrix.variant == 'native'
        timeout-minutes: 105
        env:
          LINCE_REVISION: ${{ github.sha }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p target
          cargo xtask park release --target "$BUILD_TARGET" > target/release-build-info.json
          if [[ "$BUILD_TARGET" == *-linux-gnu ]]; then
            bash institute/packaging/linux/check-build-info.sh target/release-build-info.json
          fi
        shell: bash

      - name: Build headless Lince for NixOS server
        if: matrix.variant == 'headless'
        timeout-minutes: 105
        env:
          LINCE_REVISION: ${{ github.sha }}
          BUILD_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          mkdir -p target
          cargo xtask park release --target "$BUILD_TARGET" --headless > target/release-build-info.json
          jq -e '.optimized == true and .features == {ui: false, instinct: true, park: false}' target/release-build-info.json >/dev/null

      - name: Package binary
        if: matrix.variant == 'native'
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BINARY_EXTENSION: ${{ matrix.extension }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p binary-artifacts package/lince/bin
          if [[ "$BUILD_TARGET" == *-linux-gnu ]]; then
            bash institute/packaging/linux/package.sh \
              "target/$BUILD_TARGET/release/lince" "binary-artifacts/lince-$BUILD_TARGET.tar.gz"
            exit 0
          fi
          install -m755 "target/$BUILD_TARGET/release/lince$BINARY_EXTENSION" "package/lince/bin/lince$BINARY_EXTENSION"
          install -m644 LICENSE package/lince/LICENSE
          install -m644 target/release-build-info.json package/lince/build-info.json
          printf '%s\n' "$GITHUB_SHA" > package/lince/revision
          if [ "$RUNNER_OS" = Windows ]; then
            asset="lince-$BUILD_TARGET.zip"
            7z a "binary-artifacts/$asset" ./package/lince
          else
            asset="lince-$BUILD_TARGET.tar.gz"
            if command -v pigz >/dev/null 2>&1; then
              tar -I pigz -cf "binary-artifacts/$asset" -C package lince
            else
              tar -czf "binary-artifacts/$asset" -C package lince
            fi
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            (cd binary-artifacts && sha256sum "$asset" > "$asset.sha256")
          else
            (cd binary-artifacts && shasum -a 256 "$asset" > "$asset.sha256")
          fi
          printf '%s\n' "$BUILD_TARGET" > "binary-artifacts/$asset.target"

      - uses: cachix/install-nix-action@v31
        if: matrix.variant == 'native' && runner.os == 'Linux'
      - name: Check the actual Linux release archive as an installed package
        if: matrix.variant == 'native' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          nix build --no-link --no-write-lock-file .#lince-park \
            --override-input lince-binary "tarball+file://$PWD/binary-artifacts/lince-x86_64-unknown-linux-gnu.tar.gz"

      - name: Upload binaries
        if: matrix.variant == 'native'
        uses: actions/upload-artifact@v4
        with:
          name: lince-binary-artifacts-${{ matrix.target }}
          path: binary-artifacts/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Build Park validation helpers
        if: matrix.variant == 'native' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          mkdir -p validation-binaries
          cargo test --locked --message-format=json -p lince-park --features session,server-tests,clipboard-gate --lib --no-run > validation-binaries/fixtures.jsonl
          jq -r 'select(.reason == "compiler-artifact" and .target.name == "lince_park" and .executable != null) | .executable' validation-binaries/fixtures.jsonl | tail -1 | xargs -r -I '{}' cp '{}' validation-binaries/park-fixtures
          for client in session_probe capture_probe; do
            cargo run --locked -p lince-park-clients --bin "$client" -- --help
          done
          cargo run --locked -p lince-park --features server-tests --example park_control_probe -- --help
          cp target/debug/session_probe validation-binaries/session-probe
          cp target/debug/capture_probe validation-binaries/capture-probe
          cp target/debug/examples/park_control_probe validation-binaries/control-probe
          cp target/debug/xtask validation-binaries/xtask
          printf '%s\n' "$GITHUB_SHA" > validation-binaries/revision
          test -x validation-binaries/park-fixtures

      - name: Save compiled crates
        if: ${{ !cancelled() && steps.cache.outputs.cache-primary-key != '' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/${{ matrix.target }}/release
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload Park validation helpers
        if: matrix.variant == 'native' && matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: lince-park-validation-${{ matrix.target }}
          path: validation-binaries/*
          if-no-files-found: error
          retention-days: 7

      - name: Package headless binary
        if: matrix.variant == 'headless'
        env:
          BUILD_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          install -Dm755 "target/$BUILD_TARGET/release/lince" server-artifacts/lince
          install -m644 target/release-build-info.json server-artifacts/build-info.json
          printf '%s\n' "$GITHUB_SHA" > server-artifacts/revision

      - name: Upload headless binary
        if: matrix.variant == 'headless'
        uses: actions/upload-artifact@v4
        with:
          name: lince-server-artifacts-${{ matrix.target }}
          path: server-artifacts/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload build timings
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: build-timings-${{ matrix.variant }}-${{ matrix.target }}
          path: |
            target/cargo-timings/*.html
            target/${{ matrix.target }}/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  publish-rolling:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || !inputs.validation_candidate) }}
    needs: [binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ROLLING_TAG: rolling-${{ github.run_number }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lince-binary-artifacts-*
          path: release-artifacts
          merge-multiple: true

      - name: Write update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          CHANNEL="rolling"
          {
            printf '{\n'
            printf '  "version": "%s",\n' "$VERSION"
            printf '  "revision": "%s",\n' "$GITHUB_SHA"
            printf '  "channel": "%s",\n' "$CHANNEL"
            printf '  "assets": [\n'
            first=1
            for asset_path in release-artifacts/*; do
              [ -f "$asset_path" ] || continue
              case "$asset_path" in
                *.sha256|*.target|*.sig|*/lince-update.json) continue ;;
              esac
              asset="$(basename "$asset_path")"
              sum="$(awk '{print $1}' "${asset_path}.sha256")"
              target=""
              [ -f "${asset_path}.target" ] && target="$(tr -d '\r\n' < "${asset_path}.target")"
              if [ "$first" -eq 0 ]; then printf ',\n'; fi
              first=0
              printf '    {"name":"%s","url":"https://github.com/%s/releases/download/%s/%s","sha256":"%s","target":"%s","kind":"desktop"}' \
                "$asset" "$GITHUB_REPOSITORY" "$ROLLING_TAG" "$asset" "$sum" "$target"
            done
            printf '\n  ]\n'
            printf '}\n'
          } > release-artifacts/lince-update.json

      - name: Sign update manifest
        env:
          SIGNING_KEY: ${{ secrets.LINCE_UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "LINCE_UPDATE_SIGNING_KEY is not set; refusing to publish an unsigned manifest" >&2
            exit 1
          fi
          key_hex="$(printf '%s' "$SIGNING_KEY" | tr -d '[:space:]')"
          { printf '302e020100300506032b657004220420'; printf '%s' "$key_hex"; } \
            | xxd -r -p > signing-key.der
          openssl pkeyutl -sign -inkey signing-key.der -keyform DER -rawin \
            -in release-artifacts/lince-update.json \
            | xxd -p | tr -d '\n' > release-artifacts/lince-update.json.sig
          rm -f signing-key.der

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$ROLLING_TAG"

          if ! gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "Latest $TAG" \
              --notes "Latest native Lince release from the main branch."
          fi

          gh release upload "$TAG" release-artifacts/* --clobber --repo "$GH_REPO"

  publish-main:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || !inputs.validation_candidate) }}
    needs: [binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lince-binary-artifacts-*
          path: release-artifacts
          merge-multiple: true

      - name: Package prebuilt Nix flake
        shell: bash
        run: |
          bash institute/packaging/linux/package-flake.sh

      - name: Publish main binaries for NixOS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(release-artifacts/lince-*.tar.gz release-artifacts/lince-*.zip)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No binary archives found" >&2
            exit 1
          fi
          assets=()
          for archive in "${archives[@]}"; do
            if [ "$archive" = release-artifacts/lince-flake.tar.gz ]; then continue; fi
            assets+=("$archive")
            for sidecar in "$archive.sha256" "$archive.target"; do
              if [ -f "$sidecar" ]; then assets+=("$sidecar"); fi
            done
          done
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No native binary archives found" >&2
            exit 1
          fi
          if ! gh release view main-binary --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create main-binary \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "Lince main binaries" \
              --prerelease \
              --notes "Native binaries and a prebuilt Nix flake from the latest successful main build."
          fi
          gh release upload main-binary "${assets[@]}" --clobber --repo "$GH_REPO"
          gh release upload main-binary \
            release-artifacts/lince-flake.tar.gz \
            release-artifacts/lince-flake.tar.gz.sha256 \
            --clobber --repo "$GH_REPO"

  publish-tag:
    if: ${{ startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || !inputs.validation_candidate) }}
    needs: [binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        run: git cliff --latest -o RELEASE_NOTES.md

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lince-binary-artifacts-*
          path: release-artifacts
          merge-multiple: true

      - name: Write update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CHANNEL="${GITHUB_REF_NAME}"
          {
            printf '{\n'
            printf '  "version": "%s",\n' "$VERSION"
            printf '  "revision": "%s",\n' "$GITHUB_SHA"
            printf '  "channel": "%s",\n' "$CHANNEL"
            printf '  "assets": [\n'
            first=1
            for asset_path in release-artifacts/*; do
              [ -f "$asset_path" ] || continue
              case "$asset_path" in
                *.sha256|*.target|*.sig|*/lince-update.json) continue ;;
              esac
              asset="$(basename "$asset_path")"
              sum="$(awk '{print $1}' "${asset_path}.sha256")"
              target=""
              [ -f "${asset_path}.target" ] && target="$(tr -d '\r\n' < "${asset_path}.target")"
              if [ "$first" -eq 0 ]; then printf ',\n'; fi
              first=0
              printf '    {"name":"%s","url":"https://github.com/%s/releases/download/%s/%s","sha256":"%s","target":"%s","kind":"desktop"}' \
                "$asset" "$GITHUB_REPOSITORY" "$CHANNEL" "$asset" "$sum" "$target"
            done
            printf '\n  ]\n'
            printf '}\n'
          } > release-artifacts/lince-update.json

      - name: Sign update manifest
        env:
          SIGNING_KEY: ${{ secrets.LINCE_UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "LINCE_UPDATE_SIGNING_KEY is not set; refusing to publish an unsigned manifest" >&2
            exit 1
          fi
          key_hex="$(printf '%s' "$SIGNING_KEY" | tr -d '[:space:]')"
          { printf '302e020100300506032b657004220420'; printf '%s' "$key_hex"; } \
            | xxd -r -p > signing-key.der
          openssl pkeyutl -sign -inkey signing-key.der -keyform DER -rawin \
            -in release-artifacts/lince-update.json \
            | xxd -p | tr -d '\n' > release-artifacts/lince-update.json.sig
          rm -f signing-key.der

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: release-artifacts/*

  deploy-nixos:
    needs: [binary, publish-main, publish-rolling]
    if: ${{ always() && needs.binary.result == 'success' && ((github.ref == 'refs/heads/main' && needs.publish-main.result == 'success') || github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Rebuild NixOS server and restart Lince
        uses: appleboy/ssh-action@v1.2.0
        env:
          LINCE_REVISION: ${{ github.sha }}
          LINCE_BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: LINCE_REVISION,LINCE_BRANCH
          command_timeout: 25m
          script: |
            bash <<'BASH'
            set -euo pipefail
            if [ ! -d /sys/firmware/efi ] || [ "$(findmnt -no FSTYPE /)" != ext4 ] \
              || [ "$(findmnt -no FSTYPE /boot)" != vfat ] \
              || [ "$(readlink -f /dev/disk/by-label/nixos)" != "$(readlink -f "$(findmnt -no SOURCE /)")" ] \
              || [ "$(readlink -f /dev/disk/by-label/ESP)" != "$(readlink -f "$(findmnt -no SOURCE /boot)")" ]; then
              echo "Server boot mode or disk mounts do not match institute/server/configuration.nix" >&2
              exit 1
            fi
            if ! sudo test -s /var/lib/lince/initial-admin-password; then
              echo "Missing /var/lib/lince/initial-admin-password" >&2
              exit 1
            fi
            if [ "$LINCE_BRANCH" = main ]; then
              deploy_dir=$(mktemp -d)
              trap 'rm -rf "$deploy_dir"' EXIT
              curl -fL https://github.com/lince-social/lince/releases/download/main-binary/lince-flake.tar.gz \
                -o "$deploy_dir/lince-flake.tar.gz"
              tar -xzf "$deploy_dir/lince-flake.tar.gz" -C "$deploy_dir"
              if ! grep -Fq "\"revision\": \"$LINCE_REVISION\"" "$deploy_dir/lince/binary.json"; then
                echo "Published binary does not match this commit" >&2
                exit 1
              fi
              flake_ref="$deploy_dir/lince#institute-organ"
            else
              flake_ref="github:lince-social/lince/$LINCE_REVISION#institute-organ"
            fi
            sudo nixos-rebuild switch --flake "$flake_ref" --refresh
            sudo systemctl restart lince.service
            sudo systemctl status lince.service --no-pager -l
            BASH
