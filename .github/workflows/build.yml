name: app-release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  binary:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extension: ""
          # - os: macos-latest
          #   target: aarch64-apple-darwin
          #   extension: ""
          # - os: windows-latest
          #   target: x86_64-pc-windows-msvc
          #   extension: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Rust version
        id: toolchain
        shell: bash
        run: python3 -c 'import tomllib; print("version=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        id: rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mold \
            pigz \
            pkg-config \
            libssl-dev \
            libsqlite3-dev \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            libvulkan-dev
          printf '%s\n' 'RUSTFLAGS=-D warnings -C link-arg=-fuse-ld=mold' >> "$GITHUB_ENV"

      - name: Restore compiled crates
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/${{ matrix.target }}/release
            target/source-cache.json
          key: binary-v2-${{ matrix.os }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            binary-v2-${{ matrix.os }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-
            binary-v2-${{ matrix.os }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('.cargo/config.toml') }}-

      - name: Restore unchanged source timestamps
        run: python3 scripts/ci/source-cache.py

      - name: Test release tooling
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py' -v

      - name: Build native Lince
        env:
          LINCE_REVISION: ${{ github.sha }}
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --package lince --target "$BUILD_TARGET" --timings
        shell: bash

      - name: Save compiled crates
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/${{ matrix.target }}/release
            target/source-cache.json
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Package binary
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BINARY_EXTENSION: ${{ matrix.extension }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p binary-artifacts package/lince/bin
          install -m755 "target/$BUILD_TARGET/release/lince$BINARY_EXTENSION" "package/lince/bin/lince$BINARY_EXTENSION"
          install -m644 LICENSE package/lince/LICENSE
          printf '%s\n' "$GITHUB_SHA" > package/lince/revision
          if [ "$RUNNER_OS" = Windows ]; then
            asset="lince-$BUILD_TARGET.zip"
            7z a "binary-artifacts/$asset" ./package/lince
          else
            asset="lince-$BUILD_TARGET.tar.gz"
            if command -v pigz >/dev/null 2>&1; then
              tar -I pigz -cf "binary-artifacts/$asset" -C package lince
            else
              tar -czf "binary-artifacts/$asset" -C package lince
            fi
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            (cd binary-artifacts && sha256sum "$asset" > "$asset.sha256")
          else
            (cd binary-artifacts && shasum -a 256 "$asset" > "$asset.sha256")
          fi
          printf '%s\n' "$BUILD_TARGET" > "binary-artifacts/$asset.target"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: lince-binary-artifacts-${{ matrix.target }}
          path: binary-artifacts/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload build timings
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: build-timings-${{ matrix.target }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  publish-rolling:
    if: github.ref == 'refs/heads/main'
    needs: [binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ROLLING_TAG: rolling-${{ github.run_number }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lince-binary-artifacts-*
          path: release-artifacts
          merge-multiple: true

      - name: Write update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          CHANNEL="rolling"
          {
            printf '{\n'
            printf '  "version": "%s",\n' "$VERSION"
            printf '  "revision": "%s",\n' "$GITHUB_SHA"
            printf '  "channel": "%s",\n' "$CHANNEL"
            printf '  "assets": [\n'
            first=1
            for asset_path in release-artifacts/*; do
              [ -f "$asset_path" ] || continue
              case "$asset_path" in
                *.sha256|*.target|*.sig|*/lince-update.json) continue ;;
              esac
              asset="$(basename "$asset_path")"
              sum="$(awk '{print $1}' "${asset_path}.sha256")"
              target=""
              [ -f "${asset_path}.target" ] && target="$(tr -d '\r\n' < "${asset_path}.target")"
              if [ "$first" -eq 0 ]; then printf ',\n'; fi
              first=0
              printf '    {"name":"%s","url":"https://github.com/%s/releases/download/%s/%s","sha256":"%s","target":"%s","kind":"desktop"}' \
                "$asset" "$GITHUB_REPOSITORY" "$ROLLING_TAG" "$asset" "$sum" "$target"
            done
            printf '\n  ]\n'
            printf '}\n'
          } > release-artifacts/lince-update.json

      - name: Sign update manifest
        env:
          SIGNING_KEY: ${{ secrets.LINCE_UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "LINCE_UPDATE_SIGNING_KEY is not set; refusing to publish an unsigned manifest" >&2
            exit 1
          fi
          key_hex="$(printf '%s' "$SIGNING_KEY" | tr -d '[:space:]')"
          { printf '302e020100300506032b657004220420'; printf '%s' "$key_hex"; } \
            | xxd -r -p > signing-key.der
          openssl pkeyutl -sign -inkey signing-key.der -keyform DER -rawin \
            -in release-artifacts/lince-update.json \
            | xxd -p | tr -d '\n' > release-artifacts/lince-update.json.sig
          rm -f signing-key.der

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$ROLLING_TAG"

          if ! gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "Latest $TAG" \
              --notes "Latest native Lince release from the main branch."
          fi

          gh release upload "$TAG" release-artifacts/* --clobber --repo "$GH_REPO"

      - name: Package prebuilt Nix flake
        shell: bash
        run: |
          python3 scripts/ci/package-nix.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$ROLLING_TAG" \
            --revision "$GITHUB_SHA"

      - name: Publish main binaries for NixOS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: bash scripts/ci/publish-main.sh

  publish-tag:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        run: git cliff --latest -o RELEASE_NOTES.md

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lince-binary-artifacts-*
          path: release-artifacts
          merge-multiple: true

      - name: Write update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CHANNEL="${GITHUB_REF_NAME}"
          {
            printf '{\n'
            printf '  "version": "%s",\n' "$VERSION"
            printf '  "revision": "%s",\n' "$GITHUB_SHA"
            printf '  "channel": "%s",\n' "$CHANNEL"
            printf '  "assets": [\n'
            first=1
            for asset_path in release-artifacts/*; do
              [ -f "$asset_path" ] || continue
              case "$asset_path" in
                *.sha256|*.target|*.sig|*/lince-update.json) continue ;;
              esac
              asset="$(basename "$asset_path")"
              sum="$(awk '{print $1}' "${asset_path}.sha256")"
              target=""
              [ -f "${asset_path}.target" ] && target="$(tr -d '\r\n' < "${asset_path}.target")"
              if [ "$first" -eq 0 ]; then printf ',\n'; fi
              first=0
              printf '    {"name":"%s","url":"https://github.com/%s/releases/download/%s/%s","sha256":"%s","target":"%s","kind":"desktop"}' \
                "$asset" "$GITHUB_REPOSITORY" "$CHANNEL" "$asset" "$sum" "$target"
            done
            printf '\n  ]\n'
            printf '}\n'
          } > release-artifacts/lince-update.json

      - name: Sign update manifest
        env:
          SIGNING_KEY: ${{ secrets.LINCE_UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "LINCE_UPDATE_SIGNING_KEY is not set; refusing to publish an unsigned manifest" >&2
            exit 1
          fi
          key_hex="$(printf '%s' "$SIGNING_KEY" | tr -d '[:space:]')"
          { printf '302e020100300506032b657004220420'; printf '%s' "$key_hex"; } \
            | xxd -r -p > signing-key.der
          openssl pkeyutl -sign -inkey signing-key.der -keyform DER -rawin \
            -in release-artifacts/lince-update.json \
            | xxd -p | tr -d '\n' > release-artifacts/lince-update.json.sig
          rm -f signing-key.der

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: release-artifacts/*
