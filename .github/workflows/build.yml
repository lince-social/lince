name: Linux Lince and Park

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/**'
      - 'institute/packaging/**'
  workflow_dispatch:
    inputs:
      rust_version:
        description: Automatic Rust update candidate; checks on main only
        type: string
        default: ''
      build_release:
        description: Build the optimized Linux binary instead of checks only
        type: boolean
        default: true
      publish_release:
        description: Publish the built release on main or a version tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lince-build-release-deploy-${{ inputs.rust_version && format('rust-validation-{0}', inputs.rust_version) || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  LINCE_CI_LINKER: mold
  LINCE_BUILD_ENVIRONMENT: "1"

jobs:
  checks:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && !inputs.build_release)
    name: Linux compile checks (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [desktop, headless]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restrict candidates to checks
        if: inputs.rust_version != '' && inputs.build_release
        run: exit 1
      - uses: ./.github/actions/rust-version
        id: toolchain
        with:
          candidate: ${{ inputs.rust_version }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: ./.github/actions/linux-build
      - uses: ./.github/actions/rust-artifacts
        id: cache
        with:
          scope: linux-checks-${{ matrix.mode }}
      - name: Check selected Linux build
        env:
          CHECK_MODE: ${{ matrix.mode }}
        run: |
          case "$CHECK_MODE" in
            desktop) cargo check --locked -p lince -p xtask -p lince-park-clients --features lince/instinct,lince/park --timings ;;
            headless) cargo check --locked -p lince --no-default-features --features instinct --timings ;;
            *) exit 1 ;;
          esac
      - name: Run fast interface checks
        if: matrix.mode == 'desktop'
        env:
          WGPU_BACKEND: vulkan
        run: |
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
          cargo xtask test-interface
      - name: Save compiled inputs
        if: ${{ !cancelled() && steps.cache.outputs.hit != 'true' && steps.cache.outputs.key != '' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ steps.cache.outputs.paths }}
          key: ${{ job.status == 'failure' && format('{0}-partial-{1}-{2}', steps.cache.outputs.key, github.run_id, github.run_attempt) || steps.cache.outputs.key }}
      - name: Upload compilation timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-check-timings-${{ matrix.mode }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7
  binary:
    if: github.event_name != 'pull_request' && github.ref != 'refs/heads/dev' && (github.event_name != 'workflow_dispatch' || inputs.build_release)
    # Optimize elapsed time with two runners. For a compute-minute budget,
    # prefer one shared Cargo build; see .github/README.md before changing this.
    name: Linux release (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        artifact: [application, park-probe]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      BUILD_TARGET: x86_64-unknown-linux-gnu
      CARGO_PROFILE_RELEASE_LTO: thin

    steps:
      - uses: actions/checkout@v4

      - name: Restrict compiler candidates to checks
        if: github.event_name == 'workflow_dispatch' && inputs.rust_version != ''
        run: exit 1

      - uses: ./.github/actions/rust-version
        id: toolchain

      - name: Setup Rust
        id: rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          targets: ${{ env.BUILD_TARGET }}

      - uses: ./.github/actions/linux-build
      - uses: ./.github/actions/rust-artifacts
        id: cache
        with:
          scope: ${{ matrix.artifact == 'application' && 'linux-release' || 'linux-park-measurement' }}
          target: ${{ env.BUILD_TARGET }}
          fallback-scope: ${{ matrix.artifact == 'park-probe' && 'linux-release' || '' }}

      - name: Build native Lince
        if: matrix.artifact == 'application'
        timeout-minutes: 105
        env:
          LINCE_REVISION: ${{ github.sha }}
          BUILD_TARGET: ${{ env.BUILD_TARGET }}
        run: |
          mkdir -p target
          cargo xtask park release --target "$BUILD_TARGET" > target/release-build-info.json
          if [[ "$BUILD_TARGET" == *-linux-gnu ]]; then
            jq -L institute/packaging/linux -es 'include "build-info"; park_release' target/release-build-info.json >/dev/null
          fi
        shell: bash

      - name: Build Park measurement probe
        if: matrix.artifact == 'park-probe'
        timeout-minutes: 105
        env:
          LINCE_REVISION: ${{ github.sha }}
          RUST_MIN_STACK: "33554432"
        shell: bash
        run: |
          cargo build --locked --release --package lince --features instinct,park --example park-responsiveness --target "$BUILD_TARGET" --timings
          measurement_dir=target/park-measurement
          mkdir -p "$measurement_dir" park-measurement-build
          install -m 755 "target/$BUILD_TARGET/release/examples/park-responsiveness" "$measurement_dir/park-responsiveness"
          "$measurement_dir/park-responsiveness" --build-info > "$measurement_dir/probe-build-info.json"
          tar -I 'gzip -1' -cf park-measurement-build/probe.tar.gz -C "$measurement_dir" park-responsiveness probe-build-info.json
          (cd park-measurement-build && sha256sum probe.tar.gz > probe.tar.gz.sha256)

      - name: Save compiled inputs
        if: ${{ !cancelled() && steps.cache.outputs.hit != 'true' && steps.cache.outputs.key != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.cache.outputs.paths }}
          key: ${{ job.status == 'failure' && format('{0}-partial-{1}-{2}', steps.cache.outputs.key, github.run_id, github.run_attempt) || steps.cache.outputs.key }}

      - name: Package Linux binary
        shell: bash
        if: matrix.artifact == 'application'
        run: |
          executable=$(realpath "target/$BUILD_TARGET/release/lince")
          destination=$(realpath -m "binary-artifacts/lince-$BUILD_TARGET.tar.gz")
          [[ ! -e $(dirname "$executable")/.lince-wrapped ]] || { echo 'Package the compiled ELF before Nix wrapping' >&2; exit 1; }
          [[ $(od -An -tx1 -N4 "$executable" | tr -d ' \n') == 7f454c46 ]] || { echo 'Expected an ELF executable' >&2; exit 1; }
          mkdir -p "$(dirname "$destination")"
          temporary=$(mktemp -d "$(dirname "$destination")/park-package-XXXXXX")
          trap 'rm -rf -- "$temporary"' EXIT
          root=$temporary/lince
          mkdir -p "$root"
          timeout 10 "$executable" --build-info > "$root/build-info.json"
          jq -L institute/packaging/linux -es 'include "build-info"; park_release' "$root/build-info.json" >/dev/null
          install -Dm755 "$executable" "$root/bin/lince"
          for mapping in \
              'LICENSE:LICENSE' \
              'institute/packaging/linux/wayland-sessions/lince.desktop:share/wayland-sessions/lince.desktop' \
              'crates/vendor/smithay-capture/LICENSE.txt:share/licenses/lince-smithay-capture/LICENSE.txt' \
              'crates/vendor/smithay-capture/CREDITS.md:share/licenses/lince-smithay-capture/CREDITS.md' \
              'crates/vendor/smithay/LICENSE.txt:share/licenses/smithay/LICENSE.txt' \
              'institute/packaging/linux/ufw/lince:etc/ufw/applications.d/lince' \
              'institute/packaging/linux/firewalld/lince.xml:lib/firewalld/services/lince.xml' \
              'institute/packaging/linux/firewalld/lince-test.xml:lib/firewalld/services/lince-test.xml'; do
              install -Dm644 "${mapping%%:*}" "$root/${mapping#*:}"
          done
          cat > "$root/bin/lince-park-session" <<'LAUNCHER'
          #!/bin/sh
          set -eu
          lince_executable="$(dirname "$(readlink -f "$0")")/lince"
          if [ -n "${DBUS_SESSION_BUS_ADDRESS:-}" ]; then
              exec "$lince_executable" --park "$@"
          fi
          exec dbus-run-session -- "$lince_executable" --park "$@"
          LAUNCHER
          chmod 755 "$root/bin/lince-park-session"
          jq -r .revision "$root/build-info.json" > "$root/revision"
          tar -I 'gzip -1' -cf "$temporary/archive.tar.gz" -C "$temporary" lince
          mv "$temporary/archive.tar.gz" "$destination"
          printf '%s  %s\n' "$(sha256sum "$destination" | cut -d ' ' -f1)" "$(basename "$destination")" > "$destination.sha256"
          jq -r .target "$root/build-info.json" > "$destination.target"

      - name: Upload binaries
        if: matrix.artifact == 'application'
        uses: actions/upload-artifact@v4
        with:
          name: lince-binary-artifacts-${{ env.BUILD_TARGET }}
          path: binary-artifacts/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload application build identity
        if: matrix.artifact == 'application'
        uses: actions/upload-artifact@v4
        with:
          name: lince-build-info-${{ env.BUILD_TARGET }}
          path: target/release-build-info.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload compiled Park probe for packaging
        if: matrix.artifact == 'park-probe'
        uses: actions/upload-artifact@v4
        with:
          name: park-measurement-build-${{ env.BUILD_TARGET }}
          path: park-measurement-build/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload build timings
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: build-timings-linux-${{ env.BUILD_TARGET }}-${{ matrix.artifact }}
          path: |
            target/cargo-timings/*.html
            target/${{ env.BUILD_TARGET }}/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  park-measurement:
    needs: binary
    name: Verify and package Park measurement probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUILD_TARGET: x86_64-unknown-linux-gnu
      LINCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Download application build identity
        uses: actions/download-artifact@v4
        with:
          name: lince-build-info-${{ env.BUILD_TARGET }}
          path: target/application-identity
      - name: Download compiled Park probe
        uses: actions/download-artifact@v4
        with:
          name: park-measurement-build-${{ env.BUILD_TARGET }}
          path: target/park-probe-build
      - name: Verify and package matching artifacts
        shell: bash
        run: |
          (cd target/park-probe-build && sha256sum --check probe.tar.gz.sha256)
          mkdir -p target/park-measurement
          tar -xzf target/park-probe-build/probe.tar.gz -C target/park-measurement
          measurement=target/park-measurement
          application=target/application-identity/release-build-info.json
          destination=$(realpath -m "park-measurement-artifacts/park-responsiveness-$BUILD_TARGET.tar.gz")
          jq -L institute/packaging/linux -es --arg revision "$LINCE_REVISION" --arg target "$BUILD_TARGET" \
            --slurpfile application "$application" \
            'include "build-info"; matching_park_probe($application; $revision; $target)' "$measurement/probe-build-info.json" >/dev/null
          mkdir -p "$(dirname "$destination")"
          temporary=$(mktemp -d "$(dirname "$destination")/park-probe-XXXXXX")
          trap 'rm -rf -- "$temporary"' EXIT
          install -m 755 "$measurement/park-responsiveness" "$temporary/park-responsiveness"
          install -m 644 "$measurement/probe-build-info.json" "$temporary/probe-build-info.json"
          install -m 644 "$application" "$temporary/application-build-info.json"
          (cd "$temporary" && sha256sum park-responsiveness probe-build-info.json application-build-info.json > SHA256SUMS)
          tar -I 'gzip -1' -cf "$temporary/archive.tar.gz" -C "$temporary" park-responsiveness probe-build-info.json application-build-info.json SHA256SUMS
          mv "$temporary/archive.tar.gz" "$destination"
          (cd "$(dirname "$destination")" && sha256sum "$(basename "$destination")" > "$(basename "$destination").sha256")
      - name: Upload Park measurement probe
        uses: actions/upload-artifact@v4
        with:
          name: park-measurement-artifacts-${{ env.BUILD_TARGET }}
          path: park-measurement-artifacts/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  tooling:
    if: github.event_name != 'pull_request' && github.ref != 'refs/heads/dev' && (github.event_name != 'workflow_dispatch' || inputs.build_release)
    name: CI tooling checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify release and measurement artifact identities
        shell: bash
        run: |
          export LINCE_REVISION=fixture BUILD_TARGET=x86_64-unknown-linux-gnu
          directory=$(mktemp -d)
          trap 'rm -rf -- "$directory"' EXIT
          application="$directory/application.json"
          probe="$directory/probe.json"
          changed="$directory/changed.json"
          printf '%s\n' '{"version":"0.8.0","revision":"fixture","target":"x86_64-unknown-linux-gnu","optimized":true,"features":{"ui":true,"instinct":true,"park":true}}' > "$application"
          printf '%s\n' '{"probe":"park-responsiveness-v1","package":"lince","version":"0.8.0","revision":"fixture","optimized":true,"architecture":"x86_64","os":"linux"}' > "$probe"
          validate_release() {
            jq -L institute/packaging/linux -es 'include "build-info"; park_release' "$1" >/dev/null
          }
          validate_probe() {
            jq -L institute/packaging/linux -es --arg revision "$LINCE_REVISION" --arg target "$BUILD_TARGET" \
              --slurpfile application "$1" 'include "build-info"; matching_park_probe($application; $revision; $target)' "$2" >/dev/null
          }
          validate_release "$application"
          validate_probe "$application" "$probe"
          for mutation in '.optimized=false' '.features.ui=false' '.target="aarch64-apple-darwin"' '.version=null' '.features.extra=true'; do
            jq "$mutation" "$application" > "$changed"
            if validate_release "$changed" || validate_probe "$changed" "$probe"; then
              echo "Invalid release was accepted: $mutation" >&2
              exit 1
            fi
          done
          for mutation in '.revision="other"' '.version="other"' '.optimized=false' '.package="lince-park"' '.probe="unknown"' '.architecture="aarch64"' '.os="macos"'; do
            jq "$mutation" "$probe" > "$changed"
            if validate_probe "$application" "$changed"; then
              echo "Invalid probe was accepted: $mutation" >&2
              exit 1
            fi
          done
          cat "$probe" "$probe" > "$changed"
          if validate_probe "$application" "$changed"; then exit 1; fi

  publish-rolling:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || (inputs.build_release && inputs.publish_release)) }}
    needs: [binary, park-measurement, tooling]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ROLLING_TAG: rolling-${{ github.run_number }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lince-binary-artifacts-*
          path: release-artifacts
          merge-multiple: true

      - name: Write update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          CHANNEL="rolling"
          {
            printf '{\n'
            printf '  "version": "%s",\n' "$VERSION"
            printf '  "revision": "%s",\n' "$GITHUB_SHA"
            printf '  "channel": "%s",\n' "$CHANNEL"
            printf '  "assets": [\n'
            first=1
            for asset_path in release-artifacts/*; do
              [ -f "$asset_path" ] || continue
              case "$asset_path" in
                *.sha256|*.target|*.sig|*/lince-update.json) continue ;;
              esac
              asset="$(basename "$asset_path")"
              sum="$(awk '{print $1}' "${asset_path}.sha256")"
              target=""
              [ -f "${asset_path}.target" ] && target="$(tr -d '\r\n' < "${asset_path}.target")"
              if [ "$first" -eq 0 ]; then printf ',\n'; fi
              first=0
              printf '    {"name":"%s","url":"https://github.com/%s/releases/download/%s/%s","sha256":"%s","target":"%s","kind":"desktop"}' \
                "$asset" "$GITHUB_REPOSITORY" "$ROLLING_TAG" "$asset" "$sum" "$target"
            done
            printf '\n  ]\n'
            printf '}\n'
          } > release-artifacts/lince-update.json

      - name: Sign update manifest
        env:
          SIGNING_KEY: ${{ secrets.LINCE_UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "LINCE_UPDATE_SIGNING_KEY is not set; refusing to publish an unsigned manifest" >&2
            exit 1
          fi
          key_hex="$(printf '%s' "$SIGNING_KEY" | tr -d '[:space:]')"
          { printf '302e020100300506032b657004220420'; printf '%s' "$key_hex"; } \
            | xxd -r -p > signing-key.der
          openssl pkeyutl -sign -inkey signing-key.der -keyform DER -rawin \
            -in release-artifacts/lince-update.json \
            | xxd -p | tr -d '\n' > release-artifacts/lince-update.json.sig
          rm -f signing-key.der

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$ROLLING_TAG"

          if ! gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "Latest $TAG" \
              --notes "Latest native Lince release from the main branch."
          fi

          gh release upload "$TAG" release-artifacts/* --clobber --repo "$GH_REPO"

  publish-main:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || (inputs.build_release && inputs.publish_release)) }}
    needs: [binary, park-measurement, tooling]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lince-binary-artifacts-*
          path: release-artifacts
          merge-multiple: true

      - name: Package prebuilt Nix flake
        shell: bash
        run: |
          artifacts=release-artifacts
          asset=$artifacts/lince-x86_64-unknown-linux-gnu.tar.gz
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"$/\1/p' Cargo.toml)
          [[ -n $version && -n ${GITHUB_SHA:-} && -n ${GITHUB_REPOSITORY:-} ]]
          temporary=$(mktemp -d)
          trap 'rm -rf -- "$temporary"' EXIT
          root=$temporary/lince
          mkdir -p "$root/institute/server"
          tar -xOf "$asset" lince/build-info.json > "$temporary/build-info.json"
          jq -L institute/packaging/linux -es 'include "build-info"; park_release' "$temporary/build-info.json" >/dev/null
          jq -e --arg version "$version" --arg revision "$GITHUB_SHA" '.version == $version and .revision == $revision' "$temporary/build-info.json" >/dev/null
          digest=$(sha256sum "$asset" | cut -d ' ' -f1)
          checksum=$(printf '%b' "$(printf '%s' "$digest" | sed 's/../\\x&/g')" | base64 -w0)
          jq --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/main-binary/$(basename "$asset")" --arg hash "sha256-$checksum" '{features,target,version,revision} + {url:$url,hash:$hash}' "$temporary/build-info.json" > "$root/binary.json"
          cp flake.nix flake.lock Cargo.toml rust-toolchain.toml LICENSE "$root/"
          cp institute/server/configuration.nix "$root/institute/server/"
          cp -R institute/trails "$root/institute/"
          cp -R institute/packaging "$root/institute/"
          tar -czf "$artifacts/lince-flake.tar.gz" -C "$temporary" lince
          printf '%s  lince-flake.tar.gz\n' "$(sha256sum "$artifacts/lince-flake.tar.gz" | cut -d ' ' -f1)" > "$artifacts/lince-flake.tar.gz.sha256"

      - name: Publish main binaries for NixOS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(release-artifacts/lince-*.tar.gz release-artifacts/lince-*.zip)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No binary archives found" >&2
            exit 1
          fi
          assets=()
          for archive in "${archives[@]}"; do
            if [ "$archive" = release-artifacts/lince-flake.tar.gz ]; then continue; fi
            assets+=("$archive")
            for sidecar in "$archive.sha256" "$archive.target"; do
              if [ -f "$sidecar" ]; then assets+=("$sidecar"); fi
            done
          done
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No native binary archives found" >&2
            exit 1
          fi
          if ! gh release view main-binary --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create main-binary \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "Lince main binaries" \
              --prerelease \
              --notes "Native binaries and a prebuilt Nix flake from the latest successful main build."
          fi
          gh release upload main-binary "${assets[@]}" --clobber --repo "$GH_REPO"
          gh release upload main-binary \
            release-artifacts/lince-flake.tar.gz \
            release-artifacts/lince-flake.tar.gz.sha256 \
            --clobber --repo "$GH_REPO"

  publish-tag:
    if: ${{ startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || (inputs.build_release && inputs.publish_release)) }}
    needs: [binary, park-measurement, tooling]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        run: git cliff --latest -o RELEASE_NOTES.md

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lince-binary-artifacts-*
          path: release-artifacts
          merge-multiple: true

      - name: Write update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CHANNEL="${GITHUB_REF_NAME}"
          {
            printf '{\n'
            printf '  "version": "%s",\n' "$VERSION"
            printf '  "revision": "%s",\n' "$GITHUB_SHA"
            printf '  "channel": "%s",\n' "$CHANNEL"
            printf '  "assets": [\n'
            first=1
            for asset_path in release-artifacts/*; do
              [ -f "$asset_path" ] || continue
              case "$asset_path" in
                *.sha256|*.target|*.sig|*/lince-update.json) continue ;;
              esac
              asset="$(basename "$asset_path")"
              sum="$(awk '{print $1}' "${asset_path}.sha256")"
              target=""
              [ -f "${asset_path}.target" ] && target="$(tr -d '\r\n' < "${asset_path}.target")"
              if [ "$first" -eq 0 ]; then printf ',\n'; fi
              first=0
              printf '    {"name":"%s","url":"https://github.com/%s/releases/download/%s/%s","sha256":"%s","target":"%s","kind":"desktop"}' \
                "$asset" "$GITHUB_REPOSITORY" "$CHANNEL" "$asset" "$sum" "$target"
            done
            printf '\n  ]\n'
            printf '}\n'
          } > release-artifacts/lince-update.json

      - name: Sign update manifest
        env:
          SIGNING_KEY: ${{ secrets.LINCE_UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "LINCE_UPDATE_SIGNING_KEY is not set; refusing to publish an unsigned manifest" >&2
            exit 1
          fi
          key_hex="$(printf '%s' "$SIGNING_KEY" | tr -d '[:space:]')"
          { printf '302e020100300506032b657004220420'; printf '%s' "$key_hex"; } \
            | xxd -r -p > signing-key.der
          openssl pkeyutl -sign -inkey signing-key.der -keyform DER -rawin \
            -in release-artifacts/lince-update.json \
            | xxd -p | tr -d '\n' > release-artifacts/lince-update.json.sig
          rm -f signing-key.der

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: release-artifacts/*

  deploy-nixos:
    needs: [binary, publish-main, publish-rolling]
    if: ${{ always() && needs.binary.result == 'success' && ((github.ref == 'refs/heads/main' && needs.publish-main.result == 'success') || github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Rebuild NixOS server and restart Lince
        uses: appleboy/ssh-action@v1.2.0
        env:
          LINCE_REVISION: ${{ github.sha }}
          LINCE_BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: LINCE_REVISION,LINCE_BRANCH
          command_timeout: 25m
          script: |
            bash <<'BASH'
            set -euo pipefail
            if [ ! -d /sys/firmware/efi ] || [ "$(findmnt -no FSTYPE /)" != ext4 ] \
              || [ "$(findmnt -no FSTYPE /boot)" != vfat ] \
              || [ "$(readlink -f /dev/disk/by-label/nixos)" != "$(readlink -f "$(findmnt -no SOURCE /)")" ] \
              || [ "$(readlink -f /dev/disk/by-label/ESP)" != "$(readlink -f "$(findmnt -no SOURCE /boot)")" ]; then
              echo "Server boot mode or disk mounts do not match institute/server/configuration.nix" >&2
              exit 1
            fi
            if ! sudo test -s /var/lib/lince/initial-admin-password; then
              echo "Missing /var/lib/lince/initial-admin-password" >&2
              exit 1
            fi
            if [ "$LINCE_BRANCH" = main ]; then
              deploy_dir=$(mktemp -d)
              trap 'rm -rf "$deploy_dir"' EXIT
              curl -fL https://github.com/lince-social/lince/releases/download/main-binary/lince-flake.tar.gz \
                -o "$deploy_dir/lince-flake.tar.gz"
              tar -xzf "$deploy_dir/lince-flake.tar.gz" -C "$deploy_dir"
              if ! grep -Fq "\"revision\": \"$LINCE_REVISION\"" "$deploy_dir/lince/binary.json"; then
                echo "Published binary does not match this commit" >&2
                exit 1
              fi
              flake_ref="$deploy_dir/lince#institute-organ"
            else
              flake_ref="github:lince-social/lince/$LINCE_REVISION#institute-organ"
            fi
            sudo nixos-rebuild switch --flake "$flake_ref" --refresh
            sudo systemctl restart lince.service
            sudo systemctl status lince.service --no-pager -l
            BASH
