name: deploy-dev

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=mold"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Rust version
        id: toolchain
        run: python3 -c 'import tomllib; print("version=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        id: rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mold \
            pkg-config \
            libssl-dev \
            libsqlite3-dev

      - name: Restore compiled crates
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/source-cache.json
          key: deploy-v2-ubuntu-24.04-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            deploy-v2-ubuntu-24.04-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-
            deploy-v2-ubuntu-24.04-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('.cargo/config.toml') }}-

      - name: Restore unchanged source timestamps
        run: python3 scripts/ci/source-cache.py

      - name: Build deploy binary
        env:
          LINCE_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --package lince --no-default-features --timings
          install -Dm755 target/release/lince deploy-artifact/lince

      - name: Save compiled crates
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/source-cache.json
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: lince-deploy-dev
          path: deploy-artifact/lince
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: lince-deploy-dev
          path: deploy-artifact

      - name: Upload binary to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy-artifact/lince
          target: /tmp/lince-deploy
          overwrite: true

      - name: Install binary and restart service on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            REPO_DIR=/root/git/lince-social/lince
            BRANCH=dev

            cd "$REPO_DIR"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            REPO_DIR="$REPO_DIR" \
            BRANCH="$BRANCH" \
            SERVICE_NAME=lince \
            LINCE_SERVICE_PATTERN='lince*.service' \
            REMOTE_BINARY=/tmp/lince-deploy/deploy-artifact/lince \
            bash "$REPO_DIR/scripts/deploy/dev.sh" install-remote-binary
