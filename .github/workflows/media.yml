name: native-media
on:
  pull_request:
    paths:
      - 'crates/media/**'
      - 'crates/interface/src/communication/**'
      - 'Cargo.lock'
      - 'vendor/str0m-rust-crypto/**'
      - '.github/scripts/check-media-deps.py'
      - '.github/workflows/media.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: '-D warnings'
      CARGO_BUILD_JOBS: '2'
      CXX: 'lince-cxx-is-prohibited'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Linux media dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libasound2-dev libpipewire-0.3-dev libdbus-1-dev libpulse-dev xvfb xauth
      - name: Reject native media implementations
        run: python .github/scripts/check-media-deps.py
      - name: Check capture and media adapters
        run: cargo check --locked -p lince-media --features native --all-targets
      - name: Test bounded queues and native media loopback
        run: cargo test --locked -p lince-media --features native
      - name: Capture an isolated X11 screen
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum bash -c 'unset WAYLAND_DISPLAY; export LINCE_TEST_X11_DISPLAY="$DISPLAY"; cargo test --locked -p lince-media --features native --test screen -- --ignored'
