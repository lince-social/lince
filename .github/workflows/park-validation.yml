name: Park validation binaries

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact candidate commit
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTUP_TOOLCHAIN: 1.96.0
  RUSTFLAGS: '-D warnings -C link-arg=-fuse-ld=mold'
  CARGO_INCREMENTAL: '0'

jobs:
  helpers:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - name: Verify candidate revision
        env:
          CANDIDATE_REVISION: ${{ inputs.revision }}
        run: |
          [[ "$CANDIDATE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_REVISION"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold pkg-config meson ninja-build curl \
            libfontconfig-dev clang libclang-dev libpipewire-0.3-dev libdbus-1-dev \
            libglib2.0-dev libpulse-dev libspeechd-dev libva-dev libssl-dev libsqlite3-dev \
            libasound2-dev libwayland-dev libxkbcommon-dev libx11-dev libxcb1-dev \
            libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev libvulkan-dev \
            libegl1-mesa-dev libgbm-dev libdrm-dev libudev-dev libinput-dev libseat-dev
          curl --fail --location --retry 3 --output /tmp/libdisplay-info-0.4.0.tar.xz \
            https://gitlab.freedesktop.org/emersion/libdisplay-info/-/releases/0.4.0/downloads/libdisplay-info-0.4.0.tar.xz
          printf '%s\n' '43b180baa143e2035654759d84e2b2f5ee77d5fe817c423838c7fe59c0d68459  /tmp/libdisplay-info-0.4.0.tar.xz' | sha256sum --check
          tar -xf /tmp/libdisplay-info-0.4.0.tar.xz -C /tmp
          meson setup /tmp/libdisplay-info-build /tmp/libdisplay-info-0.4.0 --prefix=/usr/local --buildtype=release
          sudo meson install -C /tmp/libdisplay-info-build
          sudo ldconfig
          pkg-config --atleast-version=0.4.0 libdisplay-info
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/x86_64-unknown-linux-gnu/release
          key: park-validation-v3-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}-${{ inputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            park-validation-v3-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}-
            park-validation-v3-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-
            binary-v2-ubuntu-24.04-x86_64-unknown-linux-gnu-
      - name: Build Park validation helpers
        run: |
          mkdir -p validation-binaries
          cargo test --locked --message-format=json -p lince-park --features session,server-tests,clipboard-gate --lib --no-run > validation-binaries/fixtures.jsonl
          jq -r 'select(.reason == "compiler-artifact" and .target.name == "lince_park" and .executable != null) | .executable' validation-binaries/fixtures.jsonl | tail -1 | xargs -r -I '{}' cp '{}' validation-binaries/park-fixtures
          for client in session_probe capture_probe; do
            cargo run --locked -p lince-park-clients --bin "$client" -- --help
          done
          cargo run --locked -p lince-park --features server-tests --example park_control_probe -- --help
          cargo run --locked -p xtask -- park validate final
          cp target/debug/session_probe validation-binaries/session-probe
          cp target/debug/capture_probe validation-binaries/capture-probe
          cp target/debug/examples/park_control_probe validation-binaries/control-probe
          cp target/debug/xtask validation-binaries/xtask
          git rev-parse HEAD > validation-binaries/revision
          test -x validation-binaries/park-fixtures
      - name: Save compiled helpers
        if: ${{ !cancelled() && steps.cache.outputs.cache-primary-key != '' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/x86_64-unknown-linux-gnu/release
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: lince-park-validation-x86_64-unknown-linux-gnu
          path: validation-binaries/*
          if-no-files-found: error
          retention-days: 7
