name: Park Linux checks and package

on:
  workflow_call:
    inputs:
      advisory:
        type: boolean
        default: false
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
      - 'institute/packaging/linux/**'
      - 'institute/scripts/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/park.yml'

permissions:
  contents: read

concurrency:
  group: park-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTUP_TOOLCHAIN: 1.96.0
  RUSTFLAGS: '-D warnings'
  RUST_MIN_STACK: '33554432'
  CARGO_INCREMENTAL: '0'

jobs:
  packaging:
    runs-on: ubuntu-24.04
    continue-on-error: ${{ inputs.advisory == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check session registration and isolated launch environment
        run: nix build --no-link .#checks.x86_64-linux.park-session .#checks.x86_64-linux.park-launch .#checks.x86_64-linux.park-source-install
  linux:
    runs-on: ubuntu-24.04
    continue-on-error: ${{ inputs.advisory == true }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Rust version
        id: toolchain
        run: bash institute/scripts/rust-channel.sh >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: cachix/install-nix-action@v31
      - name: Test compiled-crate reuse
        run: python3 -B -m unittest discover -s institute/scripts -p 'test_ci_source_cache.py' -v
      - name: Compiler and protocol checks
        run: |
          nix develop --command bash -euo pipefail -c '
            pkg-config --atleast-version=0.4.0 libdisplay-info
            pkg-config --modversion libdisplay-info
            cargo xtask park ci
          '
      - name: Record graphics acceptance limits
        run: |
          printf '%s\n' 'Nested GPU/capture smoke: NOT RUN on this hosted job; no active hardware-backed Wayland session is provisioned.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Physical DRM, seat, lock, hotplug, suspend and clean-login acceptance: NOT RUN; use the prepared local validation runner.' >> "$GITHUB_STEP_SUMMARY"
