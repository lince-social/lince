name: Park Linux checks and package

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
      - 'institute/packaging/linux/**'
      - '.github/workflows/park.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
      - 'institute/packaging/linux/**'
      - '.github/workflows/park.yml'

permissions:
  contents: read

concurrency:
  group: park-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTFLAGS: '-D warnings'
  RUST_MIN_STACK: '33554432'
  CARGO_INCREMENTAL: '0'

jobs:
  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check session registration and isolated launch environment
        run: nix build --no-link .#checks.x86_64-linux.park-session .#checks.x86_64-linux.park-launch .#checks.x86_64-linux.park-source-install
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Rust version
        id: toolchain
        run: python3 -c 'import tomllib; print("version=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev libfontconfig-dev libpipewire-0.3-dev \
            libdbus-1-dev libglib2.0-dev libpulse-dev libspeechd-dev libva-dev \
            libssl-dev libsqlite3-dev libasound2-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev libgbm-dev libdrm-dev \
            libudev-dev libinput-dev libseat-dev
      - name: Compiler and protocol checks
        run: cargo xtask park ci
      - name: Record graphics acceptance limits
        run: |
          printf '%s\n' 'Nested GPU/capture smoke: NOT RUN on this hosted job; no active hardware-backed Wayland session is provisioned.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Physical DRM, seat, lock, hotplug, suspend and clean-login acceptance: NOT RUN; use the prepared local validation runner.' >> "$GITHUB_STEP_SUMMARY"
