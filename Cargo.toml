[workspace]
resolver = "3"
members = [
    "crates/lince",
    "crates/desktop",
    "crates/utils",
    "crates/web",
    "crates/nucleus",
    "crates/store",
    "crates/engine",
    "crates/protein",
    "crates/transport",
]

# desktop is a real workspace member so it inherits workspace fields and
# `cargo metadata` parses it (the tauri/nix build needs this). It builds
# under `nix develop`, which supplies the GTK/Tauri system libs. A plain
# `cargo build`/`cargo run` operates on `default-members` only (the lince
# binary), so it does not pull GTK and works outside the nix shell. The new
# core crates are built/tested explicitly with `-p` (e.g. `cargo test -p engine`).
default-members = ["crates/lince"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/lince-social/lince"
homepage = "https://lince.social"

[workspace.dependencies]
lince = { version = "=0.7.0", path = "crates/lince" }
utils = { version = "=0.7.0", path = "crates/utils", package = "lince-utils" }
web = { version = "=0.7.0", path = "crates/web", package = "lince-web" }
nucleus = { version = "=0.7.0", path = "crates/nucleus" }
store = { version = "=0.7.0", path = "crates/store" }
engine = { version = "=0.7.0", path = "crates/engine" }
protein = { version = "=0.7.0", path = "crates/protein" }
transport = { version = "=0.7.0", path = "crates/transport" }

argon2 = "0.5.3"
async-stream = "0.3.6"
async-trait = "0.1.89"
aws-config = "1.8.10"
aws-sdk-s3 = "1.112.0"
axum = "0.8.4"
base64 = "0.22.1"
chrono = "0.4.43"
color-eyre = "0.6.5"
crossterm = "0.29.0"
dirs = "6.0.0"
dotenvy = "0.15.7"
ed25519-dalek = "2.2.0"
futures = "0.3.31"
gpui = { version = "0.2.2" }
gpui-component = { version = "0.5.0" }
gpui-component-assets = { version = "0.5.0" }
include_dir = "0.7.4"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
maud = "0.27.0"
portable-pty = "0.9.0"
proc-macro2 = "1.0"
quote = "1.0"
ratatui = { version = "0.30.0" }
regex = "1.12.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rhai = "1.24.0"
ropey = "1.6.1"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlx = { version = "0.8.6" }
syn = { version = "2.0", features = ["full"] }
tokio = { version = "1.49.0", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-util = "0.7.18"
toml = "0.9.8"
tower-http = { version = "0.6.6", features = ["cors"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
urlencoding = "2.1.3"
utoipa = { version = "5.4.0" }
uuid = { version = "1.18.1", features = ["v4"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
tauri = { version = "2.11.2" }
tauri-build = { version = "2.6.2" }
tauri-plugin-single-instance = "2.3.4"
tauri-plugin-autostart = "2.5.0"

[profile.release]
opt-level = 3          # Maximum optimization
lto = true            # Full link-time optimization
codegen-units = 1     # Single compilation unit
debug = false         # No debug symbols (runtime doesn't care, size smaller)
incremental = false   # Better optimization
panic = "unwind"      # Keep panic recovery (or "abort" for ~1-3% more speed)

[profile.dev]
opt-level = 0        # Fastest compile
debug = true         # Debug symbols
incremental = true   # Fast incremental builds
codegen-units = 256  # Max parallelism
