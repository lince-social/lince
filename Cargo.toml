[workspace]
resolver = "3"
exclude = ["crates/vendor/parley", "crates/vendor/smithay"]
members = [
    "crates/lince",
    "crates/utils",
    "crates/nucleus",
    "crates/store",
    "crates/engine",
    "crates/protein",
    "crates/transport",
    "crates/anicca",
    "crates/sensei",
    "crates/geist",
    "crates/sandbox",
    "crates/park",
    "crates/practice",
    "crates/interface",
    "crates/i18n",
    "crates/ithkuil",
    "crates/mobile",
    "crates/document",
    "crates/resources",
    "crates/editor",
    "crates/fiote",
    "crates/cell",
    "crates/simulation",
    "crates/facade",
    "crates/media",
    "crates/xtask",
    "crates/ailuros",
    "crates/ailuros/protocol",
    "crates/plugins",
    "crates/plugin-nostr",
    "crates/plugin-activitypub",
    "crates/plugin-irc",
    "crates/plugin-files",
    "crates/map",
    "crates/hand-input",
    "crates/vendor/laya",
    "crates/vendor/flexaudio-mic",
    "crates/vendor/wake-reference",
    "crates/vendor/smithay-capture",
]

# `cargo build` / `cargo run` operate on `default-members` (the lince binary),
# which pulls the Cell runtime always and the Bevy interface behind the default
# `ui` feature. The interface links Wayland/Vulkan system libs, so a UI build
# wants `nix develop .#interface`; `cargo build -p lince --no-default-features`
# is the headless server binary. Core crates are checked with `-p`.
default-members = ["crates/lince"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lince-social/lince"
homepage = "https://lince.social"

[workspace.dependencies]
lince-i18n = { version = "=0.8.0", path = "crates/i18n" }
lince-ithkuil = { version = "=0.8.0", path = "crates/ithkuil" }
tnil = "=0.1.3"
lince = { version = "=0.8.0", path = "crates/lince" }
utils = { version = "=0.8.0", path = "crates/utils", package = "lince-utils" }
cell = { version = "=0.8.0", path = "crates/cell", package = "lince-cell" }
simulation = { version = "=0.8.0", path = "crates/simulation", package = "lince-simulation" }
lince-sandbox = { version = "=0.8.0", path = "crates/sandbox" }
lince-interface = { version = "=0.8.0", path = "crates/interface", default-features = false }
lince-practice = { version = "=0.8.0", path = "crates/practice" }
lince-map = { version = "=0.8.0", path = "crates/map" }
lince-media = { version = "=0.8.0", path = "crates/media" }
lince-resources = { version = "=0.8.0", path = "crates/resources" }
lince-facade = { version = "=0.8.0", path = "crates/facade" }
anicca = { version = "=0.8.0", path = "crates/anicca" }
nucleus = { version = "=0.8.0", path = "crates/nucleus" }
plugins = { version = "=0.8.0", path = "crates/plugins", package = "lince-plugins" }
store = { version = "=0.8.0", path = "crates/store" }
engine = { version = "=0.8.0", path = "crates/engine" }
protein = { version = "=0.8.0", path = "crates/protein" }
transport = { version = "=0.8.0", path = "crates/transport" }
fiote = { version = "=0.8.0", path = "crates/fiote", package = "lince-fiote" }
lince-ailuros = { version = "=0.8.0", path = "crates/ailuros" }

argon2 = "0.6.0"
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
# Sealing for the blind mailbox (Ontology C4). Ordinary primitives on purpose:
# the alternative considered was Keyhive/Beelay, which is pre-alpha and would
# have replaced both the sync protocol and the CRDT.
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
color-eyre = "0.6.5"
cpal = { version = "=0.18.2", features = ["pulseaudio"] }
crossterm = "0.29.0"
dirs = "7.0.0"
dotenvy = "0.15.7"
ed25519-dalek = "3.0.0"
futures = "0.3.34"
# gpui = { version = "0.2.2" }
# gpui-component = { version = "0.5.0" }
# gpui-component-assets = { version = "0.5.0" }
include_dir = "0.7.4"
# Exact-pinned (Ontology §11 "Compatibility and revocation floor"): two Cells on
# different iroh builds is a silent protocol change between peers. Bump
# deliberately, never via a caret range.
iroh = "=1.3.0"
# mDNS left iroh core at 1.0; LAN discovery now needs this companion crate.
iroh-mdns-address-lookup = "=0.5.0"
# QR rendering for pairing codes. Server-side because the sand runs under a CSP
# that blocks external scripts.
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rqrr = "=0.11.0"
# Only the two formats a browser canvas actually produces. The default feature
# set pulls a dozen codec crates that would never be called.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
postcard = { version = "1.1.3", features = ["alloc"] }
# Exact-pinned (Ontology §11 Collab): the record-doc CRDT engine. Upgrades are
# deliberate — bump together with the vendored loro-wasm browser asset.
loro = "=1.16.0"
maud = "0.27.0"
portable-pty = "0.9.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
ratatui = { version = "0.30.2" }
regex = "1.13.1"
schemars = "1.2.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
# xdg-portal only, no gtk3 feature: talks to xdg-desktop-portal via ashpd
# (pure Rust D-Bus client) with zero GTK/WebKit involvement — see
# presentation::http::media_assets::pick_image's doc comment for why this
# specific feature choice matters (a GTK-based picker is what crashes).
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
ropey = "1.6.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sensei = { version = "=0.8.0", path = "crates/sensei" }
geist = { version = "=0.8.0", path = "crates/geist" }
rust-sitter = "0.4.5"
rust-sitter-tool = "0.4.5"
hkdf = "0.13.0"
getrandom = "0.4.3"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
socket2 = "0.6.5"
sqlx = { version = "0.8.6" }
syn = { version = "3.0.5", features = ["full"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7.19"
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
urlencoding = "2.1.3"
utoipa = { version = "5.5.0" }
uuid = { version = "1.26.1", features = ["v4"] }
vodozemac = { version = "=0.11.1", default-features = false }
zeroize = "1.9.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[patch.crates-io]
parley = { path = "crates/vendor/parley" }
smithay = { path = "crates/vendor/smithay" }

[patch."https://github.com/Studio-Sadola/flexaudio"]
flexaudio-mic = { path = "crates/vendor/flexaudio-mic" }

[workspace.lints.rust]
warnings = "deny"

[profile.release]
opt-level = 3          # Maximum optimization
# lto = true            # Full link-time optimization
# codegen-units = 1     # Single compilation unit
debug = false         # No debug symbols (runtime doesn't care, size smaller)
# incremental = false   # Better optimization
panic = "unwind"      # Keep panic recovery (or "abort" for ~1-3% more speed)

[profile.dev]
opt-level = 0        # Fastest compile
# Line tables, not full debug info. This is where `target/` size actually
# goes: full DWARF for this dependency tree runs to well over 100 GiB and has
# filled the disk mid-build more than once. Line tables keep backtraces with
# file:line — the thing anyone actually reads — and drop the type and variable
# descriptions only a step-debugger uses.
#
# Compile time gets BETTER, not worse: less debug info to emit and far less
# for the linker to copy. Set this back to `true` if you need to step through
# locals in a debugger.
debug = "line-tables-only"
incremental = true   # Fast incremental builds
codegen-units = 256  # Max parallelism

[profile.dev.package.lince-hand-input]
opt-level = 2

[profile.dev.package.phonon-rs]
opt-level = 2

[profile.dev.package.best-tts]
opt-level = 2

[profile.dev.package.lince-wake-reference]
opt-level = 2

[profile.dev.package.rustfft]
opt-level = 2

[profile.dev.package.candle-core]
opt-level = 2

[profile.dev.package.candle-nn]
opt-level = 2

[profile.dev.package.candle-transformers]
opt-level = 2

[profile.dev.package.gemm]
opt-level = 2

[profile.dev.package.gemm-f32]
opt-level = 2

[profile.dev.package.gemm-common]
opt-level = 2

[profile.dev.package.ruzstd]
opt-level = 2

[profile.dev.package.lince-laya]
opt-level = 2

[profile.dev.package.tract-core]
opt-level = 2

[profile.dev.package.tract-data]
opt-level = 2

[profile.dev.package.tract-linalg]
opt-level = 2

[profile.dev.package.opus-rs]
opt-level = 2

[profile.dev.package.rav1e]
opt-level = 2

[profile.dev.package.rav1d]
opt-level = 2

[profile.dev.package.sonora-aec3]
opt-level = 2
