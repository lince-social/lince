[package]
name = "lince-ailuros-esp-iroh"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace]

[features]
device-check = []
camera = []

[[bin]]
name = "transport-check"
path = "src/bin/transport_check.rs"
required-features = ["device-check"]

[[bin]]
name = "camera"
path = "src/bin/camera.rs"
required-features = ["camera"]

[dependencies]
ailuros-protocol = { package = "lince-ailuros-protocol", version = "=0.8.0", path = "../../protocol" }
anyhow = "=1.0.103"
futures-util = { version = "=0.3.34", features = ["sink"] }
iroh = { version = "=1.3.0", default-features = false }
rusty_esp_iroh-host = { version = "=0.1.1", default-features = false, features = ["relay"] }
rustls-rustcrypto = { package = "rustls-rustcrypto-gated", version = "=0.0.2-alpha", default-features = false, features = ["std", "p256", "p384", "rsa", "zeroize"] }
rustls = { version = "=0.23.44", default-features = false, features = ["std"] }
tokio = { version = "=1.52.2", features = ["rt", "net", "time", "macros", "io-util", "sync"] }
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["codec"] }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = { version = "=0.53.0", default-features = false, features = ["std", "binstart"] }

[build-dependencies]
embuild = { version = "=0.33.5", features = ["espidf"] }

[dev-dependencies]
rcgen = "=0.14.10"
rustls = { version = "=0.23.44", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "=0.26.5", default-features = false }
tokio = { version = "=1.52.2", features = ["test-util"] }

[package.metadata.esp-idf-sys]
esp_idf_version = "v5.5.2"

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["../esp-idf/components/lince_core", "../esp-idf/components/lince_camera"]
bindings_header = "bindings.h"
bindings_module = "ailuros"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[lints.rust]
warnings = "deny"
