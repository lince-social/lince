[package]
name = "lince-ailuros-protocol"
version = "0.8.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[dependencies]
bytes = "=1.12.2"
tokio-util = { version = "=0.7.20", default-features = false, features = ["codec"] }

[dev-dependencies]
futures-util = "0.3.32"
tokio = { version = "1.52.2", features = ["io-util", "macros", "rt", "time"] }

[lints.rust]
warnings = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
