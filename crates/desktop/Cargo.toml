[package]
name = "lince-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native desktop shell for Lince."

[build-dependencies]
sensei = { workspace = true }

[target.'cfg(not(target_os = "linux"))'.build-dependencies]
tauri-build = { workspace = true }

[dependencies]
utils = { workspace = true }
# native-picker: the "/image" slash block's system file dialog (2026-07-18,
# runs server-side via rfd's xdg-portal backend — see
# web::presentation::http::media_assets::pick_and_store_image). Only the
# desktop shell enables it; the plain lince CLI doesn't need a local display.
web = { workspace = true, features = ["native-picker"] }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "process", "time", "macros", "sync"] }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
anyhow = "1.0"
tauri = { workspace = true, features = ["image-png", "tray-icon"] }

[target.'cfg(all(not(target_os = "linux"), not(any(target_os = "android", target_os = "ios"))))'.dependencies]
tauri-plugin-autostart = { workspace = true }
tauri-plugin-single-instance = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
lince-interface = { path = "../interface", features = ["native-runtime"] }

[[bin]]
name = "lince-desktop"
path = "src/main.rs"

[lints]
workspace = true
