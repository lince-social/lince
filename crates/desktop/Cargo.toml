[package]
name = "lince-desktop"
version = "0.8.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/lince-social/lince"
homepage = "https://lince.social"
description = "Desktop application and native runtime for Lince."

[features]
default = ["native-runtime"]
instinct = ["native-runtime", "engine/instinct"]
native-media = ["native-runtime", "dep:lince-media", "lince-media/native"]
native-runtime = [
    "dep:lince-interface",
    "dep:lince-document",
    "dep:lince-editor",
    "dep:rfd",
    "dep:cpal",
    "dep:tts",
    "dep:ttf-parser",
    "dep:qrcode",
    "dep:nokhwa",
    "dep:hound",
    "dep:naga",
    "dep:wasmi",
    "dep:reqwest",
    "dep:pulldown-cmark",
    "dep:mermaid-rs-renderer",
    "dep:resvg",
    "dep:accesskit",
    "dep:bevy",
    "dep:bevy_gaussian_splatting",
    "dep:flexbuffers",
    "dep:cell",
    "dep:simulation",
    "dep:tokio",
    "dep:protein",
    "dep:engine",
    "dep:store",
    "dep:serde_json",
    "dep:serde",
    "dep:image",
    "dep:ksni",
    "dep:tray-icon",
    "dep:muda",
    "dep:rustix",
    "dep:getrandom",
    "dep:avian3d",
    "dep:toml",
    "dep:nucleus",
    "dep:tempfile",
    "dep:chrono",
    "dep:iana-time-zone",
    "dep:loro",
    "dep:base64",
    "dep:x11rb",
    "dep:raw-window-handle",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_input_focus",
    "bevy/bevy_text",
    "bevy/bevy_ui",
    "bevy/bevy_ui_render",
    "bevy/bevy_ui_widgets",
    "bevy/bevy_winit",
    "bevy/ui_picking",
    "bevy/wayland",
    "bevy/x11",
    "bevy/accesskit_unix",
    "bevy/system_clipboard",
    "bevy/clipboard_image",
    "bevy/png",
    "bevy/jpeg",
    "bevy/bevy_gltf",
    "bevy/bevy_pbr",
    "bevy/mesh_picking",
    "bevy/ghost_nodes",
    "bevy/reflect_auto_register",
]

[dependencies]
async-trait = { workspace = true }
store = { workspace = true, optional = true }
simulation = { workspace = true, optional = true }
lince-interface = { workspace = true, optional = true, features = ["ui", "models", "behavior-checks"] }
lince-document = { path = "../document", optional = true }
lince-editor = { path = "../editor", optional = true }
rfd = { workspace = true, optional = true }
qrcode = { workspace = true, optional = true }
nokhwa = { version = "=0.10.11", default-features = false, features = ["input-native"], optional = true }
lince-media = { workspace = true, optional = true }
cpal = { version = "=0.15.3", optional = true }
tts = { version = "=0.26.3", optional = true, default-features = false }
ttf-parser = { version = "=0.25.1", optional = true }
hound = { version = "=3.5.1", optional = true }
naga = { version = "=29.0.4", features = ["wgsl-in"], optional = true }
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "validate", "auto-dispatch"], optional = true }
reqwest = { workspace = true, optional = true }
pulldown-cmark = { version = "=0.13.4", default-features = false, optional = true }
mermaid-rs-renderer = { version = "=0.3.1", default-features = false, optional = true }
resvg = { version = "=0.48.1", default-features = false, features = ["text"], optional = true }
accesskit = { version = "=0.24.1", optional = true }
loro = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
iana-time-zone = { version = "=0.1.65", optional = true }
nucleus = { workspace = true, optional = true }
tempfile = { version = "=3.27.0", optional = true }
bevy = { version = "=0.19.1", default-features = false, features = ["async_executor", "bevy_asset", "bevy_log", "bevy_render", "multi_threaded", "std"], optional = true }
bevy_gaussian_splatting = { version = "=8.0.2", default-features = false, features = ["io_flexbuffers", "planar", "buffer_storage", "sh3", "sort_radix"], optional = true }
flexbuffers = { version = "=25.12.19", optional = true }
cell = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
protein = { path = "../protein", optional = true }
engine = { path = "../engine", optional = true }
serde_json = { workspace = true, optional = true, features = ["float_roundtrip"] }
serde = { workspace = true, optional = true }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
getrandom = { workspace = true, optional = true }
avian3d = { version = "=0.7.0", default-features = false, features = ["3d", "f64", "parry-f64", "enhanced-determinism", "xpbd_joints"], optional = true }
toml = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["process", "fs", "param"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "=0.13.2", optional = true }
raw-window-handle = { version = "=0.6.2", optional = true }
ksni = { version = "=0.3.6", default-features = false, features = ["async-io"], optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "=0.25.0", default-features = false, optional = true }
muda = { version = "=0.20.0", default-features = false, optional = true }

[build-dependencies]
cc = "1.2"
sensei = { workspace = true }
resvg = { version = "0.48.1", default-features = false }

[dev-dependencies]
iroh = { workspace = true }
store = { workspace = true }
nucleus = { workspace = true }
tempfile = "=3.27.0"

