[package]
name = "lince-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native desktop shell for Lince."

[build-dependencies]
sensei = { workspace = true }

[target.'cfg(not(target_os = "linux"))'.build-dependencies]
tauri-build = { workspace = true }

[dependencies]
utils = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "process", "time", "macros", "sync"] }

# The Cell server and its bootstrap live in the Tauri shell only. On Linux the
# desktop binary is the native interface and nothing else, so lince-web — and
# with it every HTML asset, maud and the board routes — is not compiled at all.
[target.'cfg(not(target_os = "linux"))'.dependencies]
web = { workspace = true, features = ["native-picker"] }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
anyhow = "1.0"
tauri = { workspace = true, features = ["image-png", "tray-icon"] }

[target.'cfg(all(not(target_os = "linux"), not(any(target_os = "android", target_os = "ios"))))'.dependencies]
tauri-plugin-autostart = { workspace = true }
tauri-plugin-single-instance = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
lince-interface = { path = "../interface", features = ["native-runtime"] }

[[bin]]
name = "lince-desktop"
path = "src/main.rs"

[lints]
workspace = true
