[package]
name = "lince-fiote"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "fiote"
path = "src/lib.rs"

[features]
test-agent = []

[[bin]]
name = "lince-acp-test-agent"
path = "tests/support/agent.rs"
required-features = ["test-agent"]

[dependencies]
nucleus = { workspace = true }
hound = "=3.5.1"
earshot = "=1.2.2"
wake-reference = { package = "lince-wake-reference", path = "../vendor/wake-reference" }
tract-onnx = { version = "=0.23.8", default-features = false }
best-tts = { git = "https://github.com/studio-ransom/best-tts-rust", rev = "5f9280c761a5c147bb682321f3f019482fab3e7b", default-features = false }
phonon = { package = "phonon-rs", version = "=0.1.3", default-features = false }
rayon = "=1.12.0"
candle-core = { version = "=0.11.0", default-features = false }
candle-nn = { version = "=0.11.0", default-features = false }
candle-transformers = { version = "=0.11.0", default-features = false }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
ruzstd = "=0.8.3"
tar = "=0.4.46"
laya = { path = "../vendor/laya", package = "lince-laya" }
base64 = { workspace = true }
portable-pty = { workspace = true }
agent-client-protocol = "=2.2.0"
async-trait = { workspace = true }
futures = { workspace = true }
cap-std = "=4.0.3"
genai = "=0.6.5"
openidconnect = { version = "=4.0.1", default-features = false }
eventsource-stream = "=0.2.3"
httpdate = "=1.0.3"
uuid = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true, features = ["multipart", "stream", "form"] }
tempfile = "=3.27.0"
url = "2.5.8"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["process"] }

[dev-dependencies]
chrono = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[build-dependencies]
sensei = { workspace = true }

[lints]
workspace = true
