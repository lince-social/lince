[package]
name = "lince-fiote"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "fiote"
path = "src/lib.rs"

[features]
test-agent = []

[[bin]]
name = "lince-acp-test-agent"
path = "tests/support/agent.rs"
required-features = ["test-agent"]

[dependencies]
nucleus = { workspace = true }
hound = "=3.5.1"
base64 = { workspace = true }
portable-pty = { workspace = true }
agent-client-protocol = "=2.2.0"
async-trait = { workspace = true }
futures = { workspace = true }
cap-std = "=4.0.3"
genai = "=0.6.5"
openidconnect = { version = "=4.0.1", default-features = false }
eventsource-stream = "=0.2.3"
httpdate = "=1.0.3"
uuid = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true, features = ["multipart", "stream", "form"] }
tempfile = "=3.27.0"
url = "2.5.8"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[build-dependencies]
sensei = { workspace = true }

[lints]
workspace = true
