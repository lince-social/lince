[package]
name = "lince-interface"
version = "0.7.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/lince-social/lince"
homepage = "https://lince.social"
description = "Native Interface runtime for Lince."

[features]
default = ["native-runtime"]
native-runtime = [
    "dep:bevy",
    "dep:cell",
    "dep:tokio",
    "dep:protein",
    "dep:engine",
    "dep:serde_json",
    "dep:serde",
    "dep:image",
    "dep:ksni",
    "dep:tray-icon",
    "dep:muda",
    "dep:rustix",
    "dep:getrandom",
    "dep:avian3d",
    "dep:toml",
    "dep:nucleus",
    "dep:tempfile",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_input_focus",
    "bevy/bevy_text",
    "bevy/bevy_ui",
    "bevy/bevy_ui_render",
    "bevy/bevy_ui_widgets",
    "bevy/bevy_winit",
    "bevy/ui_picking",
    "bevy/wayland",
    "bevy/accesskit_unix",
    "bevy/system_clipboard",
    "bevy/png",
]

[dependencies]
nucleus = { workspace = true, optional = true }
tempfile = { version = "=3.27.0", optional = true }
bevy = { version = "=0.19.1", default-features = false, features = ["async_executor", "bevy_asset", "bevy_log", "bevy_render", "multi_threaded", "std"], optional = true }
cell = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
protein = { path = "../protein", optional = true }
engine = { path = "../engine", optional = true }
serde_json = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
image = { version = "=0.25.10", default-features = false, features = ["png"], optional = true }
getrandom = { workspace = true, optional = true }
avian3d = { version = "=0.7.0", default-features = false, features = ["3d", "f64", "parry-f64", "enhanced-determinism", "xpbd_joints"], optional = true }
toml = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["process", "fs"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.6", default-features = false, features = ["async-io"], optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "=0.25.0", default-features = false, optional = true }
muda = { version = "=0.20.0", default-features = false, optional = true }

[build-dependencies]
sensei = { workspace = true }
resvg = { version = "0.48.1", default-features = false }

[dev-dependencies]
nucleus = { workspace = true }
tempfile = "=3.27.0"

