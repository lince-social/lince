[package]
name = "lince"
version.workspace = true
edition.workspace = true
description = "Tool for registry, interconnection and automation of Needs and Contributions with open scope"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["registry", "automation", "self-hosted"]

[features]
default = ["ui"]
stuff = ["lince-sandbox?/stuff"]
instinct = ["cell/instinct", "lince-sandbox?/instinct"]
# The native window. Off for a headless server build:
# `cargo build -p lince --no-default-features`.
ui = ["dep:lince-sandbox", "lince-sandbox/native-media"]
park = ["dep:lince-park", "lince-park/session"]
facade = ["dep:lince-facade"]

[dependencies]
anicca = { workspace = true }
nucleus = { workspace = true }
protein = { workspace = true }
cell = { workspace = true }
engine = { workspace = true }
simulation = { workspace = true }
lince-facade = { workspace = true, optional = true }
lince-sandbox = { workspace = true, optional = true }
lince-interface = { workspace = true, features = ["activation"] }
lince-park = { path = "../park", optional = true }
utils = { workspace = true, features = ["update-net"] }
store = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "process", "time", "macros", "signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[build-dependencies]
sensei = { workspace = true }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
