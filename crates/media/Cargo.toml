[package]
name = "lince-media"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native desktop capture and peer media for Lince."

[features]
default = []
native = ["dep:str0m", "dep:opus-rs", "dep:sonora", "dep:rav1e", "dep:rav1d", "dep:scrcap", "dep:if-addrs", "dep:turn-client-proto", "dep:turn-client-rustls", "dep:rustls-rustcrypto", "dep:webpki-roots", "dep:flexaudio", "dep:cpal", "dep:nokhwa", "dep:tokio", "dep:x11rb", "dep:windows-sys"]

[dependencies]
str0m = { version = "=0.23.1", default-features = false, features = ["rust-crypto"], optional = true }
opus-rs = { version = "=0.1.34", optional = true }
sonora = { version = "=0.2.0", optional = true }
rav1e = { version = "=0.8.1", default-features = false, features = ["threading"], optional = true }
rav1d = { version = "=1.1.0", default-features = false, features = ["bitdepth_8"], optional = true }
scrcap = { version = "=0.1.0-alpha.2", optional = true }
if-addrs = { version = "=0.15.0", optional = true }
turn-client-proto = { version = "=0.7.2", default-features = false, features = ["std"], optional = true }
turn-client-rustls = { version = "=0.1.1", optional = true }
rustls-rustcrypto = { version = "=0.0.2-alpha", optional = true }
webpki-roots = { version = "=1.0.9", optional = true }
flexaudio = { git = "https://github.com/Studio-Sadola/flexaudio", rev = "e36ca9fe8151cd821a35a13aa8fbf55c999e64ce", optional = true }
cpal = { version = "=0.16.0", optional = true }
nokhwa = { version = "=0.10.11", default-features = false, features = ["input-native"], optional = true }
tokio = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Graphics_Gdi"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "=0.13.2", default-features = false, features = ["randr"], optional = true }

[build-dependencies]
sensei = { workspace = true }

[lints]
workspace = true
