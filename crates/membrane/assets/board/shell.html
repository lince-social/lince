<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lince Cell</title>
  <link rel="stylesheet" href="/board/board.css" />
</head>
<body>
  <div id="board-shell" class="board-shell">
    <!-- Top bar: workspace tabs + edit-mode toggle (host chrome). -->
    <div id="board-topbar" class="board-topbar">
      <div id="workspace-tabs" class="workspace-tabs"></div>
      <div class="topbar-actions">
        <span id="live-dot" class="live-dot" title="transport"></span>
        <button id="edit-toggle" class="chrome-btn" type="button">Edit</button>
      </div>
    </div>

    <!-- The canvas: an overflow-hidden pane whose #board-world is transformed by
         the camera. Pan/zoom gestures attach to #board-canvas; cards live in
         #cards-layer (world space) or #pinned-layer (screen space). These ids
         are the DOM contract the reused viewport/interactions modules expect. -->
    <div id="board-canvas" class="board-canvas">
      <div id="board-world" class="board-world">
        <div id="board-grid" class="board-grid"></div>
        <div id="cards-layer" class="cards-layer"></div>
      </div>
      <div id="pinned-layer" class="pinned-layer"></div>
      <div id="board-zoom" class="board-zoom">
        <button id="board-zoom-out" class="chrome-btn" type="button">−</button>
        <span id="board-zoom-indicator" class="zoom-indicator">100%</span>
        <button id="board-zoom-in" class="chrome-btn" type="button">+</button>
        <button id="board-recenter" class="chrome-btn" type="button">⌂</button>
      </div>
    </div>
  </div>

  <script type="module" src="/board/board.js"></script>
</body>
</html>
