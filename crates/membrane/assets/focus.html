<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Focus</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 14px/1.45 system-ui, -apple-system, sans-serif;
      background: #161b22; color: #c9d1d9; padding: .9rem;
    }
    .head { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em;
            color: #6e7681; margin-bottom: .6rem; display: flex; justify-content: space-between; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #f85149; display: inline-block; }
    .dot.live { background: #3fb950; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; align-items: center; gap: .55rem; padding: .5rem .1rem;
         border-bottom: 1px solid #21262d; }
    li:last-child { border-bottom: 0; }
    .focus .title { font-size: 1.05rem; font-weight: 600; color: #e6edf3; }
    .up-next .title { color: #8b949e; }
    .title { flex: 1; }
    button.done {
      width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #3fb950;
      background: transparent; cursor: pointer; flex: none; padding: 0;
    }
    button.done:hover { background: #3fb950; }
    .empty { color: #6e7681; padding: 1rem .1rem; }
  </style>
</head>
<body>
  <div class="head">
    <span>Focus queue</span>
    <span><span id="dot" class="dot"></span></span>
  </div>
  <ul id="list"></ul>

  <script>
    // The sand contract, in ~40 lines: open the transport, subscribe with a
    // Protein, render snapshots + live updates, mutate through Actions. No
    // knowledge of tables or SQL — only Protein and Actions cross this line.
    const SUB = "focus";
    const list = document.getElementById("list");
    const dot = document.getElementById("dot");
    let ws, rows = [];

    // A Protein: active plain Needs, ordered by the @before link graph, then
    // oldest. Identical to the server's canned focus_queue().
    const focusProtein = {
      source: "record",
      where: [ { quantity_lt: 0.0 }, { kind_eq: "plain" } ],
      order: [ { topo: "before" }, { asc: "created_at" } ]
    };

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onopen = () => {
        dot.classList.add("live");
        send({ type: "subscribe", id: SUB, protein: focusProtein });
      };
      ws.onclose = () => { dot.classList.remove("live"); setTimeout(connect, 1000); };
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if ((msg.type === "snapshot" || msg.type === "update") && msg.id === SUB) {
          rows = msg.rows; render();
        }
      };
    }

    function send(m) { ws.send(JSON.stringify(m)); }

    // Completing the focus is an Action -> a fact; the server pushes the
    // recomputed queue back over the same subscription. The sand holds no
    // ordering logic — the topo sort lives in the core.
    function complete(uid) {
      send({ type: "act", id: "done-" + uid,
             action: { action: "set-quantity", target: uid, value: 0.0 } });
    }

    function render() {
      list.innerHTML = "";
      if (rows.length === 0) {
        const li = document.createElement("li");
        li.className = "empty"; li.textContent = "Nothing needs doing. ✨";
        list.appendChild(li); return;
      }
      rows.forEach((r, i) => {
        const li = document.createElement("li");
        li.className = i === 0 ? "focus" : "up-next";
        const btn = document.createElement("button");
        btn.className = "done"; btn.title = "Mark done";
        btn.onclick = () => complete(r.uid);
        const title = document.createElement("span");
        title.className = "title"; title.textContent = r.head || r.slug || r.uid;
        li.append(btn, title);
        list.appendChild(li);
      });
    }

    connect();
  </script>
</body>
</html>
