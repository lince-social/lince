[package]
name = "lince-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "lince-mobile-preview"
path = "src/main.rs"
required-features = ["preview"]

[features]
default = []
preview = ["bevy/x11", "bevy/wayland"]
android-smoke = []

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log", "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_ui", "bevy_ui_render", "bevy_ui_widgets", "bevy_input_focus", "bevy_picking", "ui_picking", "keyboard", "mouse", "touch", "bevy_window"] }
lince-interface = { workspace = true, features = ["ui", "models", "images"] }
cell = { workspace = true }
engine = { workspace = true }
nucleus = { workspace = true }
protein = { workspace = true }
store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
utils = { workspace = true }
base64 = { workspace = true }
loro = { workspace = true }
chrono = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["android-native-activity"] }
jni = "=0.21.1"
jni-runtime = { package = "jni", version = "=0.22.4" }
rustls-platform-verifier = "=0.7.1"

[build-dependencies]
sensei = { workspace = true }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
