import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

def workspace = rootProject.projectDir.toPath().resolve('../../..').normalize().toFile()
def abi = providers.gradleProperty('linceAbi').getOrElse('arm64-v8a')
def targets = ['arm64-v8a': 'aarch64-linux-android', 'x86_64': 'x86_64-linux-android']
if (!targets.containsKey(abi)) { throw new GradleException('Supported Android ABIs: arm64-v8a, x86_64') }
def smoke = providers.gradleProperty('linceSmoke').getOrElse('false') == 'true'
def code = providers.environmentVariable('LINCE_ANDROID_VERSION_CODE').getOrElse('1').toInteger()
if (code < 1 || code > 2100000000) { throw new GradleException('Invalid Android version code') }
def signingPurpose = providers.gradleProperty('linceSigning').getOrElse('app')
if (!(signingPurpose in ['app', 'upload'])) { throw new GradleException('linceSigning must be app or upload') }
def signingPrefix = signingPurpose == 'upload' ? 'LINCE_ANDROID_UPLOAD' : 'LINCE_ANDROID'
def signingPath = providers.environmentVariable("${signingPrefix}_KEYSTORE").orNull
def metadata = providers.exec {
    workingDir workspace
    commandLine 'cargo', 'metadata', '--locked', '--format-version', '1', '--filter-platform', targets[abi]
}.standardOutput.asText.get()
def packages = new JsonSlurper().parseText(metadata).packages
def verifier = packages.find { it.name == 'rustls-platform-verifier-android' }
dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
    implementation "org.rustls:rustls-platform-verifier:${verifier.version}"
}

android {
    namespace 'social.lince.mobile'
    compileSdk 35
    ndkVersion '28.2.13676358'
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'social.lince.mobile'
        minSdk 28
        targetSdk 35
        versionCode code
        versionName packages.find { it.name == 'lince-mobile' }.version
        buildConfigField 'boolean', 'LINCE_SMOKE', smoke.toString()
        resValue 'string', 'lince_app_name', smoke ? 'Lince Test' : 'Lince'
        ndk { abiFilters abi }
    }
    signingConfigs {
        if (signingPath != null) {
            distribution {
                storeFile file(signingPath)
                storePassword providers.environmentVariable("${signingPrefix}_STORE_PASSWORD").get()
                keyAlias providers.environmentVariable("${signingPrefix}_KEY_ALIAS").get()
                keyPassword providers.environmentVariable("${signingPrefix}_KEY_PASSWORD").get()
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix smoke ? '.smoketest' : '.debug' }
        release {
            minifyEnabled false
            ndk { debugSymbolLevel 'FULL' }
            if (signingPath != null) { signingConfig signingConfigs.distribution }
        }
    }
    packaging { jniLibs { useLegacyPackaging false } }
    lint { warningsAsErrors true }
}

gradle.taskGraph.whenReady { graph ->
    if (signingPurpose == 'upload' && graph.hasTask(':app:assembleRelease')) {
        throw new GradleException('Use the app signing key for installable release APKs; the upload key is for bundleRelease')
    }
}

def icons = layout.buildDirectory.dir('generated/linceIcons')
def copyIcon = tasks.register('copyLinceIcon', Sync) {
    into icons
    into('drawable-nodpi') {
        from new File(workspace, 'institute/assets/logo/preto.png')
        rename { 'lince_mark.png' }
    }
}
android.sourceSets.main.res.srcDir(icons)
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn copyIcon }

['Debug', 'Release'].each { variant ->
    def output = layout.buildDirectory.dir("rust/${variant.toLowerCase()}/jniLibs")
    android.sourceSets.getByName(variant.toLowerCase()).jniLibs.srcDir(output)
    def rust = tasks.register("compileRust${variant}", Exec) {
        workingDir workspace
        environment 'ANDROID_NDK_HOME', new File(android.sdkDirectory, "ndk/${android.ndkVersion}").absolutePath
        environment 'CARGO_ENCODED_RUSTFLAGS', '-D\u001fwarnings\u001f-C\u001flink-arg=-Wl,-z,max-page-size=16384'
        if (variant == 'Release') { environment 'CARGO_PROFILE_RELEASE_DEBUG', 'line-tables-only' }
        def args = ['cargo', 'ndk', '-t', abi, '--platform', '28', '-o', output.get().asFile.absolutePath,
                    'rustc', '--locked', '-p', 'lince-mobile', '--lib']
        if (variant == 'Release') { args.add('--release') }
        if (smoke) { args.addAll(['--features', 'android-smoke']) }
        doFirst {
            if (smoke && variant == 'Release') { throw new GradleException('Smoke controls must never be built into a release APK') }
            if (variant == 'Release' && signingPath == null) { throw new GradleException("Set ${signingPrefix}_KEYSTORE and signing credentials before building a release") }
        }
        commandLine args
    }
    tasks.matching { it.name == "pre${variant}Build" }.configureEach { dependsOn rust }
}
