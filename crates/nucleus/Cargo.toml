[package]
name = "nucleus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Lince pure core: primitives, expression engine, graphs, frequency math. No IO, no SQL, DST-testable alone."

[features]
default = ["optimization-solver", "shader-compiler"]
optimization-solver = ["dep:microlp"]
shader-compiler = ["lince-wgsl/compiler"]

[dependencies]
lingua = { workspace = true }
lince-karma.workspace = true
lince-instrumentation.workspace = true
lince-wgsl.workspace = true
microlp = { version = "=0.6.0", optional = true }
base64 = { workspace = true }
regex = { workspace = true }
url = "2.5.8"
schemars = { workspace = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
glam = "=0.33.12"
chrono = { workspace = true, features = ["serde"] }
chrono-tz = "=0.10.4"
sha2 = { workspace = true }
uuid = { workspace = true }

[build-dependencies]
sensei = { workspace = true }

[[test]]
name = "demeter"
required-features = ["optimization-solver"]

[[test]]
name = "demeter_production"
required-features = ["optimization-solver"]

[lints]
workspace = true
