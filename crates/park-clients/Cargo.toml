[package]
name = "lince-park-clients"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
rustix = { version = "=1.1.4", features = ["event", "time", "fs"] }
tempfile = "=3.27.0"
serde_json.workspace = true

[[bin]]
name = "session_probe"
path = "../park/examples/session_probe.rs"
test = false
bench = false

[[bin]]
name = "capture_probe"
path = "../park/examples/capture_probe.rs"
test = false
bench = false

[lints]
workspace = true
