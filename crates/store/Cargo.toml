[package]
name = "store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Lince storage: the only crate that speaks SQL. Schema, migrations, typed repositories."

[dependencies]
nucleus = { workspace = true }
async-trait = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite-bundled", "sqlite-unlock-notify", "migrate", "macros"] }
libsqlite3-sys = { version = "=0.40.0", default-features = false }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
tokio = { workspace = true }
unicode-normalization = "=0.1.26"
tempfile = "=3.27.0"

[build-dependencies]
sensei = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
