[package]
name = "transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Lince first-party channel: multiplexed Protein subscriptions, typed Actions, and ephemeral capability streams. The sand boundary."

[features]
default = []
mcp = ["dep:axum", "dep:rmcp", "dep:tokio-util", "dep:getrandom"]
# The reference websocket driver over axum. Off by default so pure consumers
# (and tests) don't pull axum.
axum = ["dep:axum", "dep:futures", "terminal"]
terminal = ["dep:dirs", "dep:portable-pty", "dep:libc"]

[dependencies]
sha2 = { workspace = true }
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "transport-streamable-http-server"], optional = true }
tokio-util = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
loro = { workspace = true }
schemars = { workspace = true }
fiote = { workspace = true }
nucleus = { workspace = true }
store = { workspace = true }
utils = { workspace = true }
engine = { workspace = true }
async-trait = { workspace = true }
iroh = { workspace = true }
tracing = { workspace = true }
protein = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true, optional = true, features = ["ws"] }
base64 = { workspace = true }
dirs = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
portable-pty = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
# A live guest signs its Actions exactly as a browser would, so the workflow
# test has to hold a real Ed25519 key rather than a stub.
base64 = { workspace = true }
ed25519-dalek = { workspace = true }

[build-dependencies]
sensei = { workspace = true }

[lints]
workspace = true
