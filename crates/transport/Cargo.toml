[package]
name = "transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Lince first-party channel: multiplexed Protein subscriptions, typed Actions, and ephemeral capability streams. The sand boundary."

[features]
default = []
# The reference websocket driver over axum. Off by default so pure consumers
# (and tests) don't pull axum.
axum = ["dep:axum", "dep:base64", "dep:dirs", "dep:futures", "dep:portable-pty"]

[dependencies]
nucleus = { workspace = true }
store = { workspace = true }
engine = { workspace = true }
async-trait = { workspace = true }
iroh = { workspace = true }
tracing = { workspace = true }
protein = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true, optional = true, features = ["ws"] }
base64 = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
portable-pty = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
# A live guest signs its Actions exactly as a browser would, so the workflow
# test has to hold a real Ed25519 key rather than a stub.
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
