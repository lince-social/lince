[package]
name = "lince-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Internal web frontend for the lince binary."

[lib]
name = "web"

[features]
browser-watch = []
# The server-side native "/image" file picker (rfd's xdg-portal backend)
# pulls in wayland-sys, which needs pkg-config + wayland dev headers at
# build time — fine inside the desktop crate's nix devShell, but the plain
# `lince` CLI binary must keep building with just cargo + rustc (see the
# workspace Cargo.toml comment on `default-members`). Only lince-desktop
# enables this feature.
native-picker = ["dep:rfd"]

[dependencies]
axum = { workspace = true, features = ["json", "multipart", "ws"] }
chrono = { workspace = true }
crossterm = { workspace = true }
dirs = { workspace = true }
engine = { workspace = true }
include_dir = { workspace = true }
maud = { workspace = true }
nucleus = { workspace = true }
protein = { workspace = true }
reqwest = { workspace = true }
rfd = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
socket2 = { workspace = true }
store = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { workspace = true, features = ["sync"] }
toml = { workspace = true }
tower-http = { workspace = true, features = ["fs", "cors"] }
transport = { workspace = true, features = ["axum"] }
tracing = { workspace = true }
urlencoding = { workspace = true }
utils = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
zip = { workspace = true, default-features = false, features = ["deflate"] }
