[package]
name = "lince-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Internal web frontend for the lince binary."

[lib]
name = "web"

[features]
browser-watch = []

[dependencies]
axum = { workspace = true, features = ["json", "multipart", "ws"] }
chrono = { workspace = true }
crossterm = { workspace = true }
dirs = { workspace = true }
engine = { workspace = true }
include_dir = { workspace = true }
maud = { workspace = true }
nucleus = { workspace = true }
protein = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
store = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { workspace = true, features = ["sync"] }
toml = { workspace = true }
tower-http = { workspace = true, features = ["fs", "cors"] }
transport = { workspace = true, features = ["axum"] }
tracing = { workspace = true }
urlencoding = { workspace = true }
utils = { workspace = true }
zip = { workspace = true, default-features = false, features = ["deflate"] }

