<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kanban</title>
  <link rel="stylesheet" href="/board/lynx-ui.css" />
  <script src="/board/lynx-ui.js"></script>
  <script src="/board/frame.js"></script>
  <script src="/board/editor.js"></script>
  <style>
    /* Ported from the retired server-rendered kanban (git ea54ead^): panel
       header with query introspection + status, lane columns with
       collapse/resize, an edit sheet, optimistic drag moves — client-rendered
       on Protein/Actions. Filtering/sorting and the Protein choice are BASE UI
       (the card's Data panel), not sand chrome; creation happens in the
       pinned Record sand (the `recordCreate` event), not a kanban sheet.
       K3 adds the column system: a Columns sheet (create/rename/delete/sort/
       hide, value or range or @concept buckets), presets as sand-config
       records, concept-name resolution, multi-select bulk move.
       K2 (checkbox part) + editing-surface decision (2026-07-16, revised
       2026-07-17): the kanban itself writes checkbox toggles, in-place body
       edits, column moves, AND bulk delete of selected cards (confirmed via
       an in-sand modal) — head/metadata/assignees edits are still
       the pinned Record sand's job, so the old full edit sheet stays gone. */
    :root { color-scheme: dark; --bg: #121214; --panel: #121214; --panel2: #121214; --line: #141416; --text: #f8fafc; --muted: color-mix(in srgb, #f8fafc 62%, #121214); --accent: #6366f1; --good: var(--muted); --warn: var(--muted); --border: #141416; --surface: #121214; --surface-hover: #141416; --control-border: #f8fafc; --hot-border: #fb7185; --font-body: Lato, system-ui, sans-serif; --font-title: Aleo, Georgia, serif; --font-mono: "SFMono-Regular", Consolas, monospace; --hairline: .5px; --lynx-shadow-x: 2px; --lynx-shadow-y: 2px; --lynx-shadow-blur: 6px; --lynx-shadow-color: rgb(0 0 0 / 16%); }
    * { box-sizing: border-box; }
    /* the sand's own boundary (2026-07-18): a 1px border so the whole widget
       reads as delimited even when the host page happens to share --bg —
       header and columns otherwise have nothing marking where the sand ends. */
    body { margin: 0; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text); font: 14px/1.3 var(--font-body); border: 0; }
    /* glued to the wall (2026-07-18): the sand's own edges carry no padding —
       the header's divider line and each column's own internal padding are
       the only whitespace left. */
    main { position: relative; height: 100%; display: grid; grid-template-rows: 1fr; gap: 0; padding: 0; }
    input, select, button, textarea { font: inherit; }
    input, select, textarea { border: 1px solid var(--control-border); border-radius: 2px; background: var(--bg); color: var(--text); padding: 3px 5px; }
    textarea { min-height: 90px; resize: vertical; }
    button { border: 1px solid var(--control-border); border-radius: 2px; background: var(--panel2); color: var(--text); padding: 3px 5px; cursor: pointer; }
    button:hover { background: var(--surface-hover); }
    button.accent { border-color: var(--accent); background: var(--accent); color: #f8fafc; }
    button:disabled { opacity: .4; cursor: default; }
    /* Sand controls stay out of the working surface until its lower-right
       corner is hovered. The corner itself carries the transport state. */
    .sand-tools { position: absolute; right: 0; bottom: 0; z-index: 35; width: 14px; height: 14px; }
    .sand-tools__row { position: absolute; right: 0; bottom: 0; display: none; align-items: center; gap: 0; padding: 2px; border: var(--hairline) solid var(--border); background: var(--bg); }
    .sand-tools:hover .sand-tools__row, .sand-tools:focus-within .sand-tools__row { display: flex; }
    .sand-tools:hover > .page-corner, .sand-tools:focus-within > .page-corner { display: none; }
    .page-corner { position: absolute; right: 0; bottom: 0; width: 10px; height: 10px; background: var(--connection-color, #fb7185); clip-path: polygon(100% 0, 100% 100%, 0 100%); }
    .page-corner.live { --connection-color: #4ade80; }
    .page-corner.busy { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .modes { display: inline-flex; border: var(--hairline) solid var(--control-border); border-radius: 2px; overflow: hidden; }
    .modes button { min-height: var(--control-height, 25px); border: 0; border-radius: 0; font-size: 13px; line-height: 1; color: var(--muted); background: var(--panel2); min-width: 25px; }
    .modes button + button { border-left: var(--hairline) solid var(--border); }
    .modes button.on { color: var(--text); background: var(--surface-hover); }
    /* K8: bulk actions float as a pill anchored to the bottom of the sand
       (position:fixed is relative to the iframe's own viewport, so it never
       leaves the kanban sand) — every control in the row is the same height. */
    .bulkbar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
               display: flex; align-items: center; gap: 6px; padding: 6px 8px;
               border: 1px solid var(--line); border-radius: 2px; background: var(--panel2);
               box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 25; font-size: 12px; }
    .bulkbar[hidden] { display: none; }
    #bulk-count { color: var(--muted); padding: 0 2px; white-space: nowrap; }
    .bulkbar select, .bulkbar button { height: 28px; box-sizing: border-box; padding: 0 10px;
                                        font-size: 12px; display: inline-flex; align-items: center; }
    .bulkbar button { justify-content: center; min-width: 28px; }
    .board { min-height: 0; overflow-x: auto; display: flex; gap: 0; align-items: stretch; }
    .no-protein-prompt { padding: 2rem 1.2rem; color: var(--muted); max-width: 32rem; }
    /* columns are flush against each other (2026-07-18: no vertical divider
       line, no gap — columns touch, and an optional column background color
       is what tells them apart when that's turned on). The only lines left
       are horizontal: under the header (.panel) and under each column's own
       name (.col-head). */
    .col { position: relative; flex: 0 0 auto; min-height: 0; display: grid; grid-template-rows: auto 1fr; }
    .col.is-collapsed { width: 34px !important; }
    .col-head { display: flex; align-items: center; gap: 4px; padding: 5px; border-bottom: 0; box-shadow: var(--lynx-shadow-x) var(--lynx-shadow-y) var(--lynx-shadow-blur) var(--lynx-shadow-color); }
    .col.is-collapsed .col-head { flex-direction: column; border-bottom: 0; padding: 9px 4px; }
    .col.is-collapsed .col-head h2 { writing-mode: vertical-rl; }
    .col-title { display: inline-flex; align-items: center; gap: 3px; min-width: 0; }
    .col h2 { margin: 0; font-size: 12px; }
    .count { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; }
    .col-add, .col-controls { display: none; }
    .col-head:hover .col-add, .col-head:focus-within .col-add, .col-head:hover .col-controls, .col-head:focus-within .col-controls { display: inline-flex; }
    .col-controls { align-items: center; gap: 3px; margin-left: auto; }
    .col-add { width: 15px; min-width: 15px; min-height: 15px; padding: 0; border: 0; color: var(--muted); background: transparent; line-height: 1; }
    .col-add:hover { color: var(--text); background: var(--surface-hover); }
    .lane-toggle { border: 0; background: none; color: var(--muted); padding: 0 3px; font-size: 11px; }
    .lane-toggle:hover { color: var(--text); }
    .lane-handle { position: absolute; top: 0; right: -4px; width: 8px; height: 100%; cursor: col-resize; }
    .cards { min-height: 80px; overflow: auto; padding: 0; }
    .col.is-collapsed .cards { display: none; }
    /* WebKitGTK (the desktop shell) renders classic, always-reserved
       scrollbars — an opaque gray track shows even when there's nothing to
       scroll, reading as a stray dark line down the right edge of whichever
       column happens to sit at the sand's own edge. Transparent track +
       thin thumb makes it disappear until it's actually needed. */
    .cards::-webkit-scrollbar { width: 8px; }
    .cards::-webkit-scrollbar-track { background: transparent; }
    .cards::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }
    .cards.dragover { outline: 2px solid rgba(122,162,247,.5); outline-offset: -4px; }
    .card { position: relative; border: 0; border-radius: 0; background: var(--bg); padding: 5px; margin-bottom: 0; cursor: grab; box-shadow: var(--lynx-shadow-x) var(--lynx-shadow-y) var(--lynx-shadow-blur) var(--lynx-shadow-color); }
    .card:hover { background: var(--surface-hover); }
    .card:active { cursor: grabbing; }
    .card.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
    .card-top { display: flex; align-items: baseline; gap: 6px; }
    .card-title { font-weight: 650; word-break: break-word; flex: 1; }
    .parent-ctx { font-size: 10px; color: var(--muted); margin-bottom: 2px; }
    .assignee-chip { border: var(--hairline) solid currentColor; border-radius: 2px; background: transparent;
                     color: var(--accent); font-size: 10px; padding: 0 6px; }
    /* compact and full share the SAME font-size/line-height (2026-07-18):
       compact's only distinguishing behavior is the JS line-window
       truncation (visibleBodyLines) — a size difference here made even a
       one-word body look "bigger" in full mode, which read as a bug, not a
       density choice. */
    .card-body { margin-top: 5px; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
    .card-body .md-todo input { accent-color: var(--accent); }
    .card-body.empty-body { color: #444c56; font-style: italic; cursor: text; }
    /* editing (2026-07-17): no boxed sub-widget — the textarea blends into the
       card so clicking the body feels like it just grew a cursor, not like a
       different UI opened. Height tracks content (see the JS `resize()`). */
    .card-body.editing { padding: 0; }
    .card-body.editing textarea {
      display: block; width: 100%; border: none; background: transparent; padding: 0; margin: 0;
      color: var(--muted); font: inherit; line-height: 1.4; resize: none; outline: none;
      box-shadow: none; overflow: hidden; caret-color: var(--accent);
    }
    .card-meta { margin-top: 7px; color: var(--muted); font-size: 11px; display: flex; gap: 8px; }
    .concept-chip { color: var(--accent); }
    /* card-actions overlays the top-right corner on hover only (2026-07-18):
       the checkbox and the three per-card mode icons sit side by side in one
       row, above the title/body content (z-index), so they never overlap it. */
    .card-actions { position: absolute; top: 0; right: 0; display: none; align-items: center; gap: 4px; z-index: 5; background: var(--bg); }
    .card:hover .card-actions, .card:focus-within .card-actions, .card.selected .card-actions { display: inline-flex; }
    .card-actions .lynx-check, .col-head .lynx-check { gap: 0; }
    .card-actions .lynx-check input, .col-head .lynx-check input { cursor: pointer; }
    .mode-cycle { border: 0; background: none; color: var(--muted); font-size: 10px; padding: 1px 4px; cursor: pointer; border-radius: 2px; }
    .mode-cycle:hover { color: var(--text); background: var(--panel2); }
    .mode-cycle.overridden { color: var(--accent); }
    .mode-mini { border: 0; background: none; color: var(--muted); font-size: 10px; padding: 1px 3px; cursor: pointer; border-radius: 2px; line-height: 1; }
    .mode-mini:hover { color: var(--text); background: var(--panel2); }
    .mode-mini.on { color: var(--accent); }
    .sheet-overlay { position: fixed; inset: 0; display: none; z-index: 30; }
    .sheet-overlay.open { display: block; }
    .sheet-backdrop { position: absolute; inset: 0; border: 0; border-radius: 0; background: rgba(4,8,14,.6); cursor: default; }
    .sheet-panel { position: absolute; top: 0; right: 0; height: 100%; width: min(430px, 92vw); overflow: auto; background: var(--panel); border-left: 1px solid #a7b4c2; padding: 6px; display: grid; gap: 6px; align-content: start; }
    /* the bulk-delete confirmation is a small centered dialog, not a right-side drawer */
    #sheet-confirm .sheet-panel { position: absolute; top: 50%; left: 50%; right: auto; height: auto;
      width: min(360px, 90vw); transform: translate(-50%, -50%); border-left: none;
      border: 1px solid var(--line); border-radius: 2px; }
    button.danger { border-color: #7d2b2b; background: #3a1f1f; color: #ffb4b4; }
    button.danger:hover { border-color: #a33a3a; }
    .sheet-head { display: flex; align-items: baseline; gap: 8px; }
    .sheet-head h2 { margin: 0; font-size: 14px; flex: 1; }
    .sheet-sub { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
    .field-block { display: grid; gap: 5px; }
    .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .sheet-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .sheet-actions.start { justify-content: flex-start; align-items: center; }
    .col-row { display: flex; gap: 6px; align-items: center; }
    .col-row .col-label { flex: 1; min-width: 0; padding: 5px 8px; }
    .col-row .col-value { width: 86px; padding: 5px 8px; }
    .col-row .col-color { width: 34px; height: 30px; padding: 2px; flex: 0 0 auto; }
    .col-row .col-err { border-color: #f85149; }
    .icon-btn { padding: 4px 7px; font-size: 11px; }
    .preset-row { display: flex; align-items: center; gap: 8px; }
    .preset-row .preset-name { flex: 1; word-break: break-word; }
    .hint { font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="kanban-sand">
    <section id="columns" class="board" aria-label="Kanban columns"></section>
    <div class="sand-tools" data-lynx-tooltip-boundary>
      <span id="connection-corner" class="page-corner" role="status" aria-label="Reconnecting" data-lynx-tooltip="Reconnecting"></span>
      <div class="sand-tools__row">
        <span id="all-modes" class="modes" title="Body view for every card (per-column and per-card buttons override)">
          <button type="button" data-mode="head" data-lynx-tooltip="Title only">▁</button>
          <button type="button" data-mode="compact" data-lynx-tooltip="Compact body">▄</button>
          <button type="button" data-mode="full" data-lynx-tooltip="Full body">█</button>
        </span>
        <button id="open-columns" class="lynx-button" type="button" data-lynx-tooltip="Configure columns and presets">Columns</button>
      </div>
    </div>
  </main>

  <div id="bulk-bar" class="bulkbar" hidden>
    <span id="bulk-count"></span>
    <select id="bulk-lane" class="lynx-select" title="Bulk-move the selected cards into this column"></select>
    <button id="bulk-move" class="lynx-button" type="button" data-lynx-tooltip="Move selected cards here">→</button>
    <button id="bulk-delete" class="lynx-button danger" type="button" data-lynx-tooltip="Delete selected cards">⌫</button>
    <button id="bulk-clear" class="lynx-button" type="button" data-lynx-tooltip="Clear selection">✕</button>
  </div>

  <div class="sheet-overlay" id="sheet-columns">
    <button class="sheet-backdrop" type="button" data-close="sheet-columns"></button>
    <div class="sheet-panel">
      <div class="sheet-head"><h2>Columns</h2><button type="button" data-close="sheet-columns">Close</button></div>
      <p class="sheet-sub" title="Done is quantity 1 — you only need to know if you want to change it.">Columns bucket cards by <b>quantity</b>: a value (<code>1</code>), a range (<code>3..10</code> — moving a card in writes the range's first value), or a concept (<code>@food</code> — moving writes <code>set-concept</code>). Done is quantity 1; you only need to know that if you want to change it. The checkbox hides a column.</p>
      <div id="columns-list" class="field-block"></div>
      <div class="sheet-actions start">
        <button id="column-add" type="button">+ Add column</button>
        <label class="lynx-check hint"><input type="checkbox" id="hide-empty" /> Hide empty columns</label>
        <label class="lynx-check hint" title="Board option: the old showParentContext"><input type="checkbox" id="show-parent" /> Parent above titles</label>
        <label class="lynx-check hint" title="Tints each column's whole background with its color, instead of no color at all"><input type="checkbox" id="color-columns" /> Color columns</label>
      </div>
      <div class="sheet-actions">
        <button id="columns-reset" type="button" title="Back to the default Backlog/Next/WIP/Review/Done">Reset</button>
        <button id="columns-save" type="button" class="accent">Save columns</button>
      </div>
      <div class="field-block">
        <span class="field-label">Presets</span>
        <div id="preset-list" class="field-block"></div>
        <div class="sheet-actions start">
          <input id="preset-name" type="text" placeholder="Preset name" />
          <button id="preset-save" type="button" title="Saves the board's current columns as a sand-configuration record (kind sand, extension kanban.columns) — visible to every kanban on this cell">Save current as preset</button>
        </div>
      </div>
    </div>
  </div>

  <div class="sheet-overlay" id="sheet-confirm">
    <button class="sheet-backdrop" type="button" data-close="sheet-confirm"></button>
    <div class="sheet-panel">
      <div class="sheet-head"><h2 id="confirm-title">Delete?</h2></div>
      <p class="sheet-sub" id="confirm-desc"></p>
      <div class="sheet-actions">
        <button id="confirm-cancel" type="button" data-close="sheet-confirm">Cancel</button>
        <button id="confirm-ok" type="button" class="danger">Delete</button>
      </div>
    </div>
  </div>

  <script>
    const H = window.LinceWidgetHost;
    const $ = (id) => document.getElementById(id);
    const columnsEl = $("columns");

    // ---- lanes (the column system, K3) --------------------------------------
    // A column is {key,label} plus HOW it buckets: a quantity `value` (with an
    // optional `to` making it a RANGE — moving a card in writes the
    // representative `value`), or a `concept` name/uid (moving writes
    // `set-concept`). cardState.kanban.lanesDef overrides the defaults; the
    // Columns sheet edits it; presets swap it in one tap.
    const DEFAULT_LANES = [
      { key: "backlog", label: "Backlog", value: 0, color: "#6e7681" },
      { key: "next", label: "Next", value: -1, color: "#7aa2f7" },
      { key: "wip", label: "WIP", value: -2, color: "#d29922" },
      { key: "review", label: "Review", value: -3, color: "#bc8cff" },
      { key: "done", label: "Done", value: 1, color: "#3fb950" },
    ];
    let lanes = DEFAULT_LANES;
    let conceptNames = {}; // uid -> canonical name (rows carry concept UIDs)
    const DEFAULT_WIDTH = 260;
    const clampWidth = (v) => Math.max(120, Math.min(560, Number(v) || DEFAULT_WIDTH));

    const HEX_COLOR_RE = /^#[0-9a-f]{6}$/i;
    function normalizeLanesDef(raw) {
      if (!Array.isArray(raw)) return null;
      const out = [];
      for (const l of raw) {
        if (!l || !l.key) continue;
        const lane = { key: String(l.key), label: String(l.label || l.key) };
        if (typeof l.concept === "string" && l.concept.trim()) {
          lane.concept = l.concept.trim();
        } else if (Number.isFinite(Number(l.value))) {
          lane.value = Number(l.value);
          if (l.to !== undefined && Number.isFinite(Number(l.to)) && Number(l.to) >= lane.value) lane.to = Number(l.to);
        } else continue;
        if (typeof l.color === "string" && HEX_COLOR_RE.test(l.color)) lane.color = l.color;
        out.push(lane);
      }
      return out.length ? out : null;
    }
    // Low-alpha tint so the column color reads as background wash, not a
    // block of fully-saturated color under the card text (2026-07-18: the
    // per-card left-color bar moved here, to the whole column, on toggle).
    function hexToRgba(hex, alpha) {
      const m = HEX_COLOR_RE.exec(hex || "");
      if (!m) return null;
      const n = parseInt(hex.slice(1), 16);
      const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }
    function conceptMatchesLane(rowConcept, lane) {
      if (!rowConcept) return false;
      return rowConcept === lane.concept || conceptNames[rowConcept] === lane.concept;
    }
    function laneBuckets(row, lane) {
      const q = Number(row.quantity) || 0;
      if (lane.concept) return conceptMatchesLane(row.concept, lane);
      if (lane.to !== undefined) return q >= lane.value && q <= lane.to;
      return q === lane.value;
    }
    function laneFor(row) {
      for (const lane of lanes) if (laneBuckets(row, lane)) return lane.key;
      const q = Number(row.quantity) || 0;
      if (q > 0) { const pos = lanes.filter((l) => l.value > 0); if (pos.length) return pos[pos.length - 1].key; }
      return (lanes.find((l) => l.value !== undefined) || lanes[0]).key;
    }
    const laneByKey = (key) => lanes.find((l) => l.key === key);
    function conceptLabel(uid) {
      return conceptNames[uid] || String(uid).slice(0, 8);
    }
    function conceptUidFor(name) {
      for (const [uid, n] of Object.entries(conceptNames)) if (n === name || uid === name) return uid;
      return name;
    }

    // ---- UI state (host state: cardState.kanban; localStorage fallback) ----
    const BODY_MODES = ["head", "compact", "full"];
    const COMPACT_LINES = 6;
    const uiStorageKey = `lince-kanban-ui:${H.instanceId || "preview"}`;
    let ui = defaultUi();
    function defaultUi() {
      return { defaultBodyMode: "full", columnModes: {}, cardModes: {}, lanes: {}, lanesDef: null, hideEmpty: false, showParent: false, columnColor: false };
    }
    const isBodyMode = (v) => BODY_MODES.includes(v);
    function normalizeUi(raw) {
      const next = defaultUi();
      if (raw && typeof raw === "object") {
        if (isBodyMode(raw.defaultBodyMode)) next.defaultBodyMode = raw.defaultBodyMode;
        for (const [k, v] of Object.entries(raw.columnModes || {})) if (isBodyMode(v)) next.columnModes[k] = v;
        for (const [k, v] of Object.entries(raw.cardModes || {})) if (isBodyMode(v)) next.cardModes[k] = v;
        for (const [k, v] of Object.entries(raw.lanes || {})) {
          if (v && typeof v === "object") next.lanes[k] = { collapsed: Boolean(v.collapsed), width: clampWidth(v.width), hidden: Boolean(v.hidden) };
        }
        next.lanesDef = normalizeLanesDef(raw.lanesDef);
        next.hideEmpty = Boolean(raw.hideEmpty);
        next.showParent = Boolean(raw.showParent);
        next.columnColor = Boolean(raw.columnColor);
      }
      return next;
    }
    function syncLanes() { lanes = ui.lanesDef || DEFAULT_LANES; }
    try { ui = normalizeUi(JSON.parse(localStorage.getItem(uiStorageKey) || "null")); } catch {}
    syncLanes();
    function persistUi() {
      try { localStorage.setItem(uiStorageKey, JSON.stringify(ui)); } catch {}
      if (typeof H.patchCardState === "function") H.patchCardState({ kanban: ui });
      syncLanes();
      render();
    }

    // ---- rows + multi-select -------------------------------------------------
    let rows = [];
    let rowsByUid = {};
    const selected = new Set(); // uids picked for bulk move
    // uid -> {key, node}: the rendered body content (markdown incl. any
    // `<img>`), reused across renders when unchanged (2026-07-18). `render()`
    // tears down and rebuilds every column/card from scratch on ANY board
    // change (a column-resize release, another card moving lanes, a mode
    // toggle...); recreating an <img> node forces a re-decode even on a cache
    // hit, which reads as a visible flicker — reported as "release the drag
    // and the image flickers" for a card that wasn't even the one dragged.
    // Keying on (mode, body) and reusing the SAME node (appendChild moves an
    // already-attached node rather than recreating it) fixes that generally,
    // for every render trigger, not just drag release specifically.
    const bodyContentCache = new Map();
    function acceptRows(next) {
      rows = next;
      rowsByUid = {};
      for (const r of rows) rowsByUid[r.uid] = r;
      const uids = new Set(rows.map((r) => r.uid));
      for (const uid of [...selected]) if (!uids.has(uid)) selected.delete(uid);
      for (const uid of [...bodyContentCache.keys()]) if (!uids.has(uid)) bodyContentCache.delete(uid);
      render();
    }

    // ---- transport state in the focused Sand corner --------------------------
    let liveNow = false;
    let pendingActs = 0;
    function syncDot() {
      const corner = $("connection-corner");
      const state = !liveNow ? "Reconnecting" : pendingActs > 0 ? "Saving…" : "Connected";
      corner.classList.toggle("busy", pendingActs > 0);
      corner.classList.toggle("live", liveNow);
      corner.setAttribute("aria-label", state);
      corner.dataset.lynxTooltip = state;
    }
    function act(action) {
      pendingActs++; syncDot();
      return H.act(action).finally(() => { pendingActs--; syncDot(); });
    }

    // People names for assignee badges (persons are not in the plain-record
    // driving rows).
    let personNames = {};
    H.subscribeProtein("kanban-people", {
      source: "record", where: [{ kind_eq: "person" }],
    }, ({ rows: incoming }) => {
      personNames = {};
      for (const p of incoming || []) if (p && p.uid) personNames[p.uid] = p.head || p.slug || p.uid;
      render();
    });
    const linksOf = (row, kind) => (Array.isArray(row.links) ? row.links : [])
      .filter((l) => l.kind === kind && l.direction === "out" && l.hop === 1);

    // ---- driving Protein (Data panel: savedProtein / inline / NONE) --------
    // Links ride along so cards can badge assignee + parent (K4/K5): sands are
    // tolerant-ignore, so a custom Protein without the include just means no
    // badges. No automatic fallback (2026-07-18): a Cell with a lot of
    // records would otherwise dump ALL of them onto a freshly-added board by
    // default. A brand new kanban card subscribes to NOTHING until the user
    // opens the Data panel (edit mode) and picks a Protein — `render()` shows
    // a prompt instead of a board in that state.
    let driver = null;
    let unsubscribe = null;
    function pickDriver(cardState) {
      const saved = typeof cardState?.savedProtein === "string" ? cardState.savedProtein.trim() : "";
      if (saved) return { kind: "saved", name: saved };
      if (cardState?.protein && typeof cardState.protein === "object") return { kind: "inline", protein: cardState.protein };
      return { kind: "none" };
    }
    function resubscribe(cardState) {
      const next = pickDriver(cardState);
      if (driver && JSON.stringify(next) === JSON.stringify(driver)) return;
      driver = next;
      if (typeof unsubscribe === "function") unsubscribe();
      unsubscribe = null;
      if (next.kind === "none") {
        acceptRows([]); // clears rows + re-renders the "pick a Protein" prompt
        return;
      }
      const onRows = ({ rows: incoming }) => acceptRows(Array.isArray(incoming) ? incoming : []);
      unsubscribe = next.kind === "saved"
        ? H.subscribeSaved("kanban", next.name, onRows)
        : H.subscribeProtein("kanban", next.protein, onRows);
    }

    if (typeof H.onCardState === "function") {
      H.onCardState((state) => {
        if (state?.kanban && typeof state.kanban === "object") {
          ui = normalizeUi(state.kanban);
          syncLanes();
        }
        resubscribe(state);
        render();
      });
    }
    resubscribe(null); // covers preview/selftest runs with no board card state

    // ---- side subscriptions: concept names + column presets ------------------
    // Rows carry concept UIDs; resolve display NAMES from the Lingua source.
    H.subscribeProtein("kanban-concepts", { source: "concept" }, ({ rows: incoming }) => {
      conceptNames = {};
      for (const c of incoming || []) if (c && c.uid) conceptNames[c.uid] = c.name;
      render();
    });
    // Column presets are sand-configuration RECORDS (kind `sand`, extension
    // namespace `kanban.columns` holding {columns:[...]}) — full CRUD from the
    // Columns sheet, shared by every kanban instance on the cell, "deleted" by
    // deactivation like everything else.
    const PRESET_NAMESPACE = "kanban.columns";
    let presetRecords = [];
    H.subscribeProtein("kanban-presets", {
      source: "record",
      where: [{ kind_eq: "sand" }, { quantity_gt: 0 }],
      include: { extension: { namespace: PRESET_NAMESPACE } },
    }, ({ rows: incoming }) => {
      presetRecords = (incoming || []).filter((r) => r?.extension && Array.isArray(r.extension.columns));
      renderPresetList();
    });

    // ---- header: live dot (green live / amber in-flight / red reconnecting) --
    H.onLive((live) => {
      liveNow = !!live;
      syncDot();
    });

    // ---- body view modes (K1) ----------------------------------------------
    const modeFor = (row, laneKey) => ui.cardModes[row.uid] || ui.columnModes[laneKey] || ui.defaultBodyMode;
    // head -> compact -> full -> head, wrapping forever (2026-07-17: it used to
    // clear back to "auto" after full, which looked like a dead click whenever
    // the board default was also full — a real cycle always lands on head next).
    function nextMode(current) {
      if (!current) return BODY_MODES[0];
      const at = BODY_MODES.indexOf(current);
      return BODY_MODES[(at + 1) % BODY_MODES.length];
    }
    const MODE_ICON = { head: "▁", compact: "▄", full: "█" };
    $("all-modes").addEventListener("click", (e) => {
      const mode = e.target?.dataset?.mode;
      if (!isBodyMode(mode)) return;
      // "All X" is total: it sets the board default AND clears every override.
      ui.defaultBodyMode = mode;
      ui.columnModes = {};
      ui.cardModes = {};
      persistUi();
    });
    function modeCycleButton(kind, key, current, inherited) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = current ? "mode-cycle overridden" : "mode-cycle";
      btn.dataset[kind] = key;
      const displayed = current || inherited;
      btn.textContent = MODE_ICON[displayed];
      btn.title = (kind === "columnMode"
        ? "Body view for this column (overrides the board default)"
        : "Body view for this card (overrides column and board)")
        + ` — now ${displayed}${current ? "" : " (inherited)"}`;
      return btn;
    }

    // ---- creation: delegated to the pinned Record sand -------------------------
    function createInLane(lane) {
      H.emit("recordCreate", { record: { kind: "plain", quantity: lane.value ?? 0 } });
    }

    // ---- sheets ---------------------------------------------------------------
    function openSheet(id) { $(id).classList.add("open"); }
    function closeSheet(id) { $(id).classList.remove("open"); }
    document.addEventListener("click", (e) => {
      const target = e.target?.dataset?.close;
      if (!target) return;
      closeSheet(target);
      if (target === "sheet-confirm" && confirmResolve) { confirmResolve(false); confirmResolve = null; }
    });

    // ---- confirm dialog (base app modal convention: title + description +
    // Cancel/OK) — kanban has no host-modal bridge, so this is built in-sand
    // on the same sheet-overlay used by the Columns drawer.
    let confirmResolve = null;
    function confirmDialog({ title, description, confirmLabel }) {
      $("confirm-title").textContent = title || "Are you sure?";
      $("confirm-desc").textContent = description || "";
      $("confirm-ok").textContent = confirmLabel || "OK";
      openSheet("sheet-confirm");
      return new Promise((resolve) => { confirmResolve = resolve; });
    }
    $("confirm-ok").addEventListener("click", () => {
      closeSheet("sheet-confirm");
      if (confirmResolve) { confirmResolve(true); confirmResolve = null; }
    });

    // ---- card bodies: shared blocks + IN-PLACE editing (K2 close, 2026-07-17)
    // Bodies render through /board/editor.js's renderMarkdown — headings,
    // REAL checkboxes, `![](...)` images (http(s):// URLs render directly;
    // local images come ONLY from the editor's "/image" block, which picks a
    // file, uploads it via `POST /host/media` — sniffed, opaquely named,
    // never an arbitrary disk path — and inserts `![](/host/media/<name>)`),
    // @slug chips that hop to Record. Clicking the TITLE opens Record
    // (`recordClicked`); clicking the BODY (in a body-showing mode) edits it
    // RIGHT THERE — a textarea with the slash palette; Ctrl+Enter or blur
    // saves (`edit-record-text`, optimistic), Escape cancels. Board record
    // writes are: checkbox toggles, column moves, body edits.
    const Editor = window.LinceBodyEditor || null;
    const CHECKBOX_RE = /^(\s*)- \[( |x|X)\] (.*)$/;
    function toggleCheckbox(row, lineAt) {
      const lines = String(row.body || "").split("\n");
      const m = (lines[lineAt] || "").match(CHECKBOX_RE);
      if (!m) return;
      lines[lineAt] = `${m[1]}- [${m[2] === " " ? "x" : " "}] ${m[3]}`;
      const previous = row.body;
      row.body = lines.join("\n");
      render();
      act({ action: "edit-record-text", target: row.uid, head: row.head || "", body: row.body }).catch((err) => {
        console.warn(err);
        row.body = previous;
        render();
      });
    }
    // Which lines a mode shows: full = the raw body; compact = the body with
    // blank edges dropped, capped at COMPACT_LINES (+ "..." when truncated).
    // Indexes stay ORIGINAL so a toggle edits the real line.
    function visibleBodyLines(row, mode) {
      const lines = String(row.body || "").split("\n");
      if (mode !== "compact") return { lines, start: 0, end: lines.length, truncated: false };
      let start = 0;
      let last = lines.length;
      while (start < last && !lines[start].trim()) start++;
      while (last > start && !lines[last - 1].trim()) last--;
      const end = Math.min(last, start + COMPACT_LINES);
      return { lines, start, end, truncated: end < last };
    }
    const editorNames = () => rows.map((r) => ({ uid: r.uid, slug: r.slug, head: r.head }))
      .concat(Object.entries(personNames).map(([uid, head]) => ({ uid, slug: null, head })));
    function refResolver(token) {
      const hit = rows.find((r) => r.slug === token || r.uid === token);
      return hit ? { uid: hit.uid, label: token } : null;
    }

    let bodyEdit = null; // { uid, draft, caret, detach }
    function closeBodyEdit() {
      if (bodyEdit && typeof bodyEdit.detach === "function") bodyEdit.detach();
      bodyEdit = null;
    }
    function openBodyEdit(row) {
      if (bodyEdit && bodyEdit.uid === row.uid) return;
      closeBodyEdit();
      bodyEdit = { uid: row.uid, draft: String(row.body || ""), caret: null, detach: null };
      render();
    }
    function commitBodyEdit(row) {
      const draft = bodyEdit ? bodyEdit.draft : null;
      closeBodyEdit();
      if (draft === null || draft === (row.body || "")) { render(); return; }
      const previous = row.body;
      row.body = draft;
      render();
      act({ action: "edit-record-text", target: row.uid, head: row.head || "", body: draft }).catch((err) => {
        console.warn(err);
        row.body = previous;
        render();
      });
    }
    const paletteOpen = () => {
      const pal = document.querySelector(".lince-editor-palette");
      return !!pal && pal.style.display === "block";
    };
    function bodyEditNode(row) {
      const holder = document.createElement("div");
      holder.className = "card-body editing";
      const area = document.createElement("textarea");
      area.value = bodyEdit.draft;
      area.rows = 1;
      // grows with content — no fixed box, so typing feels like the card body
      // just gained a cursor rather than swapping to a different widget
      const resize = () => { area.style.height = "auto"; area.style.height = `${area.scrollHeight}px`; };
      area.addEventListener("input", () => {
        bodyEdit.draft = area.value;
        bodyEdit.caret = [area.selectionStart, area.selectionEnd];
        resize();
      });
      area.addEventListener("click", (e) => e.stopPropagation());
      area.addEventListener("keydown", (e) => {
        e.stopPropagation(); // card drag/select shortcuts stay out
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); commitBodyEdit(row); }
        else if (e.key === "Escape" && !paletteOpen()) { closeBodyEdit(); render(); }
      });
      // blur saves — but not when focus just moved into the slash palette
      area.addEventListener("blur", () => {
        setTimeout(() => {
          if (bodyEdit && bodyEdit.uid === row.uid && document.activeElement !== area) commitBodyEdit(row);
        }, 150);
      });
      if (Editor) bodyEdit.detach = Editor.attach(area, { getNames: editorNames }).detach;
      holder.appendChild(area);
      setTimeout(() => {
        area.focus();
        resize();
        if (bodyEdit && bodyEdit.caret) {
          area.selectionStart = bodyEdit.caret[0];
          area.selectionEnd = bodyEdit.caret[1];
        }
      }, 0);
      return holder;
    }
    function cardBodyNode(row, mode) {
      if (bodyEdit && bodyEdit.uid === row.uid) return bodyEditNode(row);
      const cacheKey = `${mode}::${row.body || ""}`;
      const cached = bodyContentCache.get(row.uid);
      if (cached && cached.key === cacheKey) return cached.node;
      const el = document.createElement("div");
      el.className = mode === "compact" ? "card-body compact" : "card-body";
      if (!String(row.body || "").trim()) {
        el.classList.add("empty-body");
        el.textContent = "add body…";
      } else if (Editor) {
        const { start, end, truncated } = visibleBodyLines(row, mode);
        el.appendChild(Editor.renderMarkdown(row.body, {
          lines: [start, end],
          resolveRef: refResolver,
          // resolve the row FRESH by uid, not the closed-over `row` param —
          // this node may be reused (from cache) across a later render where
          // a NEW row object came off the wire for the same uid
          onNavigate: (uid) => H.emit("recordClicked", { record: { uid } }),
          onToggle: (lineAt) => toggleCheckbox(rowsByUid[row.uid] || row, lineAt),
        }));
        if (truncated) el.appendChild(document.createTextNode("\n..."));
      } else {
        // editor.js unavailable: plain text, still windowed
        const { lines, start, end, truncated } = visibleBodyLines(row, mode);
        el.textContent = lines.slice(start, end).join("\n") + (truncated ? "\n..." : "");
      }
      for (const checkbox of el.querySelectorAll('input[type="checkbox"]')) checkbox.classList.add("lynx-check__input");
      el.addEventListener("click", (event) => {
        if (event.ctrlKey || event.metaKey) return; // bubbles to card multi-select
        if (event.target.closest("input,button,img")) return; // toggles/chips/images keep their jobs
        event.stopPropagation();
        openBodyEdit(rowsByUid[row.uid] || row);
      });
      bodyContentCache.set(row.uid, { key: cacheKey, node: el });
      return el;
    }

    // ---- Columns sheet: column CRUD + presets (K3) ---------------------------
    let draftLanes = null; // working copy while the sheet is open
    const BUILTIN_PRESETS = [
      { name: "Todo / WIP / Done", columns: [
        { key: "todo", label: "Todo", value: 0, color: "#6e7681" },
        { key: "wip", label: "WIP", value: -1, color: "#d29922" },
        { key: "done", label: "Done", value: 1, color: "#3fb950" },
      ] },
      { name: "Backlog / Next / WIP / Finished", columns: [
        { key: "backlog", label: "Backlog", value: 0, color: "#6e7681" },
        { key: "next", label: "Next", value: -1, color: "#7aa2f7" },
        { key: "wip", label: "WIP", value: -2, color: "#d29922" },
        { key: "finished", label: "Finished", value: 1, color: "#3fb950" },
      ] },
    ];
    const laneValueText = (lane) => lane.concept ? `@${lane.concept}`
      : lane.to !== undefined ? `${lane.value}..${lane.to}` : String(lane.value);
    function parseLaneValue(text) {
      const t = String(text || "").trim();
      if (!t) return null;
      if (t.startsWith("@")) { const c = t.slice(1).trim(); return c ? { concept: c } : null; }
      const range = t.match(/^(-?\d+(?:\.\d+)?)\s*\.\.\s*(-?\d+(?:\.\d+)?)$/);
      if (range) {
        const from = Number(range[1]); const to = Number(range[2]);
        return to >= from ? { value: from, to } : null;
      }
      const n = Number(t);
      return Number.isFinite(n) ? { value: n } : null;
    }
    function freshLaneKey(label, taken) {
      const base = String(label || "column").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "column";
      let key = base; let n = 2;
      while (taken.has(key)) key = `${base}-${n++}`;
      return key;
    }
    function iconButton(text, title) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "icon-btn";
      btn.textContent = text;
      btn.title = title;
      return btn;
    }
    function snapshotDraft() {
      draftLanes = lanes.map((lane) => ({ ...lane, hidden: Boolean(ui.lanes[lane.key]?.hidden) }));
    }
    $("open-columns").addEventListener("click", () => {
      snapshotDraft();
      $("hide-empty").checked = Boolean(ui.hideEmpty);
      $("show-parent").checked = Boolean(ui.showParent);
      $("color-columns").checked = Boolean(ui.columnColor);
      renderColumnsSheet();
      openSheet("sheet-columns");
    });
    function renderColumnsSheet() {
      renderPresetList();
      if (!draftLanes) return;
      const list = $("columns-list");
      list.innerHTML = "";
      draftLanes.forEach((lane, at) => {
        const rowEl = document.createElement("div");
        rowEl.className = "col-row";
        const up = iconButton("↑", "Move up");
        up.disabled = at === 0;
        up.addEventListener("click", () => { draftLanes.splice(at - 1, 0, draftLanes.splice(at, 1)[0]); renderColumnsSheet(); });
        const down = iconButton("↓", "Move down");
        down.disabled = at === draftLanes.length - 1;
        down.addEventListener("click", () => { draftLanes.splice(at + 1, 0, draftLanes.splice(at, 1)[0]); renderColumnsSheet(); });
        const label = document.createElement("input");
        label.type = "text";
        label.className = "col-label";
        label.placeholder = "Name";
        label.value = lane.label;
        label.addEventListener("input", () => { lane.label = label.value; });
        const value = document.createElement("input");
        value.type = "text";
        value.className = "col-value";
        value.value = laneValueText(lane);
        value.title = "A quantity (1), a range (3..10), or a concept (@food)";
        value.addEventListener("input", () => {
          const parsed = parseLaneValue(value.value);
          value.classList.toggle("col-err", !parsed);
          if (parsed) {
            delete lane.value; delete lane.to; delete lane.concept;
            Object.assign(lane, parsed);
          }
        });
        const color = document.createElement("input");
        color.type = "color";
        color.className = "col-color";
        color.value = HEX_COLOR_RE.test(lane.color || "") ? lane.color : "#6e7681";
        color.title = "Column color (used when \"Color columns\" is on)";
        color.addEventListener("input", () => { lane.color = color.value; });
        const hideLabel = document.createElement("label");
        hideLabel.className = "lynx-check";
        const hide = document.createElement("input");
        hide.type = "checkbox";
        hide.checked = Boolean(lane.hidden);
        hide.title = "Hide this column";
        hide.addEventListener("change", () => { lane.hidden = hide.checked; });
        const del = iconButton("✕", "Delete column");
        del.addEventListener("click", () => { draftLanes.splice(at, 1); renderColumnsSheet(); });
        hideLabel.append(hide);
        rowEl.append(up, down, label, value, color, hideLabel, del);
        list.appendChild(rowEl);
      });
    }
    $("column-add").addEventListener("click", () => {
      if (!draftLanes) return;
      let v = 0;
      const used = new Set(draftLanes.filter((l) => l.concept === undefined).map((l) => l.value));
      while (used.has(v)) v -= 1;
      draftLanes.push({ key: "", label: "", value: v, color: "#6e7681" });
      renderColumnsSheet();
    });
    $("columns-save").addEventListener("click", () => {
      if (!draftLanes) return;
      const taken = new Set();
      const next = [];
      for (const lane of draftLanes) {
        const labelText = String(lane.label || "").trim();
        const bucket = lane.concept ? { concept: lane.concept }
          : Number.isFinite(lane.value) ? { value: lane.value, ...(lane.to !== undefined ? { to: lane.to } : {}) }
          : null;
        if (!bucket || !labelText) continue;
        const key = lane.key && !taken.has(lane.key) ? lane.key : freshLaneKey(labelText, taken);
        taken.add(key);
        next.push({ key, label: labelText, ...bucket, ...(HEX_COLOR_RE.test(lane.color || "") ? { color: lane.color } : {}) });
        ui.lanes[key] = {
          collapsed: Boolean(ui.lanes[key]?.collapsed),
          width: clampWidth(ui.lanes[key]?.width),
          hidden: Boolean(lane.hidden),
        };
      }
      if (!next.length) return;
      ui.lanesDef = next;
      ui.hideEmpty = $("hide-empty").checked;
      ui.showParent = $("show-parent").checked;
      ui.columnColor = $("color-columns").checked;
      persistUi();
      closeSheet("sheet-columns");
      draftLanes = null;
    });
    $("columns-reset").addEventListener("click", () => {
      ui.lanesDef = null; // merge-patch deletes the key: back to defaults
      ui.hideEmpty = $("hide-empty").checked;
      persistUi();
      snapshotDraft();
      renderColumnsSheet();
    });
    function renderPresetList() {
      const list = $("preset-list");
      list.innerHTML = "";
      const addRow = (name, columns, record) => {
        const rowEl = document.createElement("div");
        rowEl.className = "preset-row";
        const label = document.createElement("span");
        label.className = "preset-name";
        label.textContent = record ? name : `${name} (built-in)`;
        const apply = document.createElement("button");
        apply.type = "button";
        apply.className = "icon-btn";
        apply.dataset.applyPreset = name;
        apply.textContent = "Apply";
        apply.addEventListener("click", () => applyPreset(columns));
        rowEl.append(label, apply);
        if (record) {
          const del = iconButton("✕", "Delete preset (deactivates the record)");
          del.dataset.deletePreset = record.uid;
          del.addEventListener("click", () => {
            act({ action: "deactivate", target: record.uid }).catch((err) => console.warn(err));
          });
          rowEl.appendChild(del);
        }
        list.appendChild(rowEl);
      };
      for (const preset of BUILTIN_PRESETS) addRow(preset.name, preset.columns, null);
      for (const record of presetRecords) addRow(record.head || record.slug || record.uid, record.extension.columns, record);
    }
    function applyPreset(columns) {
      const next = normalizeLanesDef(columns);
      if (!next) return;
      ui.lanesDef = next;
      persistUi();
      if (draftLanes) { snapshotDraft(); renderColumnsSheet(); }
    }
    $("preset-save").addEventListener("click", async () => {
      const name = $("preset-name").value.trim();
      if (!name) return;
      try {
        const outcome = await act({ action: "create-record", kind: "sand", head: name, quantity: 1 });
        await act({ action: "set-extension", target: outcome.created, namespace: PRESET_NAMESPACE, fds: { columns: lanes } });
        $("preset-name").value = "";
      } catch (err) { console.warn(err); }
    });

    // ---- multi-select + bulk move / bulk delete ------------------------------
    function toggleSelect(uid) {
      if (!selected.delete(uid)) selected.add(uid);
      render();
    }
    function renderBulkBar() {
      const bar = $("bulk-bar");
      bar.hidden = !selected.size;
      if (!selected.size) return;
      $("bulk-count").textContent = `${selected.size} selected`;
      const select = $("bulk-lane");
      const previous = select.value;
      select.innerHTML = "";
      for (const lane of lanes) {
        const opt = document.createElement("option");
        opt.value = lane.key;
        opt.textContent = lane.label;
        select.appendChild(opt);
      }
      if ([...select.options].some((o) => o.value === previous)) select.value = previous;
    }
    $("bulk-move").addEventListener("click", () => {
      const key = $("bulk-lane").value;
      for (const uid of [...selected]) move(uid, key);
      selected.clear();
      render();
    });
    $("bulk-clear").addEventListener("click", () => { selected.clear(); render(); });
    // HARD delete (`delete-record`, distinct from `deactivate`): the only way
    // selected cards actually leave every board that queries them. Optimistic
    // like move()/checkbox toggles — splice locally, roll a card back on reject.
    $("bulk-delete").addEventListener("click", async () => {
      const uids = [...selected];
      if (!uids.length) return;
      const ok = await confirmDialog({
        title: uids.length === 1 ? "Delete this card?" : `Delete ${uids.length} cards?`,
        description: "This removes the card everywhere. It cannot be undone.",
        confirmLabel: "Delete",
      });
      if (!ok) return;
      const removed = rows.filter((r) => uids.includes(r.uid));
      selected.clear();
      acceptRows(rows.filter((r) => !uids.includes(r.uid)));
      for (const row of removed) {
        act({ action: "delete-record", target: row.uid }).catch((err) => {
          console.warn(err);
          acceptRows([...rows, row]);
        });
      }
    });

    // ---- board render --------------------------------------------------------
    function render() {
      columnsEl.innerHTML = "";
      if (!driver || driver.kind === "none") {
        const prompt = document.createElement("div");
        prompt.className = "no-protein-prompt";
        prompt.textContent = "No data source selected. Open this card's Data panel (edit mode) and choose a Protein to show records here.";
        columnsEl.appendChild(prompt);
        for (const btn of $("all-modes").querySelectorAll("button")) {
          btn.classList.toggle("on", btn.dataset.mode === ui.defaultBodyMode);
        }
        renderBulkBar();
        return;
      }
      for (const lane of lanes) {
        const laneUi = ui.lanes[lane.key] || {};
        if (laneUi.hidden) continue;
        const laneRows = rows.filter((row) => laneFor(row) === lane.key);
        if (ui.hideEmpty && !laneRows.length) continue;
        const col = document.createElement("section");
        col.className = laneUi.collapsed ? "col is-collapsed" : "col";
        col.style.width = `${clampWidth(laneUi.width)}px`;
        col.style.background = (ui.columnColor && hexToRgba(lane.color, 0.14)) || "";
        const head = document.createElement("div");
        head.className = "col-head";
        // K8: select the whole column at once (in addition to ctrl-click / the
        // per-card checkbox) — indeterminate when only some cards are picked.
        const selectAllLabel = document.createElement("label");
        selectAllLabel.className = "lynx-check";
        const selectAll = document.createElement("input");
        selectAll.type = "checkbox";
        selectAll.title = "Select all cards in this column";
        const laneUids = laneRows.map((r) => r.uid);
        const laneSelCount = laneUids.filter((uid) => selected.has(uid)).length;
        selectAll.checked = laneUids.length > 0 && laneSelCount === laneUids.length;
        selectAll.indeterminate = laneSelCount > 0 && laneSelCount < laneUids.length;
        selectAll.addEventListener("click", (event) => event.stopPropagation());
        selectAll.addEventListener("change", () => {
          if (selectAll.checked) laneUids.forEach((uid) => selected.add(uid));
          else laneUids.forEach((uid) => selected.delete(uid));
          render();
        });
        const titleGroup = document.createElement("div");
        titleGroup.className = "col-title";
        const title = document.createElement("h2");
        title.textContent = lane.label;
        const count = document.createElement("span");
        count.className = "count";
        count.textContent = String(laneRows.length);
        const add = document.createElement("button");
        add.type = "button";
        add.className = "col-add";
        add.textContent = "+";
        add.title = `New record in ${lane.label}`;
        add.addEventListener("click", (event) => { event.stopPropagation(); createInLane(lane); });
        titleGroup.append(title, count, add);
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "lane-toggle";
        toggle.dataset.laneToggle = lane.key;
        toggle.textContent = laneUi.collapsed ? "▸" : "▾";
        toggle.title = laneUi.collapsed ? "Expand column" : "Collapse column";
        toggle.addEventListener("click", () => {
          ui.lanes[lane.key] = { ...laneUi, collapsed: !laneUi.collapsed, width: clampWidth(laneUi.width) };
          persistUi();
        });
        const colMode = modeCycleButton("columnMode", lane.key, ui.columnModes[lane.key], ui.defaultBodyMode);
        colMode.addEventListener("click", () => {
          ui.columnModes[lane.key] = nextMode(ui.columnModes[lane.key] || ui.defaultBodyMode);
          persistUi();
        });
        selectAllLabel.append(selectAll);
        const controls = document.createElement("div");
        controls.className = "col-controls";
        controls.append(colMode, toggle, selectAllLabel);
        head.append(titleGroup, controls);
        const list = document.createElement("div");
        list.className = "cards";
        list.dataset.lane = lane.key;
        list.addEventListener("dragover", (event) => { event.preventDefault(); list.classList.add("dragover"); });
        list.addEventListener("dragleave", () => list.classList.remove("dragover"));
        list.addEventListener("drop", (event) => {
          event.preventDefault();
          list.classList.remove("dragover");
          const uid = event.dataTransfer.getData("text/lince-record");
          if (uid) move(uid, lane.key);
        });
        for (const row of laneRows) list.appendChild(card(row, lane.key));
        // Width drag (old lane resize): live while dragging, persisted on release.
        const handle = document.createElement("div");
        handle.className = "lane-handle";
        handle.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          const startX = event.clientX;
          const startWidth = clampWidth(laneUi.width);
          const onMove = (ev) => { col.style.width = `${clampWidth(startWidth + ev.clientX - startX)}px`; };
          const onUp = (ev) => {
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onUp);
            ui.lanes[lane.key] = { ...laneUi, collapsed: Boolean(laneUi.collapsed), width: clampWidth(startWidth + ev.clientX - startX) };
            persistUi();
          };
          window.addEventListener("pointermove", onMove);
          window.addEventListener("pointerup", onUp);
        });
        col.append(head, list, handle);
        columnsEl.appendChild(col);
      }
      for (const btn of $("all-modes").querySelectorAll("button")) {
        btn.classList.toggle("on", btn.dataset.mode === ui.defaultBodyMode);
      }
      renderBulkBar();
    }

    function card(row, laneKey) {
      const el = document.createElement("article");
      el.className = `card lane-${laneKey}${selected.has(row.uid) ? " selected" : ""}`;
      el.dataset.recordUid = row.uid;
      el.draggable = !(bodyEdit && bodyEdit.uid === row.uid); // typing ≠ dragging
      el.addEventListener("dragstart", (event) => {
        event.dataTransfer.setData("text/lince-record", row.uid);
      });
      // Click targets (2026-07-17): the TITLE opens Record (board-wide
      // `recordClicked`); the BODY edits in place (cardBodyNode). Ctrl/Cmd-
      // click anywhere selects for bulk operations.
      el.addEventListener("click", (event) => {
        if (event.ctrlKey || event.metaKey) toggleSelect(row.uid);
      });
      const mode = modeFor(row, laneKey);
      // parent context above the title (the old `showParentContext`, board
      // option in the Columns sheet; parent = out `part-of` link)
      if (ui.showParent) {
        const parentLink = linksOf(row, "part-of")[0];
        if (parentLink) {
          const parentRow = rowsByUid[parentLink.other];
          const ctx = document.createElement("div");
          ctx.className = "parent-ctx";
          ctx.textContent = `↑ ${parentRow ? (parentRow.head || parentRow.slug || parentLink.other)
            : personNames[parentLink.other] || String(parentLink.other).slice(0, 8)}`;
          el.appendChild(ctx);
        }
      }
      const top = document.createElement("div");
      top.className = "card-top";
      const title = document.createElement("div");
      title.className = "card-title";
      title.textContent = row.head || row.slug || row.uid;
      title.title = "Open in Record";
      title.addEventListener("click", (event) => {
        if (event.ctrlKey || event.metaKey) return; // let the card handle select
        event.stopPropagation();
        H.emit("recordClicked", {
          record: { uid: row.uid, head: row.head, slug: row.slug, body: row.body, quantity: row.quantity },
        });
      });
      // assignee badge (institute: assignee + parent are the two worth showing
      // on the big picture)
      let badge = null;
      const assigneeLink = linksOf(row, "assigned-to")[0];
      if (assigneeLink) {
        badge = document.createElement("span");
        badge.className = "assignee-chip";
        badge.textContent = personNames[assigneeLink.other] || String(assigneeLink.other).slice(0, 8);
        badge.title = "Assignee (edit in Record)";
      }
      top.append(title, ...(badge ? [badge] : []));
      el.appendChild(top);
      // body renders whenever the mode shows it — EMPTY bodies included, so
      // "click the body to start writing" always has a target
      if (mode !== "head") el.appendChild(cardBodyNode(row, mode));
      // no quantity/slug here (bug #2): the column TITLE already says what
      // column the card is on, and the slug is only useful inside Record.
      if (row.concept) {
        const meta = document.createElement("div");
        meta.className = "card-meta";
        const chip = document.createElement("span");
        chip.className = "concept-chip";
        chip.textContent = `@${conceptLabel(row.concept)}`;
        meta.appendChild(chip);
        el.appendChild(meta);
      }
      // hover-only overlay (2026-07-18): the select checkbox and the three
      // per-card mode icons sit in one row, above the card's own content
      // (z-index), so they never overlap each other — replaces the old
      // always-visible single mode-cycle button.
      const actions = document.createElement("div");
      actions.className = "card-actions";
      const activeCardMode = ui.cardModes[row.uid] || "";
      for (const m of BODY_MODES) {
        const modeBtn = document.createElement("button");
        modeBtn.type = "button";
        modeBtn.className = activeCardMode === m ? "mode-mini on" : "mode-mini";
        modeBtn.dataset.cardMode = m;
        modeBtn.textContent = MODE_ICON[m];
        modeBtn.title = `Body view for this card: ${m}${activeCardMode === m ? " (click to clear override)" : ""}`;
        modeBtn.addEventListener("click", (event) => {
          event.stopPropagation();
          if (ui.cardModes[row.uid] === m) delete ui.cardModes[row.uid];
          else ui.cardModes[row.uid] = m;
          persistUi();
        });
        actions.appendChild(modeBtn);
      }
      const selLabel = document.createElement("label");
      selLabel.className = "lynx-check";
      const sel = document.createElement("input");
      sel.type = "checkbox";
      sel.dataset.selectRecord = row.uid;
      sel.checked = selected.has(row.uid);
      sel.title = "Select for bulk-move (or Ctrl-click the card)";
      sel.addEventListener("click", (event) => event.stopPropagation());
      sel.addEventListener("change", () => toggleSelect(row.uid));
      selLabel.append(sel);
      actions.append(selLabel);
      el.appendChild(actions);
      return el;
    }

    // Optimistic move (old optimisticMoveCard/rollbackBoard, over rows instead
    // of server HTML): apply locally, write the typed Action, roll back on
    // reject. A value/range column writes its representative `value` through
    // `set-quantity`; a concept column writes `set-concept`.
    function move(uid, laneKey) {
      const row = rows.find((r) => r.uid === uid);
      const lane = laneByKey(laneKey);
      if (!row || !lane) return;
      if (laneBuckets(row, lane)) return; // already there (range keeps its exact quantity)
      if (lane.concept) {
        const previous = row.concept;
        row.concept = conceptUidFor(lane.concept);
        render();
        act({ action: "set-concept", target: uid, concept: lane.concept }).catch((err) => {
          console.warn(err);
          row.concept = previous;
          render();
        });
        return;
      }
      const previous = row.quantity;
      row.quantity = lane.value;
      render();
      act({ action: "set-quantity", target: uid, value: lane.value }).catch((err) => {
        console.warn(err);
        row.quantity = previous;
        render();
      });
    }

    render();
  </script>
</body>
</html>
