<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kanban</title>
  <script src="/board/frame.js"></script>
  <style>
    :root { color-scheme: dark; --bg: #0e1116; --panel: #151a21; --panel2: #1b222b; --line: #2b3440; --text: #e6edf3; --muted: #8b949e; --accent: #7aa2f7; --good: #3fb950; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, sans-serif; }
    main { height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 10px; padding: 12px; }
    header { display: flex; align-items: center; gap: 8px; }
    h1 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); flex: 1; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #f85149; }
    .dot.live { background: var(--good); }
    input, select, button, textarea { font: inherit; }
    input, select, textarea { border: 1px solid var(--line); border-radius: 7px; background: #0d1117; color: var(--text); padding: 7px 9px; }
    button { border: 1px solid var(--line); border-radius: 7px; background: var(--panel2); color: var(--text); padding: 7px 10px; cursor: pointer; }
    button:hover { border-color: #3c4857; }
    .columns { min-height: 0; overflow-x: auto; display: grid; grid-template-columns: repeat(5, minmax(210px, 1fr)); gap: 10px; }
    .col { min-height: 0; display: grid; grid-template-rows: auto 1fr; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .col header { padding: 9px 10px; border-bottom: 1px solid var(--line); }
    .col h2 { margin: 0; font-size: 12px; flex: 1; }
    .count { color: var(--muted); font-variant-numeric: tabular-nums; }
    .cards { min-height: 80px; overflow: auto; padding: 8px; }
    .cards.dragover { outline: 2px solid rgba(122,162,247,.5); outline-offset: -4px; }
    .card { border: 1px solid var(--line); border-radius: 8px; background: #11161d; padding: 9px; margin-bottom: 8px; cursor: grab; }
    .card:active { cursor: grabbing; }
    .card-title { font-weight: 650; word-break: break-word; }
    .card-body { margin-top: 5px; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
    .card-meta { margin-top: 7px; color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; gap: 8px; }
    form { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; }
    .empty { color: var(--muted); padding: 12px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Kanban</h1>
      <input id="search" placeholder="Filter cards..." />
      <span id="dot" class="dot"></span>
    </header>
    <section id="columns" class="columns" aria-label="Kanban columns"></section>
    <form id="new-card">
      <input id="new-head" placeholder="New task..." autocomplete="off" />
      <select id="new-lane"></select>
      <button type="submit">Add</button>
    </form>
  </main>
  <script>
    const H = window.LinceWidgetHost;
    const columnsEl = document.getElementById("columns");
    const dot = document.getElementById("dot");
    const search = document.getElementById("search");
    const newHead = document.getElementById("new-head");
    const newLane = document.getElementById("new-lane");
    const lanes = [
      { key: "backlog", label: "Backlog", value: 0 },
      { key: "next", label: "Next", value: -1 },
      { key: "wip", label: "WIP", value: -2 },
      { key: "review", label: "Review", value: -3 },
      { key: "done", label: "Done", value: 1 },
    ];
    let rows = [];

    lanes.forEach((lane) => {
      const opt = document.createElement("option");
      opt.value = String(lane.value);
      opt.textContent = lane.label;
      newLane.appendChild(opt);
    });

    H.onLive((live) => dot.classList.toggle("live", !!live));
    H.subscribeProtein("kanban", {
      source: "record",
      where: [{ kind_eq: "plain" }],
      order: [{ asc: "quantity" }, { asc: "created_at" }],
    }, ({ rows: next }) => {
      rows = Array.isArray(next) ? next : [];
      render();
    });

    search.addEventListener("input", render);

    function laneFor(quantity) {
      const q = Number(quantity) || 0;
      if (q > 0) return "done";
      return (lanes.find((lane) => lane.value === q) || lanes[0]).key;
    }

    function render() {
      const q = search.value.trim().toLowerCase();
      const visible = q
        ? rows.filter((row) => `${row.head || ""} ${row.body || ""} ${row.slug || ""}`.toLowerCase().includes(q))
        : rows;
      columnsEl.innerHTML = "";
      for (const lane of lanes) {
        const col = document.createElement("section");
        col.className = "col";
        const head = document.createElement("header");
        const title = document.createElement("h2");
        title.textContent = lane.label;
        const count = document.createElement("span");
        count.className = "count";
        const list = document.createElement("div");
        list.className = "cards";
        list.dataset.lane = lane.key;
        list.addEventListener("dragover", (event) => { event.preventDefault(); list.classList.add("dragover"); });
        list.addEventListener("dragleave", () => list.classList.remove("dragover"));
        list.addEventListener("drop", (event) => {
          event.preventDefault();
          list.classList.remove("dragover");
          const uid = event.dataTransfer.getData("text/lince-record");
          if (uid) move(uid, lane.value);
        });
        const laneRows = visible.filter((row) => laneFor(row.quantity) === lane.key);
        count.textContent = String(laneRows.length);
        head.append(title, count);
        for (const row of laneRows) list.appendChild(card(row));
        if (!laneRows.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No cards";
          list.appendChild(empty);
        }
        col.append(head, list);
        columnsEl.appendChild(col);
      }
    }

    function card(row) {
      const el = document.createElement("article");
      el.className = "card";
      el.draggable = true;
      el.addEventListener("dragstart", (event) => {
        event.dataTransfer.setData("text/lince-record", row.uid);
      });
      // Clicking a card announces it on the `recordClicked` ABI room. The
      // unified bridge fans this out, group-scoped, to the record_info sand
      // packaged in the same kanban group (Stage 8b, base task 1 + kanban B).
      el.addEventListener("click", () => {
        H.emit("recordClicked", {
          record: {
            uid: row.uid,
            head: row.head,
            slug: row.slug,
            body: row.body,
            quantity: row.quantity,
          },
        });
      });
      const title = document.createElement("div");
      title.className = "card-title";
      title.textContent = row.head || row.slug || row.uid;
      el.appendChild(title);
      if (row.body) {
        const body = document.createElement("div");
        body.className = "card-body";
        body.textContent = row.body;
        el.appendChild(body);
      }
      const meta = document.createElement("div");
      meta.className = "card-meta";
      meta.innerHTML = `<span>qty ${Number(row.quantity) || 0}</span><span>${row.slug || row.uid.slice(0, 8)}</span>`;
      el.appendChild(meta);
      return el;
    }

    function move(uid, value) {
      H.act({ action: "set-quantity", target: uid, value }).catch(console.warn);
    }

    document.getElementById("new-card").addEventListener("submit", (event) => {
      event.preventDefault();
      const head = newHead.value.trim();
      if (!head) return;
      H.act({ action: "create-record", kind: "plain", head, body: "", quantity: Number(newLane.value) || 0 })
        .then(() => { newHead.value = ""; })
        .catch(console.warn);
    });
  </script>
</body>
</html>
