<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Record</title>
  <link rel="stylesheet" href="/board/lynx-ui.css" />
  <script src="/board/frame.js"></script>
  <script src="/board/editor.js"></script>
  <style>
    /* Record IS the editing surface: the kanban board only toggles checkboxes
       and moves columns — head/body/slug/quantity, work metadata
       (dates/estimate/worklogs on the `work` record_extension), assignees
       (`assigned-to`), ALL links (A → B, any kind, wildcard links include —
       a document/URL just lives as one of these, no separate resource
       concept), a real multi-THREAD system (named threads as tabs,
       switchable, each scoping its own messages + compose box, @slug
       references) and both kinds of removal (Zero = deactivate, Delete =
       HARD delete-record) all live here. Reusable: any sand that emits
       recordClicked drives it. */
    :root { color-scheme: dark; --bg: #121214; --surface-hover: #141416; --line: #141416; --text: #f8fafc; --muted: color-mix(in srgb, #f8fafc 62%, #121214); --faint: color-mix(in srgb, #f8fafc 38%, #121214); --accent: #6366f1; --control-border: #f8fafc; --hot-border: #fb7185; --font-body: Lato, system-ui, sans-serif; --font-title: Aleo, Georgia, serif; --font-mono: "SFMono-Regular", Consolas, monospace; --hairline: .5px; --lynx-shadow-x: 2px; --lynx-shadow-y: 2px; --lynx-shadow-blur: 6px; --lynx-shadow-color: rgb(0 0 0 / 16%); }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; overflow: hidden;
           font: 14px/1.3 var(--font-body);
           background: var(--bg); color: var(--text); padding: 5px; }
    /* Icon mode shares the compact 40px shell-control frame. */
    body.collapsed { padding: 0; }
    .head { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
    .head h1 { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em;
               color: var(--muted); margin: 0; flex: 1; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .dot.live { background: var(--text); }
    .dot.busy { background: var(--muted); animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .rec { margin-bottom: 4px; overflow: hidden; }
    .rec > .t { display: flex; align-items: center; gap: .5rem;
                padding: 5px; background: var(--bg); box-shadow: var(--lynx-shadow-x) var(--lynx-shadow-y) var(--lynx-shadow-blur) var(--lynx-shadow-color); }
    .rec > .t .name { font-weight: 600; color: var(--text); flex: 1; word-break: break-word; }
    .rec > .t .q { font-variant-numeric: tabular-nums; color: var(--muted); }
    .tbtn { width: auto; border: 1px solid var(--control-border); border-radius: 2px;
            background: var(--bg); font-size: .75rem; padding: 2px 5px; cursor: pointer; }
    #btn-zero, #btn-delete { color: var(--text); }
    .fields { padding: 5px; display: grid; gap: 4px; }
    .frow { display: flex; gap: 4px; align-items: baseline; font-size: .85rem; }
    .frow .k { color: var(--muted); min-width: 4.2rem; text-transform: uppercase; font-size: .68rem; letter-spacing: .05em; }
    .frow .v { color: var(--text); white-space: pre-wrap; word-break: break-word; flex: 1; }
    .frow.edit { align-items: center; }
    details { border-top: 0; }
    details > summary { cursor: pointer; list-style: none; padding: 4px 5px;
                        font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    details > summary::before { content: "▸ "; }
    details[open] > summary::before { content: "▾ "; }
    .sec { padding: 0 5px 5px; display: grid; gap: 4px; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { display: inline-flex; align-items: center; gap: 3px; border: var(--hairline) solid currentColor;
            border-radius: 2px; padding: 2px 5px; font-size: .75rem; background: transparent; }
    .chip button { border: 0; background: none; color: var(--muted); padding: 0; cursor: pointer; font-size: .8rem; }
    .chip.nav { cursor: pointer; }
    .chip.nav:hover { border-color: var(--accent); }
    .chip.active { border-color: var(--accent); background: transparent; color: var(--accent); }
    .chip.newthread { border-style: dashed; color: var(--muted); cursor: pointer; }
    .chip.newthread:hover { border-color: var(--accent); color: var(--accent); }
    /* `.inline`'s `display:flex` otherwise beats the `hidden` attribute (same
       author-origin cascade tie the kanban board's `.bulkbar[hidden]` already
       works around) — this needs to win by specificity, not rely on order. */
    #thread-new[hidden] { display: none; }
    #thread-edit[hidden] { display: none; }
    .inline { display: flex; gap: .4rem; align-items: center; }
    .inline input, .inline select { flex: 1; min-width: 0; }
    .inline button { flex: 0 0 auto; }
    .subrow { display: flex; gap: .4rem; align-items: center; font-size: .78rem; }
    .subrow .lbl { color: var(--muted); min-width: 4.2rem; font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; }
    .subrow input { flex: 1; min-width: 0; }
    .loglist { display: grid; gap: .25rem; }
    .logrow { display: flex; gap: 4px; align-items: baseline; font-size: .75rem; color: var(--muted); }
    .logrow .span { flex: 1; }
    .logrow.open .span { color: var(--text); }
    .logrow button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 2px; }
    .logrow button:hover { color: var(--text); }
    .logrow.editing { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; align-items: end; }
    .logrow.editing input { min-width: 0; }
    .logrow.editing .log-actions { display: inline-flex; gap: 3px; }
    .worklog-new { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 4px; align-items: end; }
    .worklog-new input { min-width: 0; }
    .total { font-size: .72rem; color: var(--muted); }
    .msg { border-top: 0; padding: 4px 0; font-size: .78rem; }
    .msg-meta { font-size: .68rem; color: var(--muted); margin-bottom: 2px;
      display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
    .msg-delete { border: 0; background: none; color: var(--muted); padding: 0;
      cursor: pointer; font-size: .68rem; }
    .msg-delete:hover { color: var(--text); }
    .msg-actions { display: inline-flex; gap: 4px; margin-left: auto; }
    .msg-edit { border: 0; background: none; color: var(--muted); padding: 0;
      cursor: pointer; font-size: .68rem; }
    .msg-edit:hover { color: var(--text); }
    .message-edit { display: grid; gap: 4px; }
    .message-edit textarea { min-height: 64px; }
    .message-edit__actions { display: flex; gap: 4px; justify-content: flex-end; }
    .msg .body { white-space: pre-wrap; word-break: break-word; }
    .msg img { max-width: 100%; border-radius: 6px; margin-top: .25rem; display: block; }
    .msg .ref { display: inline-block; border: var(--hairline) solid var(--accent); border-radius: 2px;
                background: transparent; color: var(--accent); padding: 0 5px; font-size: .72rem;
                cursor: pointer; }
    ul { list-style: none; margin: 0; padding: .25rem .6rem .5rem; }
    li { display: flex; gap: 4px; align-items: baseline; padding: 2px 0;
         border-top: 0; font-size: .78rem; }
    .delta { font-variant-numeric: tabular-nums; min-width: 3.2rem; }
    .delta.pos, .delta.neg, .delta.zero { color: var(--muted); }
    .cause { color: var(--muted); flex: 1; }
    .when { color: var(--muted); }
    .none { color: var(--muted); padding: 2px 0; font-size: .78rem; }
    /* Default idle state: pinned bottom-right, collapsed to just this glyph
       until a recordClicked/recordCreate ABI event expands the card. */
    body.collapsed .head { display: none; }
    .iconview { color: var(--text); font-size: 12px; }
    .iconview:not([hidden]) {
      display: flex; align-items: center; justify-content: center; height: 100%;
    }
    /* Creation mode: the SAME fields the display shows on a get, writable and
       empty. Entered via the group's `recordCreate` event ("New task"). */
    #create { display: none; overflow: hidden; }
    #create.open { display: block; }
    #create .t { padding: 5px; background: var(--bg); font-weight: 600; color: var(--text); }
    #create .fields { border-bottom: 0; }
    input, textarea, select, button { font: inherit; }
    input, textarea, select { width: 100%; border: 1px solid var(--control-border); border-radius: 2px;
                              background: var(--bg); color: var(--text); padding: 3px 5px; }
    textarea { min-height: 70px; resize: vertical; }
    .actions { display: flex; gap: .5rem; justify-content: flex-end; padding: .45rem .6rem .6rem; }
    button { border: 1px solid var(--control-border); border-radius: 2px; background: var(--bg);
             color: var(--text); padding: 3px 5px; cursor: pointer; }
    button:hover { background: var(--surface-hover); }
    button:disabled { opacity: .4; cursor: default; }
    button.accent { border-color: var(--accent); background: var(--accent); color: #f8fafc; }
    .err { color: var(--hot-border); font-size: .75rem; padding: 0 5px 4px; }
    .hint { color: var(--muted); font-size: .72rem; }
    /* rendered body preview (K6): same blocks the board card renderer shows */
    .preview { white-space: pre-wrap; word-break: break-word; border: var(--hairline) dashed var(--muted);
               border-radius: 2px; padding: 4px 5px; font-size: .78rem; color: var(--text); }
  </style>
</head>
<body class="lynx-ui">
  <div class="head">
    <h1 id="title">Record</h1>
    <span id="dot" class="dot" title="red = reconnecting · amber = update in flight · green = live"></span>
    <button id="btn-collapse" type="button" class="lynx-button tbtn" title="Hide (Esc)">✕</button>
  </div>

  <div id="create" class="lynx-box">
    <div class="t">New record</div>
    <div class="fields">
      <div class="frow edit"><span class="k">Head</span><input id="c-head" class="lynx-input" type="text" autocomplete="off" /></div>
      <div class="frow edit"><span class="k">Slug</span><input id="c-slug" class="lynx-input" type="text" autocomplete="off" placeholder="optional.dot.case" /></div>
      <div class="frow edit"><span class="k">Quantity</span><input id="c-quantity" class="lynx-input" type="number" step="1" /></div>
      <div class="frow edit"><span class="k">Body</span><textarea id="c-body" class="lynx-textarea"></textarea></div>
    </div>
    <div id="c-error" class="err" hidden></div>
    <div class="actions">
      <button id="c-cancel" type="button" class="lynx-button">Cancel</button>
      <button id="c-submit" type="button" class="lynx-button lynx-button--primary accent">Create</button>
    </div>
  </div>

  <div id="focus" class="rec lynx-box" hidden>
    <div class="t">
      <span class="name" id="f-name"></span>
      <span class="q" id="f-qty"></span>
      <button id="btn-zero" type="button" class="lynx-button tbtn" title="Zero the quantity (deactivate) — the record stays">Zero</button>
      <button id="btn-delete" type="button" class="lynx-button tbtn" title="HARD delete — the record disappears everywhere; its Ledger history stays">Delete</button>
    </div>

    <div class="fields">
      <div class="frow edit"><span class="k">Head</span><input id="f-head" class="lynx-input" type="text" autocomplete="off" /></div>
      <div class="frow edit"><span class="k">Slug</span><input id="f-slug" class="lynx-input" type="text" autocomplete="off" placeholder="dot.case" /></div>
      <div class="frow edit"><span class="k">Quantity</span><input id="f-quantity" class="lynx-input" type="number" step="1" /></div>
      <div class="frow edit"><span class="k">Body</span><textarea id="f-body" class="lynx-textarea"></textarea></div>
      <div id="f-preview" class="preview" hidden></div>
      <div class="actions" style="padding:0">
        <span id="f-error" class="err" style="padding:0; margin-right:auto" hidden></span>
        <button id="f-save" type="button" class="lynx-button lynx-button--primary accent" disabled>Save</button>
      </div>
    </div>

    <details id="sec-work" class="lynx-disclosure" open>
      <summary>Work</summary>
      <div class="sec">
        <div class="subrow"><span class="lbl">Start</span><input id="w-start" class="lynx-input" type="date" /></div>
        <div class="subrow"><span class="lbl">Due</span><input id="w-due" class="lynx-input" type="date" /></div>
        <div class="subrow"><span class="lbl">Estimate</span><input id="w-estimate" class="lynx-input" type="number" min="0" step="5" placeholder="minutes" /></div>
        <div class="inline">
          <button id="w-play" type="button" class="lynx-button lynx-button--primary accent">▶ Play</button>
          <button id="w-pause" type="button" class="lynx-button">⏸ Pause</button>
          <span id="w-total" class="total"></span>
        </div>
        <div id="worklog-list" class="loglist"></div>
        <div class="worklog-new">
          <input id="w-log-start" class="lynx-input" type="datetime-local" aria-label="Work log start" />
          <input id="w-log-end" class="lynx-input" type="datetime-local" aria-label="Work log end" />
          <button id="w-log-add" type="button" class="lynx-button">Add log</button>
        </div>
        <span id="w-log-error" class="err" hidden></span>
      </div>
    </details>

    <details id="sec-people" class="lynx-disclosure" open>
      <summary>Assignees</summary>
      <div class="sec">
        <div id="assignee-list" class="chips"></div>
        <div class="inline">
          <select id="a-pick" class="lynx-select"></select>
          <button id="a-add" type="button" class="lynx-button">Assign</button>
        </div>
      </div>
    </details>

    <details id="sec-links" class="lynx-disclosure" open>
      <summary>Links</summary>
      <div class="sec">
        <div id="links-list" class="loglist"></div>
        <div class="inline">
          <input id="l-kind" class="lynx-input" type="text" list="l-kind-suggestions" placeholder="kind (e.g. before)" autocomplete="off" />
          <datalist id="l-kind-suggestions"></datalist>
          <input id="l-target" class="lynx-input" type="text" list="l-target-suggestions" placeholder="target slug or uid" autocomplete="off" />
          <datalist id="l-target-suggestions"></datalist>
          <button id="l-add" type="button" class="lynx-button" title="This record links to the target (A → B)">Link</button>
        </div>
        <div class="hint">A → B means A links to B. Click a record to open it; ✕ removes the link.</div>
      </div>
    </details>

    <details id="sec-comments" class="lynx-disclosure" open>
      <summary>Threads</summary>
      <div class="sec">
        <input id="thread-search" class="lynx-input" type="text" placeholder="Search threads…" autocomplete="off" />
        <div id="thread-tabs" class="chips"></div>
        <div id="thread-new" class="inline" hidden>
          <input id="th-name" class="lynx-input" type="text" placeholder="Thread name" autocomplete="off" />
          <button id="th-create" type="button" class="lynx-button lynx-button--primary accent">Create</button>
          <button id="th-cancel" type="button" class="lynx-button">Cancel</button>
        </div>
        <div id="thread-edit" class="inline" hidden>
          <input id="th-edit-name" class="lynx-input" type="text" placeholder="Thread name" autocomplete="off" />
          <button id="th-save" type="button" class="lynx-button lynx-button--primary accent">Save</button>
          <button id="th-edit-cancel" type="button" class="lynx-button">Cancel</button>
        </div>
        <div id="comments-list"></div>
        <div class="inline">
          <textarea id="cm-body" class="lynx-textarea" placeholder="Message… (@slug references a record; image URLs render)" style="min-height:44px"></textarea>
          <button id="cm-post" type="button" class="lynx-button lynx-button--primary accent">Post</button>
        </div>
      </div>
    </details>

    <details id="sec-facts" class="lynx-disclosure" open>
      <summary>History</summary>
      <ul id="facts-list"></ul>
    </details>
  </div>

  <div id="icon" class="iconview" hidden>●</div>

  <script>
    // The blueprint's W-provenance standard (VII.1) grown into the expanded
    // card: GET (recordClicked) shows the record with EVERYTHING editable;
    // CREATE (recordCreate) shows the same fields writable and empty.
    const H = window.LinceWidgetHost;
    // The reusable K6 body editor (slash blocks, @-mentions, block renderer).
    // Optional: a missing module degrades to plain textareas + text bodies.
    const Editor = window.LinceBodyEditor || null;
    const $ = (id) => document.getElementById(id);
    const iconEl = $("icon");
    const WORK_NS = "work";

    // ---- live dot with an "update in flight" state ---------------------------
    let liveNow = false;
    let pendingActs = 0;
    function syncDot() {
      const dot = $("dot");
      dot.classList.toggle("busy", pendingActs > 0);
      dot.classList.toggle("live", liveNow && pendingActs === 0);
    }
    function act(action) {
      pendingActs++; syncDot();
      return H.act(action).finally(() => { pendingActs--; syncDot(); });
    }
    H.onLive((live) => {
      liveNow = live;
      syncDot();
      if (live) flushPendingWork();
    });

    // ---- state ----------------------------------------------------------------
    let unsubscribe = null;
    let creating = false;
    let row = null;           // the focused record's latest protein row
    let fieldsDirty = false;  // user is typing: live updates must not clobber
    let workDirty = false;
    let workLogEdit = null; // { at, start, end }
    let activeThreadUid = null; // which of the record's threads is showing/composing
    let threadSearch = ""; // filters the thread TAB LIST only, not which is active
    let threadEditUid = null;
    let messageEdit = null; // { uid, draft }
    // uid -> {head, slug, kind}; slug -> uid. For pickers, chips, @references.
    let names = {};
    let slugToUid = {};
    H.subscribeProtein("names", { source: "record", limit: 500 }, ({ rows }) => {
      names = {}; slugToUid = {};
      for (const r of rows || []) {
        names[r.uid] = { head: r.head, slug: r.slug, kind: r.kind };
        if (r.slug) slugToUid[r.slug] = r.uid;
      }
      if (row && !creating) renderLinks();
      renderPersonPicker();
      renderTargetSuggestions();
    });

    // Link-kind autocomplete: kinds ARE concepts (2026-07-18).
    let conceptNames = [];
    H.subscribeProtein("concepts", { source: "concept" }, ({ rows }) => {
      conceptNames = [...new Set((rows || []).map((c) => c && c.name).filter(Boolean))].sort();
      renderKindSuggestions();
    });
    function renderKindSuggestions() {
      const list = $("l-kind-suggestions");
      list.innerHTML = "";
      for (const name of conceptNames) {
        const option = document.createElement("option");
        option.value = name;
        list.appendChild(option);
      }
    }
    function renderTargetSuggestions() {
      const list = $("l-target-suggestions");
      list.innerHTML = "";
      for (const slug of Object.keys(slugToUid).sort()) {
        const option = document.createElement("option");
        option.value = slug;
        list.appendChild(option);
      }
    }

    goIdle();

    H.joinRoom("recordClicked");
    H.onLane("recordClicked", (payload) => {
      const record = payload && payload.record ? payload.record : payload;
      const uid = record && (record.uid || record.slug);
      if (!uid) return;
      closeCreate();
      focusRecord(String(uid));
    });

    H.joinRoom("recordCreate");
    H.onLane("recordCreate", (payload) => {
      const seed = payload && payload.record ? payload.record : {};
      openCreate(seed);
    });

    function focusRecord(uid) {
      expand();
      if (typeof unsubscribe === "function") unsubscribe();
      fieldsDirty = false;
      workDirty = false;
      workLogEdit = null;
      activeThreadUid = null; // a different record's threads are unrelated
      threadSearch = "";
      $("thread-search").value = "";
      $("thread-new").hidden = true;
      closeThreadEdit();
      messageEdit = null;
      unsubscribe = H.subscribeProtein(
        "provenance",
        {
          source: "record",
          where: [{ uid_eq: uid }],
          include: {
            facts: { limit: 20 },
            links: { kinds: ["*"], direction: "both" },
            threads: { messages_limit: 50 },
            extension: { namespace: WORK_NS },
          },
        },
        ({ rows }) => {
          if (creating) return;
          row = (rows && rows[0]) || null;
          renderFocus();
        },
      );
    }

    // ---- creation mode -------------------------------------------------------
    function openCreate(seed) {
      expand();
      creating = true;
      $("title").textContent = "New record";
      $("focus").hidden = true;
      $("c-error").hidden = true;
      $("c-head").value = "";
      $("c-slug").value = "";
      $("c-quantity").value = String(Number(seed?.quantity) || 0);
      $("c-body").value = "";
      $("create").classList.add("open");
      $("c-head").focus();
      $("create").dataset.kind = typeof seed?.kind === "string" && seed.kind ? seed.kind : "plain";
    }
    function closeCreate() {
      creating = false;
      $("title").textContent = "Record";
      $("create").classList.remove("open");
    }
    $("c-cancel").addEventListener("click", () => { closeCreate(); goIdle(); });
    $("c-submit").addEventListener("click", async () => {
      const head = $("c-head").value.trim();
      const slug = $("c-slug").value.trim();
      const quantity = Number($("c-quantity").value) || 0;
      const body = $("c-body").value;
      if (!head && !slug) {
        $("c-error").textContent = "Give the record a head (or at least a slug).";
        $("c-error").hidden = false;
        return;
      }
      try {
        const outcome = await act({
          action: "create-record",
          kind: $("create").dataset.kind || "plain",
          head, body, quantity,
        });
        const created = outcome && outcome.created;
        if (slug && created) {
          await act({ action: "set-slug", target: created, slug });
        }
        if (created) await addBodyRefs(String(created), body, []);
        closeCreate();
        if (created) focusRecord(String(created));
        else goIdle();
      } catch (err) {
        $("c-error").textContent = String(err && err.message ? err.message : err);
        $("c-error").hidden = false;
      }
    });

    // ---- icon <-> full panel ----------------------------------------------------
    // Pinned bottom-right; idle by default (just the glyph), expands in place
    // on a recordClicked/recordCreate ABI event, collapses back on Esc or the
    // header's close button — dropping the live subscription each time so a
    // reopen never flashes the previous record's stale data.
    function expand() {
      document.body.classList.remove("collapsed");
      iconEl.hidden = true;
      H.patchCardState({ recordExpanded: true });
    }
    function goIdle() {
      if (typeof unsubscribe === "function") unsubscribe();
      unsubscribe = null;
      row = null;
      creating = false;
      fieldsDirty = false;
      workDirty = false;
      workLogEdit = null;
      activeThreadUid = null;
      threadSearch = "";
      $("thread-search").value = "";
      $("thread-new").hidden = true;
      closeThreadEdit();
      messageEdit = null;
      $("title").textContent = "Record";
      $("focus").hidden = true;
      $("create").classList.remove("open");
      document.body.classList.add("collapsed");
      iconEl.hidden = false;
      H.patchCardState({ recordExpanded: false });
    }
    $("btn-collapse").addEventListener("click", goIdle);
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      const tag = event.target && event.target.tagName;
      // Fields keep editing until explicitly saved/cancelled; the thread-name
      // box has its own local Escape. Only collapse when not mid-typing.
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (creating || row) goIdle();
    });

    // WebKitGTK (Tauri on Linux) known compositor bug: this sand's outer
    // iframe is resized by the parent board (icon -> full panel, see main.js
    // `syncCardNode`'s RECORD_ICON_SIZE handling) at the same moment the
    // fields are populated. WebKitGTK sometimes leaves the resized iframe's
    // paint stale — most of the panel invisible until an unrelated repaint
    // (window focus change, another card interaction) — while Chromium (the
    // browser + `frame.js`'s own preview) always repaints promptly. A forced
    // reflow on the resize this sand's own window receives is a no-op
    // everywhere else and costs nothing.
    window.addEventListener("resize", () => {
      void document.body.offsetHeight;
      requestAnimationFrame(() => { void document.body.offsetHeight; });
    });

    // ---- focused render --------------------------------------------------------
    function renderFocus() {
      if (!row) {
        goIdle();
        return;
      }
      $("focus").hidden = false;
      $("f-name").textContent = row.head || row.slug || row.uid;
      $("f-qty").textContent = `qty ${row.quantity}`;
      if (!fieldsDirty) {
        $("f-head").value = row.head || "";
        $("f-slug").value = row.slug || "";
        $("f-quantity").value = String(row.quantity ?? 0);
        $("f-body").value = row.body || "";
        $("f-save").disabled = true;
        $("f-error").hidden = true;
      }
      renderBodyPreview();
      renderWork();
      renderLinks();
      renderComments();
      renderFacts();
    }

    // ---- editable fields: the get view IS the edit view ------------------------
    for (const id of ["f-head", "f-slug", "f-quantity", "f-body"]) {
      $(id).addEventListener("input", () => { fieldsDirty = true; $("f-save").disabled = false; });
    }
    $("f-body").addEventListener("input", () => renderBodyPreview());
    $("f-save").addEventListener("click", async () => {
      if (!row) return;
      const head = $("f-head").value.trim();
      const slug = $("f-slug").value.trim();
      const quantity = Number($("f-quantity").value) || 0;
      const body = $("f-body").value;
      try {
        if (head !== (row.head || "") || body !== (row.body || "")) {
          await act({ action: "edit-record-text", target: row.uid, head, body });
        }
        if (slug !== (row.slug || "")) {
          await act({ action: "set-slug", target: row.uid, slug: slug || null });
        }
        if (quantity !== (Number(row.quantity) || 0)) {
          await act({ action: "set-quantity", target: row.uid, value: quantity });
        }
        // K6: every resolvable @slug in the body becomes a real `references`
        // link (the ones already linked are skipped, so re-saving is a no-op).
        await addBodyRefs(row.uid, body, linksOf("references", "out").map((l) => l.other));
        fieldsDirty = false;
        $("f-save").disabled = true;
        $("f-error").hidden = true;
      } catch (err) {
        $("f-error").textContent = String(err && err.message ? err.message : err);
        $("f-error").hidden = false;
      }
    });

    // ---- K6: the slash-block editor + rendered body preview --------------------
    const editorNames = () => Object.entries(names)
      .map(([uid, n]) => ({ uid, slug: n.slug, head: n.head }));
    if (Editor) {
      Editor.attach($("f-body"), { getNames: editorNames });
      Editor.attach($("c-body"), { getNames: editorNames });
      Editor.attach($("cm-body"), { getNames: editorNames });
    }
    const refResolver = (token) => {
      const uid = resolveToken(token);
      return uid ? { uid, label: token } : null;
    };
    function renderBodyPreview() {
      const holder = $("f-preview");
      holder.innerHTML = "";
      const source = $("f-body").value;
      holder.hidden = !Editor || !source.trim();
      if (holder.hidden) return;
      holder.appendChild(Editor.renderMarkdown(source, {
        resolveRef: refResolver,
        onNavigate: (uid) => focusRecord(uid),
        onToggle: (lineAt) => toggleBodyLine(lineAt),
      }));
    }
    // Preview checkboxes: clean form -> write immediately (like a kanban card);
    // dirty form -> flip the draft only, Save commits it.
    function toggleBodyLine(lineAt) {
      const area = $("f-body");
      const lines = String(area.value || "").split("\n");
      const m = (lines[lineAt] || "").match(/^(\s*)- \[( |x|X)\] (.*)$/);
      if (!m) return;
      lines[lineAt] = `${m[1]}- [${m[2] === " " ? "x" : " "}] ${m[3]}`;
      const nextBody = lines.join("\n");
      area.value = nextBody;
      if (!fieldsDirty && row) {
        row.body = nextBody;
        renderBodyPreview();
        act({ action: "edit-record-text", target: row.uid, head: row.head || "", body: nextBody })
          .catch((err) => console.warn(err));
      } else {
        fieldsDirty = true;
        $("f-save").disabled = false;
        renderBodyPreview();
      }
    }
    async function addBodyRefs(sourceUid, body, existingUids) {
      REF_RE.lastIndex = 0;
      const seen = new Set(existingUids || []);
      for (let m; (m = REF_RE.exec(body)); ) {
        const uid = resolveToken(m[1]);
        if (uid && uid !== sourceUid && !seen.has(uid)) {
          seen.add(uid);
          await act({ action: "assert-record", subject: sourceUid, predicate: "references", object: uid });
        }
      }
    }

    // ---- Zero vs Delete: two DIFFERENT things (2026-07-17) ---------------------
    // Zero = deactivate (quantity -> 0, record stays). Delete = HARD delete
    // (`delete-record`: gone from every read surface; Ledger history stays).
    $("btn-zero").addEventListener("click", () => {
      if (!row) return;
      act({ action: "deactivate", target: row.uid }).catch((err) => console.warn(err));
    });
    $("btn-delete").addEventListener("click", () => {
      if (!row) return;
      act({ action: "delete-record", target: row.uid }).catch((err) => console.warn(err));
    });

    // ---- Work: dates + estimate + worklogs on the `work` record_extension ------
    // Data model per the standing preset precedent: freestyle record_extension
    // (namespace "work": {start, due, estimate_min, logs:[{start,end}]}).
    function workData() {
      const ext = row && row.extension && typeof row.extension === "object" ? row.extension : {};
      return {
        start: typeof ext.start === "string" ? ext.start : "",
        due: typeof ext.due === "string" ? ext.due : "",
        estimate_min: Number.isFinite(Number(ext.estimate_min)) && ext.estimate_min !== null
          ? Number(ext.estimate_min) : null,
        logs: Array.isArray(ext.logs)
          ? ext.logs.filter((l) => l && typeof l.start === "string") : [],
      };
    }
    const openLog = (work) => work.logs.find((l) => !l.end);
    function datetimeInputValue(iso) {
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return "";
      const local = new Date(date.getTime() - date.getTimezoneOffset() * 60_000);
      return local.toISOString().slice(0, 16);
    }
    function parseLog(startValue, endValue, otherOpen = false) {
      const start = new Date(startValue);
      const end = endValue ? new Date(endValue) : null;
      if (!startValue || Number.isNaN(start.getTime())) return { error: "A work log needs a valid start time." };
      if (endValue && (!end || Number.isNaN(end.getTime()))) return { error: "The end time is invalid." };
      if (end && end < start) return { error: "The end must be after the start." };
      if (!end && otherOpen) return { error: "Pause the running log before opening another." };
      return { log: { start: start.toISOString(), end: end ? end.toISOString() : null } };
    }
    function setWorkLogError(message = "") {
      const error = $("w-log-error");
      error.textContent = message;
      error.hidden = !message;
    }
    function fmtMinutes(min) {
      if (min >= 60) return `${Math.floor(min / 60)}h${String(Math.round(min % 60)).padStart(2, "0")}`;
      return `${Math.round(min)}min`;
    }
    function renderWork() {
      const work = workData();
      if (!workDirty) {
        $("w-start").value = work.start;
        $("w-due").value = work.due;
        $("w-estimate").value = work.estimate_min === null ? "" : String(work.estimate_min);
      }
      const running = openLog(work);
      $("w-play").disabled = !!running;
      $("w-pause").disabled = !running;
      let total = 0;
      const list = $("worklog-list");
      list.innerHTML = "";
      work.logs.forEach((log, at) => {
        const end = log.end ? new Date(log.end) : new Date();
        const minutes = Math.max(0, (end - new Date(log.start)) / 60000);
        total += minutes;
        const editing = workLogEdit?.at === at;
        const rowEl = document.createElement("div");
        rowEl.className = editing ? "logrow editing" : log.end ? "logrow" : "logrow open";
        if (editing) {
          const startInput = document.createElement("input");
          startInput.className = "lynx-input";
          startInput.type = "datetime-local";
          startInput.value = datetimeInputValue(workLogEdit.start);
          startInput.setAttribute("aria-label", "Work log start");
          const endInput = document.createElement("input");
          endInput.className = "lynx-input";
          endInput.type = "datetime-local";
          endInput.value = workLogEdit.end ? datetimeInputValue(workLogEdit.end) : "";
          endInput.setAttribute("aria-label", "Work log end");
          const actions = document.createElement("span");
          actions.className = "log-actions";
          const cancel = document.createElement("button");
          cancel.type = "button";
          cancel.textContent = "Cancel";
          cancel.addEventListener("click", () => { workLogEdit = null; setWorkLogError(); renderWork(); });
          const save = document.createElement("button");
          save.type = "button";
          save.textContent = "Save";
          save.addEventListener("click", () => {
            const otherOpen = work.logs.some((candidate, index) => index !== at && !candidate.end);
            const parsed = parseLog(startInput.value, endInput.value, otherOpen);
            if (parsed.error) { setWorkLogError(parsed.error); return; }
            const work2 = workData();
            work2.logs[at] = parsed.log;
            workLogEdit = null;
            setWorkLogError();
            saveWork(work2);
          });
          actions.append(cancel, save);
          rowEl.append(startInput, endInput, actions);
          list.appendChild(rowEl);
          return;
        }
        const span = document.createElement("span");
        span.className = "span";
        span.textContent = `${shortDate(log.start)} · ${fmtMinutes(minutes)}${log.end ? "" : " (running)"}`;
        const del = document.createElement("button");
        del.type = "button";
        del.textContent = "✕";
        del.title = "Remove this worklog entry";
        del.dataset.logDelete = String(at);
        del.addEventListener("click", () => {
          const work2 = workData();
          work2.logs.splice(at, 1);
          saveWork(work2);
        });
        const edit = document.createElement("button");
        edit.type = "button";
        edit.textContent = "✎";
        edit.title = "Edit this worklog entry";
        edit.addEventListener("click", () => {
          workLogEdit = { at, start: log.start, end: log.end || "" };
          setWorkLogError();
          renderWork();
        });
        rowEl.append(span, edit, del);
        list.appendChild(rowEl);
      });
      const est = work.estimate_min !== null ? ` / est ${fmtMinutes(work.estimate_min)}` : "";
      $("w-total").textContent = work.logs.length ? `${fmtMinutes(total)}${est}` : est.replace(" / ", "");
    }
    // All work writes funnel here; failures queue in localStorage and flush on
    // reconnect (the old sand's offline pending-stop queue, generalized).
    const pendingKey = `lince-recinfo-pending:${H.instanceId || "preview"}`;
    function readPendingWork() {
      try { return JSON.parse(localStorage.getItem(pendingKey) || "[]"); } catch { return []; }
    }
    function queuePendingWork(op) {
      const q = readPendingWork().filter((p) => p.uid !== op.uid); // last write wins per record
      q.push(op);
      try { localStorage.setItem(pendingKey, JSON.stringify(q)); } catch {}
    }
    async function flushPendingWork() {
      const q = readPendingWork();
      if (!q.length) return;
      try { localStorage.setItem(pendingKey, "[]"); } catch {}
      for (const op of q) {
        try {
          await act({ action: "set-extension", target: op.uid, namespace: WORK_NS, fds: op.fds });
        } catch (err) { console.warn(err); queuePendingWork(op); }
      }
    }
    function saveWork(work) {
      if (!row) return;
      const fds = {
        start: work.start || null,
        due: work.due || null,
        estimate_min: work.estimate_min,
        logs: work.logs,
      };
      // optimistic: reflect immediately, then write (or queue when offline)
      row.extension = fds;
      workDirty = false;
      renderWork();
      act({ action: "set-extension", target: row.uid, namespace: WORK_NS, fds })
        .catch((err) => { console.warn(err); queuePendingWork({ uid: row.uid, fds }); });
    }
    for (const id of ["w-start", "w-due", "w-estimate"]) {
      $(id).addEventListener("input", () => { workDirty = true; });
      $(id).addEventListener("change", () => {
        const work = workData();
        work.start = $("w-start").value;
        work.due = $("w-due").value;
        work.estimate_min = $("w-estimate").value === "" ? null : Number($("w-estimate").value);
        saveWork(work);
      });
    }
    $("w-play").addEventListener("click", () => {
      const work = workData();
      if (openLog(work)) return;
      work.logs.push({ start: new Date().toISOString(), end: null });
      saveWork(work);
    });
    $("w-pause").addEventListener("click", () => {
      const work = workData();
      const running = openLog(work);
      if (!running) return;
      running.end = new Date().toISOString();
      saveWork(work);
    });
    $("w-log-add").addEventListener("click", () => {
      const work = workData();
      const parsed = parseLog($("w-log-start").value, $("w-log-end").value, Boolean(openLog(work)));
      if (parsed.error) { setWorkLogError(parsed.error); return; }
      work.logs.push(parsed.log);
      $("w-log-start").value = "";
      $("w-log-end").value = "";
      setWorkLogError();
      saveWork(work);
    });

    // ---- links: assignees / all links (A → B) ---------------------------------
    const linksOf = (kind, direction) => (Array.isArray(row?.links) ? row.links : [])
      .filter((l) => l.kind === kind && l.direction === direction && l.hop === 1);
    const nameOf = (uid) => (names[uid] && (names[uid].head || names[uid].slug)) || String(uid).slice(0, 8);
    const resolveToken = (token) => slugToUid[token] || (names[token] ? token : null);
    function chip(label, { onEdit, onRemove, onClick, dataset } = {}) {
      const el = document.createElement("span");
      el.className = onClick ? "chip nav" : "chip";
      const text = document.createElement("span");
      text.textContent = label;
      el.appendChild(text);
      if (dataset) for (const [k, v] of Object.entries(dataset)) el.dataset[k] = v;
      if (onClick) el.addEventListener("click", onClick);
      if (onEdit) {
        const edit = document.createElement("button");
        edit.type = "button";
        edit.textContent = "✎";
        edit.title = "Rename thread";
        edit.addEventListener("click", (e) => { e.stopPropagation(); onEdit(); });
        el.appendChild(edit);
      }
      if (onRemove) {
        const x = document.createElement("button");
        x.type = "button";
        x.textContent = "✕";
        x.addEventListener("click", (e) => { e.stopPropagation(); onRemove(); });
        el.appendChild(x);
      }
      return el;
    }
    function renderPersonPicker() {
      const pick = $("a-pick");
      const previous = pick.value;
      pick.innerHTML = "";
      const people = Object.entries(names).filter(([, n]) => n.kind === "person");
      for (const [uid, n] of people) {
        const opt = document.createElement("option");
        opt.value = uid;
        opt.textContent = n.head || n.slug || uid;
        pick.appendChild(opt);
      }
      if (!people.length) {
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "no person records yet";
        pick.appendChild(opt);
      }
      if ([...pick.options].some((o) => o.value === previous)) pick.value = previous;
    }
    function renderLinks() {
      if (!row) return;
      // assignees: out `assigned-to` links
      const aList = $("assignee-list");
      aList.innerHTML = "";
      for (const l of linksOf("assigned-to", "out")) {
        aList.appendChild(chip(nameOf(l.other), {
          dataset: { assignee: l.other },
          onRemove: () => act({ action: "retract-record", subject: row.uid, predicate: "assigned-to", object: l.other })
            .catch((err) => console.warn(err)),
        }));
      }
      if (!aList.children.length) aList.appendChild(hintNode("nobody assigned"));
      // Links: EVERY kind, both directions, rendered as A --kind--> B
      // (2026-07-18 — replaces the old part-of-only "Parent & children").
      const lList = $("links-list");
      lList.innerHTML = "";
      const allLinks = (Array.isArray(row?.links) ? row.links : []).filter((l) => l.hop === 1);
      for (const l of allLinks) {
        const rowEl = document.createElement("div");
        rowEl.className = "logrow";
        rowEl.dataset.link = l.uid || "";
        const fromChip = l.direction === "in"
          ? chip(nameOf(l.from), { onClick: () => focusRecord(l.from) })
          : chip("this record");
        const toChip = l.direction === "out"
          ? chip(nameOf(l.to), { onClick: () => focusRecord(l.to) })
          : chip("this record");
        const arrow = document.createElement("span");
        arrow.className = "hint";
        arrow.textContent = `—${l.kind}→`;
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "✕";
        remove.title = "Remove this link";
        remove.addEventListener("click", () => act({ action: "retract-record", subject: l.from, predicate: l.kind, object: l.to })
          .catch((err) => console.warn(err)));
        rowEl.append(fromChip, arrow, toChip, remove);
        lList.appendChild(rowEl);
      }
      if (!lList.children.length) lList.appendChild(hintNode("no links"));
    }
    function hintNode(text) {
      const el = document.createElement("span");
      el.className = "hint";
      el.textContent = text;
      return el;
    }
    $("a-add").addEventListener("click", () => {
      const to = $("a-pick").value;
      if (!row || !to) return;
      act({ action: "assert-record", subject: row.uid, predicate: "assigned-to", object: to }).catch((err) => console.warn(err));
    });
    $("l-add").addEventListener("click", async () => {
      const kind = $("l-kind").value.trim();
      const token = $("l-target").value.trim();
      if (!row || !kind || !token) return;
      const to = resolveToken(token) || token; // slug/uid of an existing record
      if (!to || to === row.uid) return;
      try {
        // A → B: this record links to the target with the chosen kind.
        await act({ action: "assert-record", subject: row.uid, predicate: kind, object: to });
        $("l-target").value = "";
      } catch (err) { console.warn(err); }
    });

    // ---- threads: a REAL multi-thread system, not one flattened message list --
    // (2026-07-18) A record can carry any number of named `thread` records
    // (`create-thread` target+head); each shows as a tab/chip. Only the ACTIVE
    // thread's messages render, and the compose box posts into that thread's
    // uid specifically — switching tabs re-scopes both. `activeThreadUid`
    // resets on focusRecord() (a different record's threads are unrelated) and
    // defaults to the first thread returned (oldest) whenever the previous
    // selection no longer exists in the current row.
    const IMG_RE = /!\[[^\]]*\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s]+\.(?:png|jpe?g|gif|webp)(?:\?[^\s]*)?)/gi;
    const REF_RE = /@([a-z0-9][a-z0-9.\-]*)/gi;
    function commentThreads() {
      return Array.isArray(row?.threads) ? row.threads : [];
    }
    // Deletion is split into two grants (permission system, 2026-07-18):
    // `record:delete` (any record) or `record:delete_own` (only records this
    // viewer created — matched against `created_by`, the raw actor_uid the
    // server resolves alongside `sender`). This is a UI hint only; the engine
    // re-checks the same two permissions when the delete-record Action lands,
    // so a stale/optimistic viewer snapshot here can never over-grant.
    function canDelete(item) {
      const viewer = typeof H.getViewer === "function" ? H.getViewer() : null;
      // Local mode has no actor and the engine deliberately permits normal
      // record deletion there. Do not hide a control the backend will allow.
      if (!viewer || viewer.id == null) return true;
      const perms = Array.isArray(viewer?.permissions) ? viewer.permissions : [];
      if (perms.includes("record:delete")) return true;
      if (perms.includes("record:delete_own")) {
        return item?.created_by != null && String(item.created_by) === String(viewer.id);
      }
      return false;
    }
    function deleteRecordItem(uid) {
      // Deleting a thread or message uses the exact same action as deleting a
      // normal Record. The engine calls check_delete_permission for this
      // action, so this UI hint is never the authorization boundary.
      return act({ action: "delete-record", target: uid }).catch((err) => console.warn(err));
    }
    function closeThreadEdit() {
      threadEditUid = null;
      $("thread-edit").hidden = true;
    }
    function openThreadEdit(thread) {
      threadEditUid = thread.uid;
      $("thread-new").hidden = true;
      $("th-edit-name").value = thread.head || "";
      $("thread-edit").hidden = false;
      $("th-edit-name").focus();
    }
    function activeThread() {
      const threads = commentThreads();
      if (!threads.length) return null;
      return threads.find((t) => t.uid === activeThreadUid) || threads[0];
    }
    function renderComments() {
      const threads = commentThreads();
      const current = activeThread();
      activeThreadUid = current ? current.uid : null;
      renderThreadTabs(threads, current);
      const list = $("comments-list");
      list.innerHTML = "";
      const messages = current && Array.isArray(current.messages) ? current.messages : [];
      if (!threads.length) list.appendChild(hintNode("no threads yet — start one below"));
      else if (!messages.length) list.appendChild(hintNode("no messages in this thread yet"));
      for (const m of messages) {
        const el = document.createElement("div");
        el.className = "msg";
        el.dataset.messageUid = m.uid;
        // Sender + timestamp (2026-07-18): makes the thread read as a real
        // chat conversation, not just a stack of bodies. `sender` resolves
        // server-side (protein's threads_for_record) from the message's
        // creation actor — an app_user id, a DIFFERENT identity namespace
        // than this panel's `names` (record) subscription, so it can't be
        // resolved client-side; it's `null` in local-no-auth mode (no login,
        // every action's actor is None) since there's no one to name.
        const when = m.created_at ? shortDateTime(m.created_at) : "";
        const canDeleteMsg = canDelete(m);
        if (m.sender || when || canDeleteMsg) {
          const meta = document.createElement("div");
          meta.className = "msg-meta";
          const label = document.createElement("span");
          label.textContent = [m.sender, when].filter(Boolean).join(" · ");
          meta.appendChild(label);
          const actions = document.createElement("span");
          actions.className = "msg-actions";
          const edit = document.createElement("button");
          edit.type = "button";
          edit.className = "msg-edit";
          edit.textContent = "edit";
          edit.addEventListener("click", () => {
            messageEdit = { uid: m.uid, draft: String(m.body || "") };
            renderComments();
          });
          actions.appendChild(edit);
          if (canDeleteMsg) {
            const del = document.createElement("button");
            del.type = "button";
            del.className = "msg-delete";
            del.textContent = "delete";
            del.addEventListener("click", () => deleteRecordItem(m.uid));
            actions.appendChild(del);
          }
          meta.appendChild(actions);
          el.appendChild(meta);
        }
        if (messageEdit?.uid === m.uid) {
          const form = document.createElement("div");
          form.className = "message-edit";
          const area = document.createElement("textarea");
          area.className = "lynx-textarea";
          area.value = messageEdit.draft;
          area.setAttribute("aria-label", "Message body");
          area.addEventListener("input", () => { messageEdit.draft = area.value; });
          const actions = document.createElement("div");
          actions.className = "message-edit__actions";
          const cancel = document.createElement("button");
          cancel.type = "button";
          cancel.className = "lynx-button";
          cancel.textContent = "Cancel";
          cancel.addEventListener("click", () => { messageEdit = null; renderComments(); });
          const save = document.createElement("button");
          save.type = "button";
          save.className = "lynx-button lynx-button--primary accent";
          save.textContent = "Save";
          save.addEventListener("click", async () => {
            const body = messageEdit?.draft.trim();
            if (body == null || !body) return;
            try {
              await act({ action: "edit-record-text", target: m.uid, body });
              messageEdit = null;
            } catch (err) { console.warn(err); }
          });
          actions.append(cancel, save);
          form.append(area, actions);
          el.appendChild(form);
          setTimeout(() => area.focus(), 0);
        } else {
          el.appendChild(renderMessageBody(String(m.body || "")));
        }
        list.appendChild(el);
      }
    }
    function renderThreadTabs(threads, current) {
      const wrap = $("thread-tabs");
      wrap.innerHTML = "";
      const query = threadSearch.trim().toLowerCase();
      const visible = query
        ? threads.filter((t) => String(t.head || "").toLowerCase().includes(query))
        : threads;
      for (const t of visible) {
        const el = chip(t.head || "thread", {
          dataset: { thread: t.uid },
          onClick: () => { activeThreadUid = t.uid; renderComments(); },
          onEdit: () => openThreadEdit(t),
          onRemove: canDelete(t) ? () => deleteRecordItem(t.uid) : undefined,
        });
        el.classList.toggle("active", !!current && t.uid === current.uid);
        wrap.appendChild(el);
      }
      if (query && !visible.length) wrap.appendChild(hintNode("no threads match"));
      const addBtn = chip("+ New thread", { dataset: { newThread: "1" } });
      addBtn.classList.add("newthread");
      addBtn.addEventListener("click", () => {
        $("thread-new").hidden = false;
        $("th-name").value = "";
        $("th-name").focus();
      });
      wrap.appendChild(addBtn);
    }
    $("thread-search").addEventListener("input", () => {
      threadSearch = $("thread-search").value;
      renderThreadTabs(commentThreads(), activeThread());
    });
    $("th-cancel").addEventListener("click", () => { $("thread-new").hidden = true; });
    $("th-edit-cancel").addEventListener("click", closeThreadEdit);
    $("th-create").addEventListener("click", async () => {
      const name = $("th-name").value.trim();
      if (!row || !name) return;
      try {
        const made = await act({ action: "create-thread", target: row.uid, head: name });
        if (made && made.created) activeThreadUid = made.created;
        $("thread-new").hidden = true;
      } catch (err) { console.warn(err); }
    });
    $("th-name").addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); $("th-create").click(); }
      else if (e.key === "Escape") { $("thread-new").hidden = true; }
    });
    $("th-save").addEventListener("click", async () => {
      const head = $("th-edit-name").value.trim();
      if (!threadEditUid || !head) return;
      try {
        await act({ action: "edit-record-text", target: threadEditUid, head });
        closeThreadEdit();
      } catch (err) { console.warn(err); }
    });
    $("th-edit-name").addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); $("th-save").click(); }
      else if (e.key === "Escape") { closeThreadEdit(); }
    });
    // Body -> nodes via the shared K6 renderer (same blocks everywhere);
    // regex fallback keeps @hops + images when the module is unavailable.
    function renderMessageBody(body) {
      const holder = document.createElement("div");
      holder.className = "body";
      if (Editor) {
        holder.appendChild(Editor.renderMarkdown(body, {
          resolveRef: refResolver,
          onNavigate: (uid) => focusRecord(uid),
        }));
        return holder;
      }
      const images = [];
      let text = body.replace(IMG_RE, (match, mdUrl, bareUrl) => {
        images.push(mdUrl || bareUrl);
        return "";
      });
      let last = 0;
      REF_RE.lastIndex = 0;
      for (let m; (m = REF_RE.exec(text)); ) {
        const uid = resolveToken(m[1]);
        if (!uid) continue;
        holder.appendChild(document.createTextNode(text.slice(last, m.index)));
        const ref = document.createElement("button");
        ref.type = "button";
        ref.className = "ref";
        ref.textContent = `@${m[1]}`;
        ref.dataset.ref = uid;
        ref.addEventListener("click", () => focusRecord(uid));
        holder.appendChild(ref);
        last = m.index + m[0].length;
      }
      holder.appendChild(document.createTextNode(text.slice(last)));
      for (const url of images) {
        const img = document.createElement("img");
        img.src = url;
        img.loading = "lazy";
        img.alt = "";
        holder.appendChild(img);
      }
      return holder;
    }
    $("cm-post").addEventListener("click", async () => {
      const body = $("cm-body").value.trim();
      if (!row || !body) return;
      try {
        // No thread exists yet at all (brand new record): posting still works
        // by starting a default-named one, same as before this became a real
        // multi-thread system — it just no longer forces every later comment
        // onto that same thread.
        let threadUid = activeThreadUid;
        if (!threadUid) {
          const made = await act({ action: "create-thread", target: row.uid, head: "General" });
          threadUid = made && made.created;
          activeThreadUid = threadUid;
        }
        if (!threadUid) return;
        const posted = await act({ action: "create-message", thread: threadUid, body });
        // every resolvable @slug becomes a real `references` link from the message
        const messageUid = posted && posted.created;
        if (messageUid) {
          REF_RE.lastIndex = 0;
          const seen = new Set();
          for (let m; (m = REF_RE.exec(body)); ) {
            const uid = resolveToken(m[1]);
            if (uid && !seen.has(uid)) {
              seen.add(uid);
              await act({ action: "assert-record", subject: messageUid, predicate: "references", object: uid });
            }
          }
        }
        $("cm-body").value = "";
      } catch (err) { console.warn(err); }
    });

    // ---- facts ------------------------------------------------------------------
    function renderFacts() {
      const ul = $("facts-list");
      ul.innerHTML = "";
      const facts = Array.isArray(row?.facts) ? row.facts : [];
      if (facts.length === 0) {
        const li = document.createElement("li");
        li.className = "none"; li.textContent = "no facts yet";
        ul.appendChild(li);
      }
      for (const f of facts) {
        const li = document.createElement("li");
        const d = document.createElement("span");
        const sign = f.delta > 0 ? "pos" : f.delta < 0 ? "neg" : "zero";
        d.className = `delta ${sign}`;
        d.textContent = f.delta > 0 ? `+${f.delta}` : `${f.delta}`;
        const c = document.createElement("span");
        c.className = "cause";
        c.textContent = f.cause_kind + (f.cause ? ` · ${f.cause}` : "");
        const w = document.createElement("span");
        w.className = "when"; w.textContent = shortTime(f.at);
        li.append(d, c, w);
        ul.appendChild(li);
      }
    }

    function shortTime(iso) {
      try { return new Date(iso).toLocaleTimeString(); } catch { return ""; }
    }
    function shortDate(iso) {
      try { return new Date(iso).toLocaleDateString(); } catch { return ""; }
    }
    function shortDateTime(iso) {
      if (!iso) return "";
      try {
        const d = new Date(iso);
        const now = new Date();
        const sameDay = d.toDateString() === now.toDateString();
        return sameDay ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
          : `${d.toLocaleDateString()} ${d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
      } catch { return ""; }
    }
  </script>
</body>
</html>
