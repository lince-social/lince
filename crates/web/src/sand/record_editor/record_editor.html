<link rel="stylesheet" href="/board/lynx-ui.css" />
<script src="/board/lynx-ui.js"></script>
<style>
  .re { display: flex; height: 100%; min-height: 0; font: 13px/1.4 var(--font-body, sans-serif); }
  .re__side { width: 200px; flex: 0 0 200px; border-right: 1px solid var(--line, #ddd); overflow-y: auto; }
  .re__main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .re__row { padding: 6px 8px; cursor: pointer; border-bottom: 1px solid var(--line-soft, #eee); }
  .re__row.is-selected { background: var(--surface-2, #f2f2f2); }
  .re__head { flex: 0 0 auto; padding: 6px 8px; border-bottom: 1px solid var(--line, #ddd); }
  .re__head input { width: 100%; }
  .re__bodywrap { flex: 1 1 auto; position: relative; min-height: 0; }
  .re__body { width: 100%; height: 100%; resize: none; border: 0; padding: 8px; font: inherit; }
  .re__status { flex: 0 0 auto; padding: 4px 8px; font-size: 12px; opacity: 0.75; display: flex; gap: 10px; }
  .re__peer { display: inline-flex; align-items: center; gap: 4px; }
  .re__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent, #47f); display: inline-block; }
  /* Idle is dimmed rather than hidden: someone who stepped away is still in
     the document, and removing them would read as "they left". */
  .re__peer.is-idle { opacity: 0.45; }
  .re__empty { padding: 12px; opacity: 0.7; }
</style>

<div class="re">
  <aside class="re__side">
    <div class="re__head"><strong>Records</strong></div>
    <div id="re-list"></div>
  </aside>
  <section class="re__main">
    <div class="re__head">
      <input id="re-title" class="lynx-input" placeholder="Title" disabled />
    </div>
    <div class="re__bodywrap">
      <textarea id="re-body" class="re__body" placeholder="Pick a record to edit it." disabled></textarea>
    </div>
    <div class="re__status">
      <span id="re-state">Not editing</span>
      <span id="re-peers"></span>
    </div>
  </section>
</div>

<script type="module">
  const H = window.LinceWidgetHost;
  const $ = (id) => document.getElementById(id);

  // The vendored loro-crdt, same origin. Nothing is fetched from anywhere
  // else — the bundle and its wasm are served by this Cell (Ontology §11).
  const loro = await import("/board/vendor/loro-index.js");
  await loro.default();
  const { LoroDoc } = loro;
  // The same element every embed uses. Kanban card bodies, relation nodes and
  // table cells are not different features — they are this, in a different
  // box — so the delta bookkeeping and the caret handling live in one place.
  const { createCollabEditor, bindInputs } = await import("/board/collab-editor.js");
  // A password-locked description (anicca/Secrets.md) never joins the shared
  // doc: a character-wise merge over an envelope would leave ciphertext
  // nobody's password opens. It is unlocked in the Record sand instead.
  const Vault = await import("/board/vault.js");

  let records = [];
  let selected = null;
  let editor = null;
  let bound = null;
  // Presence is the shared element's job now, not this sand's: cursors,
  // selection ranges, idle and peer expiry are the same in every box that
  // edits a Record, so they live beside the document. This sand only renders
  // what it is handed.
  let peers = [];

  H.subscribeProtein("re_records", {
    source: "record",
    where: [{ any: [{ kind_eq: "plain" }, { kind_eq: "message" }] }],
    order: [{ asc: "head" }],
  }, ({ rows }) => {
    records = Array.isArray(rows) ? rows : [];
    renderList();
  });

  function renderList() {
    const list = $("re-list");
    list.innerHTML = "";
    if (!records.length) {
      list.innerHTML = '<div class="re__empty">Nothing to edit yet.</div>';
      return;
    }
    for (const row of records) {
      const item = document.createElement("div");
      item.className = "re__row" + (row.uid === selected ? " is-selected" : "");
      item.textContent = row.head || "Untitled";
      item.onclick = () => open(row.uid);
      list.appendChild(item);
    }
  }

  function open(uid) {
    if (bound) bound.detach();
    if (editor) editor.destroy();
    bound = null;
    selected = uid;
    peers = [];
    renderList();
    renderPeers();
    const row = records.find((one) => one.uid === uid);
    if (row && Vault.isLocked(row.body || "")) {
      $("re-title").value = row.head || "";
      $("re-body").value = "";
      $("re-body").placeholder = Vault.LOCKED_LABEL + " — unlock it in the Record sand.";
      $("re-title").disabled = true;
      $("re-body").disabled = true;
      $("re-state").textContent = Vault.LOCKED_LABEL;
      return;
    }
    $("re-body").placeholder = "Pick a record to edit it.";
    $("re-state").textContent = "Joining…";

    // The shared element does the joining, the delta bookkeeping and the
    // caret-preserving write. The server pushes the merged doc on every
    // change — a sibling tab, another Person, or a peer Organ syncing in all
    // arrive the same way, and imports dedupe by version vector.
    editor = createCollabEditor({
      recordUid: uid,
      host: H,
      LoroDoc,
      field: "body",
      surface: {
        read: () => ({ head: $("re-title").value, body: $("re-body").value }),
        write: (text) => bound.surfaceWrite(text),
      },
      onError: (message) => { $("re-state").textContent = message; },
      // Cursors, selection ranges, idle and peer expiry all arrive resolved.
      // This sand renders the list; it decides nothing about who is in it.
      onPresence: (list) => { peers = list; renderPeers(); },
    });
    // One call wires input -> localEdit, the caret-preserving write, and the
    // selection reporting for BOTH fields, so presence follows the caret from
    // the title into the body without this sand tracking which one has focus.
    bound = bindInputs(editor, { headEl: $("re-title"), bodyEl: $("re-body") });
    editor.join();
    $("re-state").textContent = "Editing";

    $("re-title").disabled = false;
    $("re-body").disabled = false;
  }

  function renderPeers() {
    const host = $("re-peers");
    host.innerHTML = "";
    for (const peer of peers) {
      const span = document.createElement("span");
      span.className = "re__peer" + (peer.idle ? " is-idle" : "");
      const dot = document.createElement("span");
      dot.className = "re__dot";
      const label = document.createElement("span");
      // Unnamed is a real state, not a failure: it means this viewer may not
      // know who that is. Showing "someone" is honest; inventing a name is
      // not — and the connection id this used to print was not a name at all.
      const where =
        peer.focus !== peer.anchor
          ? `${peer.anchor}–${peer.focus}`
          : String(peer.anchor);
      label.textContent =
        (peer.name || "someone") +
        " " +
        peer.field +
        " @" +
        where +
        (peer.idle ? " (idle)" : "");
      span.append(dot, label);
      host.appendChild(span);
    }
  }

  renderList();
</script>
