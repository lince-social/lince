[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false

[features]
authoring = ["dep:axum", "dep:glam", "dep:gltf", "dep:image"]

[dependencies]
zip.workspace = true
glam = { version = "=0.33.7", default-features = false, features = ["std"], optional = true }
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names", "extras"], optional = true }
image = { workspace = true, optional = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
lince-interface = { workspace = true, default-features = false }
axum = { workspace = true, optional = true }
tokio = { workspace = true, features = ["net"] }
serde_json = { workspace = true }
base64 = { workspace = true }
lince-ailuros.workspace = true

[dev-dependencies]
axum.workspace = true
glam = { version = "=0.33.7", default-features = false, features = ["std"] }
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names", "extras"] }
image.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["process"] }

[lints]
workspace = true
