<!doctype html>
<html lang="en" data-mode="dark" data-style="lynx">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LynxUI — Lynx</title>
  <script>
    try {
      const parameters = new URLSearchParams(location.search);
      const requestedMode = parameters.get("mode");
      const requestedStyle = parameters.get("style");
      document.documentElement.dataset.mode = requestedMode === "light" || requestedMode === "dark"
        ? requestedMode
        : localStorage.getItem("lynxui-lynx-mode") || "dark";
      document.documentElement.dataset.style = requestedStyle === "lynx" || requestedStyle === "catppuccin-macchiato"
        ? requestedStyle
        : localStorage.getItem("lynxui-style") || "lynx";
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="../../crates/web/static/presentation/board/lynx-ui.css">
  <link rel="stylesheet" href="../../crates/web/src/sand/lynx_ui/demo.css">
  <link rel="stylesheet" href="../../crates/web/src/sand/lynx_ui/styles/catppuccin-macchiato.css">
</head>
<body class="lynx-ui">
  <script src="../../crates/web/static/presentation/board/lynx-ui.js"></script>
  <script src="../../crates/web/src/sand/lynx_ui/demo.js"></script>
</body>
</html>
