[tasks.release]
description = "Automated release workflow"
tools = { "cargo:git-cliff" = "latest", "cargo:cargo-edit" = "latest", "gh" = "latest" }
run = "./scripts/other/release.sh"

[tasks.dev]
description = "Run Lince in test_lince without a tray icon or stopping the service"
run = "bash scripts/interface/run-dev.sh"

[tasks.test]
description = "Run the isolated development instance"
run = "bash scripts/interface/run-dev.sh"

[tasks.lince]
description = "Run Lince: the Cell runtime plus its native interface, one process"
run = "nix develop .#interface -c cargo run --release -p lince"

[tasks.server]
description = "Run Lince headless (no window)"
run = "cargo run --release -p lince --no-default-features -- --server"

[tasks.facade]
description = "Run Lince headless with the browser Facade"
run = "cargo run --release -p lince --no-default-features --features facade -- --server --facade"

[tasks.test-all]
description = "Run all Rust tests in the workspace"
run = "cargo test --workspace --all-targets"

[tasks.stop]
run = "systemctl --user stop lince; nix develop"

[tasks.nix]
run = """
mprocs --names hx,claude,codex,git,shell,run,restart \
    "hx ." \
    "claude" \
    "codex" \
    "lazygit" \
    "$SHELL" \
    "systemctl --user stop lince; nix develop" \
    "systemctl --user restart lince;" \
"""
