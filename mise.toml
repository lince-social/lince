[tasks.release]
description = "Automated release workflow"
tools = { "cargo:git-cliff" = "latest", "cargo:cargo-edit" = "latest", "gh" = "latest" }
run = "./scripts/other/release.sh"

[tasks.dev]
description = "Run an independent Lince and open its native interface"
run = "bash scripts/interface/run-dev.sh"

[tasks.test]
run = """
systemctl --user stop lince.service
mprocs --names lince,test,lynxui-web,lynxui-package \
    "cargo watch -x run" \
    "cargo watch -x 'run -- --port 6176 --data-dir /home/user/.config/test_lince'" \
    # "mise run lynxui-serve" \
    # "mise run lynxui-watch"
"""

[tasks.lynxui]
description = "Run the LynxUI Gallery at http://127.0.0.1:6175 and hot-swap its Sand package"
run = """
mprocs --names web,package \
    "mise run lynxui-serve" \
    "mise run lynxui-watch"
"""

[tasks.interface]
description = "Run the favored native Lince interface on NixOS"
run = "nix develop .#desktop -c cargo run --release -p lince-desktop"

[tasks.interface-native]
description = "Run the favored native Lince interface on NixOS"
run = "nix develop .#desktop -c cargo run --release -p lince-desktop"

[tasks.interface-legacy]
description = "Run the legacy Web interface at http://127.0.0.1:6174 and open it in the default browser"
run = "nix develop .#legacy -c bash scripts/interface/run-legacy.sh"

[tasks.interface-lab]
description = "Run the human-visible Native Interface Laboratory"
run = "nix develop .#interface -c cargo run --release --manifest-path crates/interface/Cargo.toml --bin lince-interface"

[tasks.interface-lab-report]
description = "Render one ownership-preflight frame, export its report, and exit"
run = "nix develop .#interface -c cargo run --release --manifest-path crates/interface/Cargo.toml --bin lince-interface -- --export-report-and-exit"

[tasks.interface-lab-audit]
description = "Audit every native-interface candidate dependency graph and export a report"
run = "nix develop .#interface -c cargo run --release --manifest-path crates/interface/Cargo.toml --bin lince-interface-dependency-audit"

[tasks.interface-lab-bevy]
description = "Run the Lince-owned host with manually initialized Bevy render resources"
run = "nix develop .#interface -c cargo run --release --manifest-path crates/interface/Cargo.toml --bin lince-interface --features bevy-preflight"

[tasks.interface-lab-bevy-report]
description = "Render the manual-Bevy host, export its ownership report and exit"
run = "nix develop .#interface -c cargo run --release --manifest-path crates/interface/Cargo.toml --bin lince-interface --features bevy-preflight -- --export-report-and-exit"

[tasks.interface-lab-bevy-stress]
description = "Run the manual-Bevy host resize stress, export its report, and exit"
run = "nix develop .#interface -c cargo run --release --manifest-path crates/interface/Cargo.toml --bin lince-interface --features bevy-preflight -- --stress-resize-and-exit"

[tasks.interface-lab-cef]
description = "Run the accelerated CEF installed-Sand and Website seam"
run = "nix develop .#interface -c cargo run --release --manifest-path crates/interface/Cargo.toml --features cef-runtime --bin lince-interface-cef-diagnostic"

[tasks.interface-lab-cef-report]
description = "Exercise the accelerated CEF seam, export its report, close browsers, and exit"
run = "nix develop .#interface -c cargo run --release --manifest-path crates/interface/Cargo.toml --features cef-runtime --bin lince-interface-cef-diagnostic -- --export-report-and-exit"

[tasks.interface-lab-spatial-report]
description = "Exercise current Protein, Sand composition, Areas and physics candidates"
run = "nix develop .#interface -c cargo run --release --manifest-path crates/interface/Cargo.toml --features semantic-spatial --bin lince-interface-spatial-diagnostic"

[tasks.interface-lab-parity-report]
description = "Export browser and read-only Facade projections of the shared Sand fixture"
run = "nix develop .#interface -c cargo run --release --manifest-path crates/interface/Cargo.toml --features browser-parity --bin lince-interface-parity-diagnostic"

[tasks.interface-lab-joined]
description = "Run the joined native, Bevy, Sand, Area and accelerated-CEF laboratory"
run = "nix develop .#interface -c cargo run --release --manifest-path crates/interface/Cargo.toml --features joined-runtime --bin lince-interface-cef-diagnostic"

[tasks.interface-lab-joined-report]
description = "Exercise the joined v1 runtime seam, export its report, close browsers, and exit"
run = "nix develop .#interface -c cargo run --release --manifest-path crates/interface/Cargo.toml --features joined-runtime --bin lince-interface-cef-diagnostic -- --joined-report-and-exit"

[tasks.interface-lab-cef-count-matrix]
description = "Measure the joined runtime with 0, 1, 4 and 12 admitted CEF Sands"
run = '''
nix develop .#interface -c bash -eu -c '
for count in 0 1 4 12; do
  cargo run --release --manifest-path crates/interface/Cargo.toml --features joined-runtime --bin lince-interface-cef-diagnostic -- --joined-report-and-exit --warmup-seconds 1 --sample-seconds 5 --cef-count "$count" --report "target/interface-laboratory/matrix/cef-$count.json"
done
jq -s '\''{
  schema_version: 1,
  gate: "CEF admission count matrix",
  status: if ((.[0:3] | all(.status == "passed" and .host.window_system == "wayland" and .joined.fixed_step_backlog_steps == 0 and .joined.frame_p95_millis <= 16.67 and .joined.frame_p99_millis <= 25.0)) and (.[3].status == "passed" and .[3].host.window_system == "wayland" and .[3].joined.fixed_step_backlog_steps == 0)) then "passed" else "failed" end,
  cases: map({cef_count, window_system: .host.window_system, frame_p95_millis: .joined.frame_p95_millis, frame_p99_millis: .joined.frame_p99_millis, input_p95_millis: .joined.input_to_present_call_p95_millis, fixed_step_backlog_steps: .joined.fixed_step_backlog_steps, family_surface_bytes: ([.surfaces[].gpu | .latest_width * .latest_height * 4] | add // 0), source_fingerprint_sha256})
}'\'' target/interface-laboratory/matrix/cef-{0,1,4,12}.json >target/interface-laboratory/matrix/cef-summary.json
jq -e '\''.status == "passed"'\'' target/interface-laboratory/matrix/cef-summary.json >/dev/null
'
'''

[tasks.interface-lab-wayland-report]
description = "Measure native and CEF composition on the compositor-provided Wayland scale"
run = "nix develop .#interface -c cargo run --release -p lince-interface --features joined-runtime --bin lince-interface-cef-diagnostic -- --joined-report-and-exit --warmup-seconds 2 --sample-seconds 12 --cef-count 2 --report target/interface-laboratory/wayland/report.json"

[tasks.interface-lab-benchmark]
description = "Run three 30-second warmup and 120-second joined samples with raw traces"
run = "nix develop .#interface -c bash scripts/interface/benchmark.sh"

[tasks.interface-lab-recovery-report]
description = "Induce CEF renderer and WGPU device loss and export joined recovery evidence"
run = "nix develop .#interface -c cargo run --release --manifest-path crates/interface/Cargo.toml --features joined-runtime --bin lince-interface-cef-diagnostic -- --joined-report-and-exit --recovery-probe --warmup-seconds 2 --sample-seconds 12 --report target/interface-laboratory/recovery/report.json"

[tasks.interface-lab-accessibility-report]
description = "Traverse and operate the joined AccessKit tree through AT-SPI and Orca"
run = "nix develop .#interface -c bash scripts/interface/accessibility-probe.sh"

[tasks.interface-lab-lifetime-report]
description = "Run ten joined create, destroy and resource-plateau cycles"
run = "nix develop .#interface -c bash scripts/interface/lifetime-probe.sh"

[tasks.interface-desktop-report]
description = "Run the production desktop entry through the joined native host against the live local Lince server"
run = "nix develop .#desktop -c cargo run --release -p lince-desktop -- --joined-report-and-exit --warmup-seconds 2 --sample-seconds 12 --report target/interface-laboratory/desktop/report.json"

[tasks.test-all]
description = "Run all Rust tests in the workspace"
run = "cargo test --workspace --all-targets"

[tasks.stop]
run = "systemctl --user stop lince; nix develop"

[tasks.nix]
run = """
mprocs --names hx,claude,codex,git,shell,run,restart \
    "hx ." \
    "claude" \
    "codex" \
    "lazygit" \
    "$SHELL" \
    "systemctl --user stop lince; nix develop" \
    "systemctl --user restart lince;" \
"""
