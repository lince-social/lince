[package]
name = "lince-plugin-nomad"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Unplugged, tokenless NOMAD source discovery and connected Lingua export"

# Intentionally independent: no changes to Lince's members, lockfile or installer.
[workspace]
resolver = "3"

[dependencies]
anicca = { path = "../../crates/anicca" }
nucleus = { path = "../../crates/nucleus" }
plugins = { package = "lince-plugins", path = "../../crates/plugins" }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "io-std", "macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
axum = "0.8.9"

[lints.rust]
warnings = "deny"

[profile.dev]
debug = "line-tables-only"
