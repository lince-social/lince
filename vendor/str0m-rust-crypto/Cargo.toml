[package]
edition = "2024"
rust-version = "1.85.0"
name = "str0m-rust-crypto"
version = "0.6.0"
authors = ["Martin Algesten <martin@algesten.se>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Pure Rust crypto backend for str0m WebRTC"
license = "MIT OR Apache-2.0"
repository = "https://github.com/algesten/str0m"

[lib]
name = "str0m_rust_crypto"
path = "src/lib.rs"

[dependencies.aes]
version = "0.8"

[dependencies.aes-gcm]
version = "0.10"

[dependencies.ctr]
version = "0.9"

[dependencies.dimpl]
version = "0.7.1"
features = [
    "rust-crypto",
]
default-features = false

[dependencies.hmac]
version = "0.12.1"

[dependencies.p256]
version = "0.13"
features = ["ecdh"]

[dependencies.sha1]
version = "0.10"

[dependencies.sha2]
version = "0.10"
features = ["oid"]

[dependencies.str0m-proto]
version = "0.7.0"
features = ["dtls"]
default-features = false

[dependencies.time]
version = "0.3"

[dependencies.x509-cert]
version = "=0.2.5"
features = ["builder"]

[dependencies.rand_core]
version = "0.6"
features = ["getrandom"]
